function submitManualIgnore(id){ const reason=$('#manualIgnoreReason').value.trim(); if(!reason){toast('请填写忽略原因');return;} const m=state.manuals.find(x=>x.id===reviewId); if(!m) return; const r=manualReviewState(m,reviewLang); const issue=buildReviewIssues(m,reviewLang,manualDocChapters(m,reviewLang)).find(i=>i.id===id); if(!issue||issue.severity==='blocker'){toast('阻断项不能忽略');return;} r.issueStates[id]={status:'ignored',reason,resolvedAt:Date.now(),resolvedBy:ROLE[role].person}; pushManualAudit(m,'ignore','忽略警告',issue.title,'品牌方售后',reviewLang,reason); closeAll(); save(); render(); toast('已记录忽略原因'); }
function confirmManualIssue(id){ const m=state.manuals.find(x=>x.id===reviewId); if(!m) return; const r=manualReviewState(m,reviewLang); const issue=buildReviewIssues(m,reviewLang,manualDocChapters(m,reviewLang)).find(i=>i.id===id); if(!issue) return; r.issueStates[id]={status:'fixed',reason:'品牌方确认保留 AI 补充内容',resolvedAt:Date.now(),resolvedBy:ROLE[role].person}; pushManualAudit(m,'confirm','确认 AI 补充内容',issue.title,'品牌方售后',reviewLang,'确认保留'); save(); render(); toast('已确认保留，并记录审核痕迹'); }
function openFixWeightModal(id){ const m=state.manuals.find(x=>x.id===id); if(!m) return; const p=state.products.find(x=>x.id===m.product); openModal(`<div class="drawer-h"><h3>补充最大用户体重</h3><div class="sp" style="flex:1"></div><button class="x" onclick="closeAll()">×</button></div><div class="drawer-b"><p class="muted small" style="margin-top:0">该字段属于产品档案，保存后会同步影响 ${p.id} 的所有说明书合规检查。</p><div class="field"><label>最大用户体重（kg）</label><input class="input" id="manualWeightFix" type="number" value="${p.maxUserWeight||''}" placeholder="150"></div><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeAll()">取消</button><button class="btn primary" onclick="submitManualWeightFix('${id}')">写入并重新检查</button></div></div>`); }
function submitManualWeightFix(id){ const m=state.manuals.find(x=>x.id===id); const p=state.products.find(x=>x.id===m.product); const w=+$('#manualWeightFix').value; if(!(w>50&&w<400)){toast('请输入 50–400 之间的数值');return;} p.maxUserWeight=w; m.checks=manualChecks(m); if(m.reviewByLang) for(const l of m.langs) if(m.reviewByLang[l]) delete m.reviewByLang[l].issueStates.weight; pushManualAudit(m,'weight','补充最大用户体重',`${p.id} 已写入 ${w} kg`,'品牌方售后','产品档案'); closeAll(); save(); render(); toast('已写入产品档案并重新检查'); }
function approveManualLanguage(id){ const m=state.manuals.find(x=>x.id===id); if(!m||role!=='brand'||m.status!=='review') return; const issues=buildReviewIssues(m,reviewLang,manualDocChapters(m,reviewLang)); const st=manualIssueStats(issues); if(st.openBlockers||st.openWarnings){toast('请先处理所有阻断项和警告');return;} const r=manualReviewState(m,reviewLang); r.status='approved'; r.approvedAt=Date.now(); r.approvedBy=ROLE[role].person; r.dirty=false; pushManualAudit(m,'approved','批准语种',`${manualLangName(reviewLang)} 版已完成签署`,'品牌方售后',reviewLang); save(); render(); const ready=m.langs.every(l=>manualReviewState(m,l).status==='approved'); toast(ready?'所有语种已批准，可以交付工厂':`${manualLangName(reviewLang)} 已批准，其他语种仍待审核`); }
function reopenManualLanguage(id){ const m=state.manuals.find(x=>x.id===id); if(!m||role!=='brand'||m.status!=='review') return; const r=manualReviewState(m,reviewLang); const prev=r.status; r.status='pending'; r.approvedAt=null; r.approvedBy=null; pushManualAudit(m,'reopen','重新打开语种',`${manualLangName(reviewLang)} 版从「${prev==='approved'?'已批准':'已处理'}」恢复为待审核`,'品牌方售后',reviewLang); save(); render(); toast(`${reviewLang} 审核已重新打开`); }
function requestManualDelivery(id){ const m=state.manuals.find(x=>x.id===id); if(!m||role!=='brand'||m.status==='delivered') return; if(!m.langs.every(l=>manualReviewState(m,l).status==='approved')){toast('所有语种批准后才能交付');return;} const p=state.products.find(x=>x.id===m.product); openModal(`<div class="drawer-h"><h3>交付工厂</h3><div class="sp" style="flex:1"></div><button class="x" onclick="closeAll()">×</button></div><div class="drawer-b"><div class="notice" style="margin-bottom:14px"><span>✓</span><div>${m.langs.length} 个语种均已批准。交付后版本 v${m.version} 将冻结，并作为已审核说明书写入知识库。</div></div><div class="card card-b" style="background:#FAFBFC"><b>${Engine.productName(m.product)} · ${m.product}</b><div class="small muted" style="margin-top:6px">${m.market} · ${esc(m.template)} · ${m.langs.map(manualLangName).join(' / ')}<br>${p.maxUserWeight?`最大用户体重 ${p.maxUserWeight} kg`:''}</div></div><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" onclick="closeAll()">取消</button><button class="btn primary" onclick="deliverManual('${m.id}')">确认交付</button></div></div>`); }
function deliverManual(id){ const m=state.manuals.find(x=>x.id===id); if(!m||role!=='brand'||!m.langs.every(l=>manualReviewState(m,l).status==='approved')) return; const p=state.products.find(x=>x.id===m.product); m.status='delivered'; m.doneAt=Date.now(); m.deliveredAt=Date.now(); for(const l of m.langs) if(!p.manualLangs.includes(l)) p.manualLangs.push(l); for(const l of m.langs) state.kbFiles.push({id:uid(),n:`${m.product} 用户手册 ${l} v${m.version}（AI 生成，已审核）.pdf`,t:'说明书',src:'说明书生成',st:'已入库',at:Date.now(),p:m.product,size:'3.8 MB'}); pushManualAudit(m,'delivered','交付工厂',`版本 v${m.version} 已冻结，${m.langs.length} 个语种写入知识库`,'杨梦',m.langs.join('/')); closeAll(); save(); manualView='list'; render(); toast(`${m.id} 已交付工厂，${m.langs.join('、')} 版已入知识库`); }
function openReturnManual(id){ const m=state.manuals.find(x=>x.id===id); if(!m||role!=='brand'||m.status!=='review') return; openModal(`<div class="drawer-h"><h3>退回 AI 重新生成</h3><div class="sp" style="flex:1"></div><button class="x" onclick="closeAll()">×</button></div><div class="drawer-b"><p class="muted small" style="margin-top:0">当前审核稿和问题处理记录会作为历史版本保留，新版本生成完成后重新进入审核。</p><div class="field"><label>退回原因（必填）</label><textarea class="input" id="manualReturnReason" placeholder="说明需要重新生成的范围或原因"></textarea></div><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeAll()">取消</button><button class="btn primary" onclick="submitReturnManual('${id}')">确认退回</button></div></div>`); }
function submitReturnManual(id){ const reason=$('#manualReturnReason').value.trim(); if(!reason){toast('请填写退回原因');return;} const m=state.manuals.find(x=>x.id===id); if(!m) return; m.versions.push({version:m.version,archivedAt:Date.now(),reason,review:JSON.parse(JSON.stringify(m.reviewByLang||{}))}); pushManualAudit(m,'return','退回重新生成',`版本 v${m.version} 已归档`,'品牌方售后',m.langs.join('/'),reason); m.version++; m.status='generating'; m.progress=18; m.checks=null; for(const l of m.langs){const r=manualReviewState(m,l);r.status='pending';r.edits={};r.issueStates={};r.viewed={};r.dirty=false;r.approvedAt=null;r.approvedBy=null;} closeAll(); save(); manualView='list'; render(); toast(`${m.id} 已退回，正在生成 v${m.version}`); }
function manualPreviewHtml(m,lang){ const chapters=manualDocChapters(m,lang),r=manualReviewState(m,lang); return `<div class="manual-preview"><article class="manual-paper"><h3>${Engine.productName(m.product)}</h3><div class="muted small" style="margin-bottom:20px">${manualLangName(lang)} · v${m.version} · ${m.market} · ${esc(m.template)}</div>${chapters.map(ch=>`<section class="manual-preview-chapter"><b>${esc(ch.title)}</b>${ch.output.map((line,i)=>{const pid=`${ch.id}-${i}`;return `<div class="manual-preview-line ${line.includes('WARNING')?'ai-add':''}">${manualRich(r.edits[pid]!==undefined?r.edits[pid]:line)}</div>`;}).join('')}</section>`).join('')}</article></div>`; }
function openManualPreview(id,lang){ const m=state.manuals.find(x=>x.id===id); if(!m) return; openModal(`<div class="drawer-h"><h3>说明书预览</h3><span class="muted small">${m.product} · ${lang} · v${m.version}</span><div class="sp" style="flex:1"></div><button class="btn sm" onclick="printManualPreview('${id}','${lang}')">打印 / 存为 PDF</button><button class="x" onclick="closeAll()">×</button></div>${manualPreviewHtml(m,lang)}`,true); }
function printManualPreview(id,lang){ const m=state.manuals.find(x=>x.id===id); if(!m) return; const r=manualReviewState(m,lang); const html=`<!doctype html><html lang="${lang.toLowerCase()}"><head><meta charset="utf-8"><title>${m.id} ${m.product} ${lang}</title><style>body{font:13px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#171C22;max-width:760px;margin:40px auto;padding:0 36px}h1{font-size:24px}h2{font-size:16px;margin-top:28px;border-bottom:1px solid #ddd;padding-bottom:6px}p{margin:0 0 8px}.warn{background:#FFF2CC;padding:4px}</style></head><body><h1>${Engine.productName(m.product)}</h1><p>${manualLangName(lang)} · v${m.version} · ${m.market}</p>${manualDocChapters(m,lang).map(ch=>`<h2>${esc(ch.title)}</h2>${ch.output.map((line,i)=>`<p class="${line.includes('WARNING')?'warn':''}">${esc(manualClean(r.edits[ch.id+'-'+i]??line))}</p>`).join('')}`).join('')}</body></html>`; const w=window.open('','_blank'); if(!w){toast('浏览器阻止了打印窗口');return;} w.document.write(html); w.document.close(); setTimeout(()=>w.print(),300); }
function downloadManualFormat(id,lang,format){ const m=state.manuals.find(x=>x.id===id); if(!m) return; if(role==='factory'&&m.status!=='delivered'){toast('交付后才能下载');return;} const r=manualReviewState(m,lang); const body=manualDocChapters(m,lang).map(ch=>`<h2>${esc(ch.title)}</h2>${ch.output.map((line,i)=>`<p>${esc(manualClean(r.edits[ch.id+'-'+i]??line))}</p>`).join('')}`).join(''); if(format==='docx'||format==='clips'){ const title=format==='clips'?'安装步骤脚本':'用户说明书'; const html=`<!doctype html><html><head><meta charset="utf-8"><title>${title}</title></head><body><h1>${Engine.productName(m.product)} ${title}</h1>${body}</body></html>`; download(`${m.id}_${m.product}_${lang}_v${m.version}.${format==='docx'?'doc':'txt'}`,html,format==='docx'?'application/msword':'text/plain'); toast(format==='docx'?'DOCX 兼容文档已导出':'步骤脚本已导出'); return; } const lines=manualDocChapters(m,lang).flatMap(ch=>[`==== ${ch.title} ====`,...ch.output.map((line,i)=>manualClean(r.edits[ch.id+'-'+i]??line)),'']); download(`${m.id}_${m.product}_${lang}_v${m.version}.txt`,lines.join('\n')); }
function openManualAnimationSteps(id){ const m=state.manuals.find(x=>x.id===id); if(!m) return; const steps=['固定底座并确认水平','安装立柱与连接横梁','装入配重片与导杆','安装滑轮架和钢缆','调整钢缆张力并检查走线','安装护罩并完成安全测试']; openModal(`<div class="drawer-h"><h3>3D 安装动画步骤</h3><span class="muted small">${m.product} · 18 个镜头</span><div class="sp" style="flex:1"></div><button class="x" onclick="closeAll()">×</button></div><div class="drawer-b"><p class="muted small" style="margin-top:0">原型不伪造视频缩略图，这里展示已生成的动画步骤清单。</p><ol style="padding-left:20px;line-height:1.9">${steps.map(x=>`<li>${x}</li>`).join('')}</ol><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeAll()">关闭</button><button class="btn primary" onclick="downloadManualFormat('${m.id}','${m.langs[0]}','clips')">下载步骤脚本</button></div></div>`); }
function downloadManual(id){ const m=state.manuals.find(x=>x.id===id); if(!m) return; const p=state.products.find(x=>x.id===m.product); const lines=[`${m.id} ${Engine.productName(m.product)} 说明书交付包（原型导出）`,`版本：v${m.version}  语种：${m.langs.join('、')}  市场：${m.market}  模板：${m.template}`,`输出：${m.outputs.join(', ')}`,'',...m.langs.flatMap(l=>{const r=manualReviewState(m,l);return [`==== ${l} ====`,...manualDocChapters(m,l).flatMap(ch=>[`-- ${ch.title} --`,...ch.output.map((x,i)=>manualClean(r.edits[ch.id+'-'+i]??x))]),p.maxUserWeight?`Max user weight: ${p.maxUserWeight} kg`:'','']}),]; download(`${m.id}_${m.product}_manual_v${m.version}.txt`,lines.join('\n')); toast('交付包文本已导出'); }

/* ================= 二维码管理（设计_批次_v1 §4）：三档粒度 型号 / 批次 / 供应商，读写 state.qrCodes ================= */
const H5_FILE='原型_H5扫码端.html';
const QR_MODES=[['product','一型号一码'],['batch','按批次'],['supplier','按供应商']];
// 型号的基础链接（不带 q）：只用于没有码记录时的展示兜底
function qrUrl(p){ return `https://h5.ironpeak.support/s/${p.toLowerCase()}`; }
let qrQuery='';
function qrFilteredProducts(){ const q=qrQuery.trim().toLowerCase(); return state.products.filter(p=>{ const hay=`${p.series} ${p.seriesEn||''} ${p.id} ${p.sku||''} ${p.snPrefix||''}`.toLowerCase(); return !q||hay.includes(q); }); }
function qrModeOf(pid){ const m=(state.qrMode||{})[pid]; return QR_MODES.some(x=>x[0]===m)?m:'product'; }
function setQrMode(pid,m){ if(!QR_MODES.some(x=>x[0]===m)) return; if(!state.qrMode) state.qrMode={}; state.qrMode[pid]=m; save(); refreshQrGrid(); }
function qrFind(pid,scope,val){ return state.qrCodes.find(c=>c.product===pid&&c.scope===scope&&(scope==='product'||c.scopeValue===val))||null; }
function qrSyncProduct(pid){ const p=state.products.find(x=>x.id===pid); if(p) p.qr=state.qrCodes.some(c=>c.product===pid); }
// 预览 H5：本地扫码端 + 与正式 URL 相同的 q / b / f 参数
function qrPreviewHref(c){ let u=`${H5_FILE}?m=${encodeURIComponent(c.product)}&q=${c.id}`; if(c.scope==='batch') u+=`&b=${encodeURIComponent(c.scopeValue)}`; else if(c.scope==='supplier') u+=`&f=${encodeURIComponent(c.scopeValue)}`; return u; }
function qrFileName(c,fmt){ return `QR_${c.product}_${c.scope==='product'?'product':String(c.scopeValue).replace(/[\\/:*?"<>|\s]+/g,'_')}.${fmt}`; }
function qrSuppliersOf(pid){ const m=new Map(); for(const b of BATCH.listFor(pid)) if(b.supplier){ if(!m.has(b.supplier)) m.set(b.supplier,[]); m.get(b.supplier).push(b.code); } return [...m].map(([name,codes])=>({name,codes})); }
function qrSeg(pid){ const cur=qrModeOf(pid); return `<div class="qr-seg" role="radiogroup" aria-label="二维码粒度">${QR_MODES.map(([k,l])=>`<button class="${k===cur?'on':''}" data-mode="${k}" role="radio" aria-checked="${k===cur}" onclick="setQrMode('${qrJs(pid)}','${k}')">${l}</button>`).join('')}</div>`; }
// 内联 onclick 的单引号字符串参数：先转义 JS，再转义 HTML 属性
const qrJs=s=>esc(String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
function qrActs(c){ return `<span class="qr-acts"><a onclick="downloadQr('${c.id}','svg')">下载 SVG</a><a onclick="downloadQr('${c.id}','png')">PNG</a><a href="${esc(qrPreviewHref(c))}" target="_blank">预览 H5</a><a class="del" onclick="deleteQr('${c.id}')">删除</a></span>`; }
// 一行 = 一个批次或一家供应商；有码显示缩略图与操作，无码显示占位与「生成」
function qrRow(pid,scope,val,title,sub){ const c=qrFind(pid,scope,val);
  return `<div class="qr-row${c?'':' none'}" data-scope="${scope}" data-val="${esc(val)}"><div class="qr-thumb">${c?QR.svg(c.url,{quiet:1}):'<span>未生成</span>'}</div>
    <div class="qr-row-main"><div class="row" style="gap:8px"><b class="num">${esc(title)}</b><span class="muted small qr-row-sub">${esc(sub)}</span><span class="sp" style="flex:1"></span>${c?`<span class="small num" title="${esc(c.url)}">${c.id} · <b>${c.scans}</b> 扫</span>`:`<button class="btn sm" onclick="genQr('${qrJs(pid)}','${scope}','${qrJs(val)}')">生成</button>`}</div>${c?qrActs(c):''}</div></div>`; }
function qrCardHead(p){ return `<div class="row qr-card-h"><div style="min-width:0"><div style="font-weight:650;white-space:nowrap">${p.series} ${p.id}</div><div class="muted small num">${p.sku||'—'} · 序列号前缀 ${p.snPrefix||'—'}</div></div><div class="sp" style="flex:1"></div>${qrSeg(p.id)}</div>`; }
function qrProductBody(p){ const c=qrFind(p.id,'product'); const others=state.qrCodes.filter(x=>x.product===p.id&&x.scope!=='product'); const nb=others.filter(x=>x.scope==='batch').length, ns=others.length-nb;
  const otherNote=others.length?`<div class="small muted" style="margin-top:8px">另有${nb?` 批次码 ${nb} 个`:''}${nb&&ns?' ·':''}${ns?` 供应商码 ${ns} 个`:''}，切换上方粒度查看。</div>`:'';
  if(!c) return `<div class="row" style="gap:16px;align-items:flex-start;margin-top:12px"><div class="qr-missing"><div><b>未生成</b><span>售后二维码</span></div></div><div style="flex:1;min-width:0"><div class="row"><span class="tag grey">待生成</span></div><div class="small muted" style="margin-top:10px">生成后可在产品标签旁印刷固定售后码。</div>${otherNote}</div></div><div class="row" style="margin-top:14px"><button class="btn sm primary" onclick="genQr('${qrJs(p.id)}')">生成二维码</button></div>`;
  const h5=state.tickets.filter(t=>t.product===p.id&&t.channel==='h5'&&t.createdAt>Date.now()-30*DAY); const emails=h5.filter(t=>t.cust.email&&!t.cust.email.includes('anonymous')).length;
  return `<div class="row" style="gap:16px;align-items:flex-start;margin-top:12px"><div class="qr">${QR.svg(c.url,{quiet:1})}</div><div style="flex:1;min-width:0"><div class="row"><span class="tag green">已生成</span><span class="muted small num" style="margin-left:6px">${c.id}</span></div><div class="muted small num" style="word-break:break-all;margin-top:4px">${c.url}</div><div class="small" style="margin-top:8px">近 30 天扫码 <b class="num">${c.scans}</b> 次<br>转化为工单 <b class="num">${h5.length}</b> · 留邮箱 <b class="num">${emails}</b></div>${otherNote}</div></div><div class="row" style="margin-top:14px;flex-wrap:wrap"><button class="btn sm" onclick="downloadQr('${c.id}','svg')">下载 SVG</button><button class="btn sm" onclick="downloadQr('${c.id}','png')">下载 PNG</button><a class="btn sm ghost" href="${esc(qrPreviewHref(c))}" target="_blank">预览 H5 →</a><span class="sp" style="flex:1"></span><button class="btn sm ghost" onclick="deleteQr('${c.id}')">删除</button></div>`; }
function qrBatchBody(p){ const list=BATCH.listFor(p.id).slice().sort((a,b)=>(b.shippedAt||0)-(a.shippedAt||0));
  if(!list.length) return `<div class="empty qr-rows-empty"><b>这个型号还没有出货批次</b>批次从订单生成，有订单后再按批次出码。</div>`;
  const missing=list.filter(b=>!qrFind(p.id,'batch',b.code)).length;
  return `<div class="row qr-rows-h"><span class="muted small">${list.length} 个批次 · 已生成 ${list.length-missing}</span><span class="sp" style="flex:1"></span><button class="btn sm${missing?' primary':''}" ${missing?'':'disabled'} onclick="genQrAllBatches('${qrJs(p.id)}')">为全部未生成的批次生成</button></div>
    <div class="qr-rows">${list.map(b=>qrRow(p.id,'batch',b.code,b.code,b.supplier||'供应商未知')).join('')}</div>`; }
function qrSupplierBody(p){ const sups=qrSuppliersOf(p.id);
  if(!sups.length) return `<div class="empty qr-rows-empty"><b>还没有供应商</b>供应商取自该型号批次的生产工厂，有订单后出现。</div>`;
  return `<div class="row qr-rows-h"><span class="muted small">${sups.length} 家供应商 · 来自该型号的批次</span></div>
    <div class="qr-rows">${sups.map(s=>qrRow(p.id,'supplier',s.name,s.name,'批次 '+s.codes.join('、'))).join('')}</div>`; }
function qrCard(p){ const m=qrModeOf(p.id); return `<div class="card card-b qr-card" data-prod="${p.id}" data-mode="${m}">${qrCardHead(p)}${m==='batch'?qrBatchBody(p):m==='supplier'?qrSupplierBody(p):qrProductBody(p)}</div>`; }
function qrGridHtml(){ const list=qrFilteredProducts(); if(!list.length) return `<div class="card card-b empty" style="padding:52px 20px"><b>没有匹配的产品</b>换个型号、系列或 SKU 搜索。</div>`; return `<div class="grid g3">${list.map(qrCard).join('')}</div>`; }
function qrStatsText(){ const n=k=>state.qrCodes.filter(c=>c.scope===k).length; return `${state.qrCodes.length} 个码 · 型号码 ${n('product')} · 批次码 ${n('batch')} · 供应商码 ${n('supplier')}`; }
function refreshQrGrid(){ const grid=$('#qrGrid'); if(!grid) return; grid.innerHTML=qrGridHtml(); const count=$('#qrCount'); if(count) count.textContent=`${qrFilteredProducts().length} / ${state.products.length} 个产品`; const st=$('#qrStats'); if(st) st.textContent=qrStatsText(); }
PAGES.qr=()=>`
<div class="page-h"><div><h2>二维码管理</h2><p>售后码印在产品标签旁，每个型号可选一型号一码、按批次或按供应商出码；不做一物一码。客户扫码后拍标签，AI 识别序列号。</p></div><div class="sp"></div><div class="qr-search"><input class="input" id="qrSearch" placeholder="搜索产品、型号或 SKU" value="${esc(qrQuery)}" oninput="qrQuery=this.value;refreshQrGrid()" aria-label="搜索产品"></div></div>
<div class="row" style="margin:-4px 0 12px"><span class="muted small" id="qrCount">${qrFilteredProducts().length} / ${state.products.length} 个产品</span><span class="sp" style="flex:1"></span><span class="muted small num" id="qrStats">${qrStatsText()}</span></div>
<div id="qrGrid">${qrGridHtml()}</div>
<div class="card" style="margin-top:16px"><div class="card-h"><h3>印刷建议</h3></div><div class="card-b small muted">二维码最小 18 × 18 mm，与现有序列号标签并排放置；码下方印一行说明（"Scan for support · 扫码获取售后"）。三档怎么选：一型号一码最省印刷，换批次不用重印；按批次便于追溯和批次召回；按供应商用于多家工厂同时供货时区分责任。每个码都带记录编号 q，扫码数按码分别统计；本原型中"预览 H5"会在新标签打开扫码端并带上同样的参数。</div></div>`;
// 生成：幂等，同一 (型号, 档, 值) 已有码时直接返回已有记录
function genQr(id,scope='product',val=null){ const p=state.products.find(x=>x.id===id); if(!p) return null; const ex=qrFind(id,scope,val); if(ex){ toast(`${ex.id} 已存在`); return ex; }
  const c=newQrCode(state,id,scope,val); qrSyncProduct(id); save(); refreshQrGrid(); toast(`${id}${scope==='batch'?' 批次 '+val:scope==='supplier'?' · '+val:''} 的售后二维码已生成（${c.id}）`); return c; }
function genQrAllBatches(id){ const add=BATCH.listFor(id).filter(b=>!qrFind(id,'batch',b.code)).map(b=>newQrCode(state,id,'batch',b.code)); qrSyncProduct(id); save(); refreshQrGrid(); toast(add.length?`已为 ${id} 的 ${add.length} 个批次生成二维码`:`${id} 的批次都已有二维码`); return add.length; }
function deleteQr(qid){ const c=state.qrCodes.find(x=>x.id===qid); if(!c) return; if(!confirm(`删除 ${c.id}？已印刷的码扫了之后会退回计入型号码（如有）。`)) return; state.qrCodes=state.qrCodes.filter(x=>x!==c); qrSyncProduct(c.product); save(); refreshQrGrid(); toast(`${c.id} 已删除`); }
// 参数可以是码记录 id（Q-0004）或型号（兼容旧调用：取该型号的型号码）
function downloadQr(ref,fmt){ const c=state.qrCodes.find(x=>x.id===ref)||qrFind(ref,'product'); if(!c){ toast('还没有生成这个码'); return; } const svg=QR.svg(c.url,{quiet:2,width:600}); const name=qrFileName(c,fmt); if(fmt==='svg'){ download(name,svg,'image/svg+xml'); return; } const img=new Image(); img.onload=()=>{ const cv=document.createElement('canvas'); cv.width=cv.height=600; const g=cv.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,600,600); g.drawImage(img,0,0,600,600); cv.toBlob(b=>{ const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),2000); },'image/png'); }; img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg); }

/* ================= 订单与协作邀请 ================= */
let orderSel=null, orderTab='orders';
// 型号筛选（从产品管理批次行跳来，§10-1 降级：只按型号筛，不按批次过滤）；orderBatchHl 是要高亮的批次徽章
let orderProd='', orderBatchHl=null;
function clearOrderProd(){ orderProd=''; orderBatchHl=null; render(); }
function orderBatchTags(o){ return (o.batches||[]).map(c=>{ const b=BATCH.of(o.product,c); const hl=orderBatchHl&&orderBatchHl.product===o.product&&orderBatchHl.code===c;
  return `<span class="tag grey batch-tag${hl?' sel':''}" data-batch="${c}">${c}</span>${b&&b.supplier&&b.supplier!==o.factory?' '+supplierMismatchTag(b.supplier,[o.factory]):''}`; }).join(' '); }
const SCOPE_LABEL={brand:'品牌方',org:'组织默认',order:'仅此订单'};
const ROLE_LABEL={b:'品牌方',f:'工厂接口人',d:'分销商',eng:'工厂工程师'};
function memberChip(m,extra){ return `<span class="member ${m.status==='pending'?'pend':''}" title="${esc(m.email)}${m.title?' · '+esc(m.title):''}"><i class="${m.role==='eng'?'f':m.role}">${esc(m.name[0])}</i>${esc(m.name)}${m.status==='pending'?' · 待接受':''}${extra||''}</span>`; }
PAGES.orders=()=>{ const list=myOrders().filter(o=>!orderProd||o.product===orderProd); const sel=list.find(o=>o.id===orderSel)||list[0]; const missing=ordersWithoutFactory();
  return `
<div class="page-h"><div><h2>订单与协作邀请</h2><p>不设固定链条。合作方的接口人默认覆盖该组织的全部订单，单张订单可以换人或移除；工厂工程师按工单临时拉入。客诉升级到工厂时必须有接口人，否则 AI 会拦下并建议邀请。</p></div><div class="sp"></div>${role==='brand'?`<label class="btn" style="cursor:pointer"><input type="file" accept=".csv,text/csv" style="display:none" onchange="importOrders(this.files)">导入 CSV</label><button class="btn" onclick="openNewOrder()">新建订单</button><button class="btn primary" onclick="openInvite()">邀请协作</button>`:''}</div>
${role==='brand'&&missing.length?`<div class="notice" style="margin-bottom:16px"><span>⚠</span><div><b>${missing.map(o=>o.id).join('、')} 还没有工厂接口人。</b>这些订单的客诉无法升级到工厂。<a onclick="openInvite('${missing[0].id}')">现在邀请 ${missing[0].factory} 的联系人</a></div></div>`:''}
<div class="card">
<div class="tabs"><button class="${orderTab==='orders'?'on':''}" onclick="orderTab='orders';render()">订单 <span class="muted">(${list.length})</span></button>${orderProd&&orderTab==='orders'?`<span class="tag grey filter-chip" id="orderProdChip" style="align-self:center;margin:0 8px">型号 ${esc(orderProd)} <a onclick="clearOrderProd()" title="清除型号筛选">✕</a></span>`:''}${role==='brand'?`<button class="${orderTab==='partners'?'on':''}" onclick="orderTab='partners';render()">合作方与联系人 <span class="muted">(${state.partners.length})</span></button>`:''}</div>
${orderTab==='orders'?`<table class="tb"><tr><th>订单</th><th>商品 / 批次</th><th>工厂 → 接口人</th><th>分销商 → 联系人</th><th>其他成员</th><th>进行中客诉</th><th>发货</th><th>来源</th></tr>
${list.map(o=>{ const ms=orderMembers(o); const f=factoryContact(o); const d=ms.find(m=>m.role==='d'); const others=ms.filter(m=>m.role!=='b'&&!(f&&m.email===f.email)&&!(d&&m.email===d.email)); const open=state.tickets.filter(t=>t.order===o.id&&t.status!=='done').length; return `<tr class="trow ${sel&&sel.id===o.id?'sel':''}" onclick="orderSel='${o.id}';render()"><td class="num">${o.id}</td><td>${Engine.productName(o.product)} × ${o.qty}<div class="sub">批次 ${orderBatchTags(o)}</div></td><td>${esc(o.factory)}<div class="sub">${f?memberChip(f):`<span class="tag red">缺少接口人</span> ${role==='brand'?`<a class="small" onclick="event.stopPropagation();openInvite('${o.id}')">邀请</a>`:''}`}</div></td><td>${esc(o.dealer)}<div class="sub">${d?memberChip(d):'<span class="muted small">未邀请（可选）</span>'}</div></td><td>${others.map(m=>memberChip(m)).join('')||'<span class="muted small">—</span>'}</td><td class="num">${open}</td><td class="muted num">${o.ship}</td><td class="muted small">${o.source||'手动'}</td></tr>`; }).join('')}</table>`
:partnersTable()}
</div>
${sel&&orderTab==='orders'?orderDetail(sel):''}`; };
function orderDetail(o){ const ms=orderMembers(o); const tl=state.tickets.filter(t=>t.order===o.id).flatMap(t=>t.timeline.map(e=>({...e,tid:t.id}))).sort((a,b)=>b.t-a.t).slice(0,8); const pending=ms.filter(m=>m.status==='pending'); return `
<div class="grid" style="grid-template-columns:360px 1fr;margin-top:16px">
<div class="card"><div class="card-h"><h3>${o.id} 的协作成员</h3><div class="sp"></div>${role==='brand'?`<button class="btn sm" onclick="openInvite('${o.id}')">邀请</button>`:''}</div>
<div class="card-b" style="padding-top:8px">${ms.map(m=>`<div class="check" style="align-items:center"><div style="flex:1"><div>${memberChip(m)} <span class="tag grey">${ROLE_LABEL[m.role]}</span></div><div class="muted small" style="margin-top:3px">${esc(m.email)} · ${SCOPE_LABEL[m.scope]}${m.scope==='org'?'（覆盖该组织全部订单）':''}</div></div>${role==='brand'&&m.role!=='b'?`<div class="row" style="gap:4px">${m.status==='pending'?`<button class="btn sm ghost" onclick="acceptOne('${esc(m.email)}')">模拟接受</button>`:''}${m.scope==='org'?`<button class="btn sm ghost" onclick="excludeFromOrder('${o.id}','${esc(m.email)}')">此订单移除</button>`:`<button class="btn sm ghost danger" onclick="revokeOverride('${o.id}','${esc(m.email)}')">撤销</button>`}</div>`:''}</div>`).join('')}
${(o.excluded||[]).length?`<div class="muted small" style="margin-top:8px">已在此订单移除：${o.excluded.map(e=>`${esc(e)} <a onclick="restoreToOrder('${o.id}','${esc(e)}')">恢复</a>`).join('、')}</div>`:''}
<div class="muted small" style="margin-top:10px">工厂接口人是客诉二级升级的接收人；工厂看到的工单会隐藏客户身份，回复经品牌方放行后由 AI 翻译发给客户。</div></div></div>
<div class="card"><div class="card-h"><h3>${Engine.productName(o.product)} × ${o.qty} 的最近客服时间线</h3></div>
<div class="card-b">${tl.length?`<ul class="tl">${tl.map(e=>`<li class="${e.who}"><div class="t">${fmt(e.t)}</div><div><div class="who">${WHO[e.who]} <a class="small num" onclick="openTicket('${e.tid}')">${e.tid}</a></div><div class="msg">${esc(maskText(e).length>160?maskText(e).slice(0,160)+'…':maskText(e))}</div></div></li>`).join('')}</ul>`:'<div class="empty"><b>这张订单还没有客诉</b>终端用户扫码或发邮件后会出现在这里</div>'}</div></div>
</div>`; }
function partnersTable(){ return `<div class="card-b" style="padding-bottom:0"><div class="row" style="justify-content:space-between"><span class="muted small">组织级联系人默认接收该组织全部订单的协作；"默认覆盖"关掉后只对被单独邀请的订单生效。</span><button class="btn sm" onclick="openNewPartner()">新增合作方</button></div></div>
<table class="tb" style="margin-top:12px"><tr><th>合作方</th><th>类型</th><th>联系人</th><th>默认覆盖全部订单</th><th>覆盖订单</th><th>状态</th><th></th></tr>
${state.partners.flatMap(p=>{ const orders=state.orders.filter(o=>o.factory===p.name||o.dealer===p.name); if(!p.contacts.length) return [`<tr><td style="font-weight:600">${esc(p.name)}</td><td>${p.type==='factory'?'工厂':'分销商'}</td><td class="muted" colspan="3">还没有联系人 · 涉及 ${orders.length} 张订单${p.type==='factory'&&orders.length?'，<span style="color:var(--red)">客诉无法升级</span>':''}</td><td></td><td><button class="btn sm primary" onclick="openInvite(null,'${esc(p.name)}')">邀请联系人</button></td></tr>`]; return p.contacts.map((c,i)=>`<tr>${i===0?`<td style="font-weight:600" rowspan="${p.contacts.length}">${esc(p.name)}</td><td rowspan="${p.contacts.length}">${p.type==='factory'?'工厂':'分销商'}</td>`:''}<td>${esc(c.name)}<div class="sub">${esc(c.email)}${c.title?' · '+esc(c.title):''}</div></td><td><button class="switch ${c.defaultAll?'on':''}" onclick="toggleDefault('${esc(p.name)}','${esc(c.email)}')"></button></td><td class="num muted small">${c.defaultAll?orders.filter(o=>!(o.excluded||[]).includes(c.email)).map(o=>o.id).join('、')||'—':state.orders.filter(o=>(o.overrides||[]).some(m=>m.email===c.email)).map(o=>o.id).join('、')||'—'}</td><td>${c.status==='active'?'<span class="tag green">已激活</span>':'<span class="tag amber">待接受</span>'}</td><td><div class="row" style="gap:4px">${c.status==='pending'?`<button class="btn sm ghost" onclick="acceptOne('${esc(c.email)}')">模拟接受</button>`:''}<button class="btn sm ghost danger" onclick="revokeContact('${esc(p.name)}','${esc(c.email)}')">撤销</button></div></td></tr>`); }).join('')}</table>`; }
function toggleDefault(org,email){ const c=partnerOf(org).contacts.find(x=>x.email===email); c.defaultAll=!c.defaultAll; let n=0; if(!c.defaultAll){ const lost=state.orders.filter(o=>(o.factory===org||o.dealer===org)&&!(o.overrides||[]).some(m=>m.email===email)).map(o=>o.id); n=recallFrom(email,lost,`${c.name} 不再默认覆盖 ${org} 的订单`); } save(); render(); if(n) toast(`${c.name} 名下 ${n} 张工单已退回品牌方`); }
function revokeContact(org,email){ const p=partnerOf(org); if(!confirm(`撤销 ${email} 的全部协作权限？`)) return; p.contacts=p.contacts.filter(x=>x.email!==email); for(const o of state.orders){ o.overrides=(o.overrides||[]).filter(m=>m.email!==email); } const n=recallFrom(email,null,`工厂接口人 ${email} 已被撤销`); save(); render(); toast(n?`已撤销，${n} 张工单退回品牌方`:'已撤销'); }
function excludeFromOrder(oid,email){ const o=state.orders.find(x=>x.id===oid); o.excluded=(o.excluded||[]).concat(email); const n=recallFrom(email,[oid],`接口人已从订单 ${oid} 移除`); save(); render(); if(n) toast(`${n} 张工单已退回品牌方`); }
function restoreToOrder(oid,email){ const o=state.orders.find(x=>x.id===oid); o.excluded=(o.excluded||[]).filter(e=>e!==email); save(); render(); }
function revokeOverride(oid,email){ const o=state.orders.find(x=>x.id===oid); o.overrides=(o.overrides||[]).filter(m=>m.email!==email); const stillHas=orderMembers(o).some(m=>m.email===email); const n=stillHas?0:recallFrom(email,[oid],`订单级邀请已撤销`); save(); render(); if(n) toast(`${n} 张工单已退回品牌方`); }
function acceptOne(email){ let n=0; for(const p of state.partners) for(const c of p.contacts) if(c.email===email&&c.status==='pending'){ c.status='active'; n++; } for(const o of state.orders) for(const m of (o.overrides||[])) if(m.email===email&&m.status==='pending'){ m.status='active'; n++; } for(const t of state.tickets){ if(t.assignee&&t.assignee.email===email&&t.assignee.status==='pending'){ t.assignee.status='active'; if(t.status==='factory') t.statusSince=Date.now(); addEntry(t,'sys',`${t.assignee.name} 已接受邀请，现在可以查看并回复此工单；二级时限（${Policy.slaHours('l2')} 小时）从现在起算。`); } for(const c of (t.collab||[])) if(c.email===email&&c.status==='pending'){ c.status='active'; addEntry(t,'sys',`${c.name} 已接受邀请，加入此工单协作。`); } } save(); render(); toast(n?`${email} 已接受邀请`:'已更新'); }
function acceptInvite(oid){ const o=state.orders.find(x=>x.id===oid); for(const m of orderMembers(o)) if(m.status==='pending') acceptOne(m.email); }

/* ---- 邀请：组织级默认 / 订单级覆盖 / 工单级工程师 ---- */
function openInvite(orderId,orgName,ticketId){ const o=orderId?state.orders.find(x=>x.id===orderId):null; const t=ticketId?tById(ticketId):null; const org=orgName||(o?o.factory:''); const p=org?partnerOf(org):null; const orgOptions=state.partners.map(x=>`<option value="${esc(x.name)}" ${x.name===org?'selected':''}>${esc(x.name)}（${x.type==='factory'?'工厂':'分销商'}）</option>`).join('')+`<option value="__new">新组织…</option>`;
  openModal(`<div class="drawer-h"><h3>${t?`邀请接口人接手工单 ${t.id}`:'邀请协作'}</h3><div class="sp" style="flex:1"></div><button class="x" onclick="closeAll()">×</button></div><div class="drawer-b">
${t?`<div class="notice" style="margin-bottom:14px"><span>i</span><div>订单 ${o.id} 的工厂 <b>${esc(o.factory)}</b> 还没有接口人。邀请邮件会直接带着这张工单，对方接受后即可查看并回复（客户身份不对工厂展示）。</div></div>`:''}
<div class="field"><label>组织</label><select class="select" id="iv_org" onchange="invOrgChanged()">${orgOptions}</select><input class="input" id="iv_org_new" placeholder="新组织名称" style="display:none;margin-top:6px"><div class="row" style="margin-top:6px;gap:12px"><label class="small"><input type="radio" name="iv_type" value="factory" checked> 工厂</label><label class="small"><input type="radio" name="iv_type" value="dealer"> 分销商</label></div></div>
<div class="field"><label>联系人</label><select class="select" id="iv_contact" onchange="invContactChanged()"></select>
<div id="iv_newc" class="grid g2" style="margin-top:6px"><input class="input" id="iv_name" placeholder="姓名"><input class="input" id="iv_mail" placeholder="邮箱"><input class="input" id="iv_title" placeholder="职务（可选）"></div></div>
<div class="field"><label>范围</label>
<div class="check"><input type="radio" name="iv_scope" value="org" ${!(o&&p&&p.contacts.some(c=>c.defaultAll))?'checked':''} onchange="ivScopeChanged()"> <div>该组织的<b>所有订单</b>（默认接口人，新订单自动带上）</div></div>
<div class="check"><input type="radio" name="iv_scope" value="orders" ${o?'checked':''} onchange="ivScopeChanged()"> <div>指定订单 <span class="muted small" id="iv_order_count"></span></div></div><input type="radio" name="iv_scope" value="order" style="display:none" aria-hidden="true">
<div id="iv_orders" style="margin:2px 0 0 30px;max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:none">
<div class="row" style="gap:8px;margin-bottom:6px"><button class="btn sm ghost" onclick="ivOrderAll(true)">全选</button><button class="btn sm ghost" onclick="ivOrderAll(false)">清空</button>${o?`<button class="btn sm ghost" onclick="ivOrderOnly('${o.id}')">只选当前订单</button>`:''}</div>
${invOrdersHtml(org,o?[o.id]:[])}
</div></div>
<div class="field"><label>权限</label>
<div class="check"><button class="switch on" disabled></button><div>查看范围内的工单（客户身份脱敏）与说明书任务</div></div>
<div class="check"><button class="switch on" id="iv_reply" onclick="this.classList.toggle('on')"></button><div>回复工单（回复经品牌方放行后由 AI 翻译发给客户）</div></div>
<div class="check"><button class="switch on" id="iv_invite" onclick="this.classList.toggle('on')"></button><div>按工单邀请自己的内部工程师</div></div></div>
<div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeAll()">取消</button><button class="btn primary" onclick="sendInvite(${t?`'${t.id}'`:'null'})">发送邀请</button></div></div>`,true);
  if(p){ document.querySelector(`input[name=iv_type][value=${p.type}]`).checked=true; } invOrgChanged(); if(o&&document.getElementById('iv_orders')) ivDefaultPick(o.id); ivScopeChanged(); }
function invOrgChanged(){ const v=$('#iv_org').value; $('#iv_org_new').style.display=v==='__new'?'block':'none'; const p=v!=='__new'?partnerOf(v):null; if(p) document.querySelector(`input[name=iv_type][value=${p.type}]`).checked=true; const sel=$('#iv_contact'); const hist=p?p.contacts:[]; sel.innerHTML=hist.map(c=>`<option value="${esc(c.email)}">${esc(c.name)} · ${esc(c.email)}${c.status==='pending'?'（待接受）':''}</option>`).join('')+`<option value="__new" ${hist.length?'':'selected'}>新联系人…</option>`; const box=$('#iv_orders'); if(box){ const checked=[...box.querySelectorAll('input[name=iv_order_sel]:checked')].map(x=>x.value); box.innerHTML=invOrdersHtml(v==='__new'?'':v,checked); } ivScopeChanged(); invContactChanged(); }
function invOrgOf(o){ const v=$('#iv_org')?$('#iv_org').value:''; return v&&(o.factory===v||o.dealer===v)?v:null; }

function sendInvite(ticketId){ let org=$('#iv_org').value; if(org==='__new'){ org=$('#iv_org_new').value.trim(); if(!org){ toast('请输入组织名称'); return; } } const type=document.querySelector('input[name=iv_type]:checked').value; let p=partnerOf(org); if(!p){ p={name:org,type,contacts:[]}; state.partners.push(p); }
  let name,mail,title; if($('#iv_contact').value==='__new'){ name=$('#iv_name').value.trim(); mail=$('#iv_mail').value.trim(); title=$('#iv_title').value.trim(); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){ toast('请输入有效邮箱'); return; } if(!name){ toast('请输入姓名'); return; } } else { const c=p.contacts.find(x=>x.email===$('#iv_contact').value); name=c.name; mail=c.email; title=c.title; }
  let scope=document.querySelector('input[name=iv_scope]:checked').value; if(scope==='order') scope='orders'; const perm={reply:$('#iv_reply').classList.contains('on'),invite:$('#iv_invite').classList.contains('on')}; const role_=p.type==='factory'?'f':'d';
  let existing=p.contacts.find(x=>x.email===mail); let picked=[];

  else { const ids=picked=[...document.querySelectorAll('input[name=iv_order_sel]:checked')].map(x=>x.value); if(!ids.length){ toast('请至少勾选一张订单'); return; }
    if(!existing){ existing={name,email:mail,title,status:'pending',defaultAll:false,since:Date.now(),perm}; p.contacts.push(existing); }
    for(const id of ids){ const o=state.orders.find(x=>x.id===id); if(!o) continue; if(!(o.overrides||[]).some(m=>m.email===mail)) o.overrides=(o.overrides||[]).concat({role:role_,name,email:mail,org:p.name,title,status:existing.status,perm,at:Date.now()}); else o.overrides=o.overrides.map(m=>m.email===mail?{...m,perm,status:existing.status}:m); o.excluded=(o.excluded||[]).filter(e=>e!==mail); }
    orderSel=ids[0]; }
  save(); closeAll();
  if(ticketId){ const t=tById(ticketId); setStatus(t,'factory'); t.assignee={name,email:mail,org:p.name,status:existing.status}; t.suggest=null; addEntry(t,'sys',`已邀请 ${name}（${p.name}）接手此工单，邀请邮件附带工单链接；对方接受前工单处于"已升级工厂 · 等待接受"状态（二级，${Policy.slaHours('l2')} 小时从接受起算）。`); openTicket(ticketId); }
  render(); toast(existing.status==='active'?`${name} 已是激活联系人，范围已更新`:`邀请已通过邮件发给 ${mail}（${scope==='org'?p.name+' 全部订单':'指定 '+picked.length+' 张订单：'+picked.join('、')}）`); }

function importOrders(files){ const f=files&&files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ const lines=String(r.result).split(/\r?\n/).map(l=>l.trim()).filter(Boolean); let n=0; const bad=[]; for(const line of lines){ const c=line.split(/[,\t]/).map(x=>x.trim().replace(/^"|"$/g,'')); if(!/^PO-/i.test(c[0])) continue; const [id,prod,qty,batch,fac,dealer,ship,city]=c; const b=buildOrder({id,product:prod,qty,batch,factory:fac,dealer,ship,city,source:'CSV 导入'}); if(!b.ok){ bad.push(`${id}：${b.error}`); continue; } addOrder(b.order); n++; } save(); render(); const miss=ordersWithoutFactory().length; toast(`导入 ${n} 张订单${bad.length?`，跳过 ${bad.length} 条`:''}${miss?`；${miss} 张缺少工厂接口人`:''}`); if(bad.length) openModal(`<div class="drawer-h"><h3>CSV 导入结果</h3><div class="sp" style="flex:1"></div><button class="x" onclick="closeAll()">×</button></div><div class="drawer-b"><p class="small">导入 ${n} 张；以下 ${bad.length} 条未导入：</p><ul class="small" style="padding-left:18px">${bad.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="muted small">列顺序：订单号, 型号, 数量, 批次, 工厂, 分销商, 发货日期(YYYY-MM-DD), 城市。保修期按发货日 + 2 年计算。</p></div>`); }; r.readAsText(f); }
function openNewPartner(){ openModal(`<div class="drawer-h"><h3>新增合作方</h3><div class="sp" style="flex:1"></div><button class="x" onclick="closeAll()">×</button></div><div class="drawer-b"><div class="grid g2"><div class="field"><label>名称</label><input class="input" id="np_name" placeholder="青岛迈动器械"></div><div class="field"><label>类型</label><select class="select" id="np_type"><option value="factory">工厂</option><option value="dealer">分销商</option></select></div></div><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeAll()">取消</button><button class="btn primary" onclick="const n=$('#np_name').value.trim(); if(!n){toast('请输入名称');return;} if(partnerOf(n)){toast('已存在');return;} state.partners.push({name:n,type:$('#np_type').value,contacts:[]}); save(); closeAll(); render(); openInvite(null,n)">创建并邀请联系人</button></div></div>`); }

/* ================= 数据分析 ================= */
let anWin=30;
PAGES.analytics=()=>{ const since=Date.now()-anWin*DAY; const all=visibleTickets().filter(t=>t.createdAt>since); const done=all.filter(t=>t.status==='done'); const ai=done.filter(t=>t.resolvedBy==='ai').length; const avg=done.length?done.reduce((a,t)=>a+(t.resolvedAt-t.createdAt),0)/done.length:0; const fac=all.filter(t=>t.status==='factory'||t.resolvedBy==='factory').length; const prev=visibleTickets().filter(t=>t.createdAt<=since&&t.createdAt>since-anWin*DAY).length;
  const faults={}; for(const t of all) if(t.kbId){ faults[t.kbId]=(faults[t.kbId]||0)+1; } const fl=Object.entries(faults).sort((a,b)=>b[1]-a[1]); const fmax=fl[0]?fl[0][1]:1;
  const ch={}; for(const t of all) ch[t.channel]=(ch[t.channel]||0)+1; const lg={}; for(const t of all) lg[t.cust.lang]=(lg[t.cust.lang]||0)+1; const rated=all.filter(t=>t.rating); const ravg=rated.length?(rated.reduce((a,t)=>a+t.rating,0)/rated.length).toFixed(1):'—';
  const bar=(label,v,max,color)=>`<div class="hbar"><span>${label}</span><div class="bar"><i style="width:${max?v/max*100:0}%;${color?'background:'+color:''}"></i></div><span class="num muted">${v}</span></div>`;
  return `
<div class="page-h"><div><h2>数据分析</h2><p>近 ${anWin} 天 · ${ROLE[role].org}${role==='brand'?' 全部产品':' 相关订单'}</p></div><div class="sp"></div><select class="select" onchange="anWin=+this.value;render()">${[7,30,90].map(d=>`<option value="${d}" ${anWin===d?'selected':''}>近 ${d} 天</option>`).join('')}</select><button class="btn" onclick="weeklyReport()">生成周报</button></div>
<div class="grid g4" style="margin-bottom:16px">
  <div class="card kpi"><div class="l">客诉总数</div><div class="v num">${all.length}</div><div class="d">上一周期 ${prev}</div></div>
  <div class="card kpi"><div class="l">AI 自行解决</div><div class="v num">${done.length?Math.round(ai/done.length*100):0}%</div><div class="d">${ai} / ${done.length} 已结案</div></div>
  <div class="card kpi"><div class="l">平均解决时长</div><div class="v num">${avg?dur(avg):'—'}</div><div class="d up">接管前 6.5 天</div></div>
  <div class="card kpi"><div class="l">升级到工厂</div><div class="v num">${fac}</div><div class="d">${all.length?(fac/all.length*100).toFixed(1):0}%${fl[0]?' · 主要是 '+Engine.KB.find(k=>k.id===fl[0][0]).cat.zh:''}</div></div>
</div>
<div class="grid g2" style="margin-bottom:16px">

  <div class="card"><div class="card-h"><h3>客户评价</h3></div><div class="card-b"><div class="num" style="font-size:28px;font-weight:600">${ravg} <span class="muted" style="font-size:14px;font-weight:400">/ 5 · ${rated.length} 条</span></div><p class="small muted" style="margin:8px 0 0">"Replied in 5 minutes in German, with a video. Didn't expect that from a Chinese brand." — Lena H.</p><a class="small" onclick="exportReviews()">导出口碑数据给渠道（CSV）</a></div></div>
</div>`; };
function dailyChart(all){ const days=Math.min(anWin,60); const now=new Date(); now.setHours(0,0,0,0); const buckets=Array.from({length:days},()=>({ai:0,brand:0,factory:0,other:0})); for(const t of all){ const i=days-1-Math.floor((now.getTime()+DAY-t.createdAt)/DAY); if(i<0||i>=days) continue; const k=t.status!=='done'?'other':t.resolvedBy==='ai'?'ai':t.resolvedBy==='brand'?'brand':t.resolvedBy==='factory'?'factory':'other'; buckets[i][k]++; } const W=520,H=180,bw=Math.max(2,W/days-3); const maxv=Math.max(3,...buckets.map(b=>b.ai+b.brand+b.factory+b.other)); const unit=(H-20)/maxv; let s=''; buckets.forEach((b,i)=>{ const x=i*(W/days)+1; let y=H-16; for(const [k,c] of [['ai','#0E7A6C'],['brand','#B7600A'],['factory','#5A4FCF'],['other','#CBD2DA']]){ const h=b[k]*unit; if(!h) continue; y-=h; s+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${c}"><title>${b[k]}</title></rect>`; } }); const d0=new Date(now.getTime()-(days-1)*DAY); return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${s}<text x="0" y="${H-2}" font-size="10" fill="#9AA3AE">${pad(d0.getMonth()+1)}-${pad(d0.getDate())}</text><text x="${W-30}" y="${H-2}" font-size="10" fill="#9AA3AE">${pad(now.getMonth()+1)}-${pad(now.getDate())}</text></svg>`; }
function exportReviews(){ const rows=[['工单','日期','产品','语言','渠道','评分','解决方','用时(小时)']]; for(const t of visibleTickets().filter(t=>t.rating)) rows.push([t.id,new Date(t.createdAt).toISOString().slice(0,10),t.product,t.cust.lang,CH[t.channel],t.rating,t.resolvedBy,((t.resolvedAt-t.createdAt)/HR).toFixed(1)]); download('售后口碑数据.csv','﻿'+rows.map(r=>r.join(',')).join('\n'),'text/csv'); toast(`已导出 ${rows.length-1} 条评价`); }
function weeklyReport(){ const since=Date.now()-7*DAY; const all=visibleTickets().filter(t=>t.createdAt>since); const done=all.filter(t=>t.status==='done'); const ai=done.filter(t=>t.resolvedBy==='ai').length; const faults={}; for(const t of all) if(t.kbId) faults[t.kbId]=(faults[t.kbId]||0)+1; const fl=Object.entries(faults).sort((a,b)=>b[1]-a[1]).slice(0,3); const open=all.filter(t=>t.status!=='done'); const txt=`IronPeak 售后周报（${new Date(since).toLocaleDateString()} – ${new Date().toLocaleDateString()}）\n\n本周新客诉 ${all.length} 条，已结案 ${done.length} 条，其中 AI 自行解决 ${ai} 条（${done.length?Math.round(ai/done.length*100):0}%）。进行中 ${open.length} 条，超时 ${open.filter(isLate).length} 条。\n\n高频故障：\n${fl.map(([k,v],i)=>`${i+1}. ${Engine.KB.find(x=>x.id===k).cat.zh} — ${v} 起`).join('\n')||'无'}\n\n待决定：\n${decisions().map(d=>`- ${d.title}：${d.sub}`).join('\n')||'无'}\n\n（由售后智能体生成）`; download(`售后周报_${new Date().toISOString().slice(0,10)}.txt`,txt); state.notes.push({t:Date.now(),text:'周报已生成并发送到 '+(state.settings.mailboxes[0]?.addr||'售后邮箱')}); save(); toast('周报已生成并下载，同时发送到售后邮箱'); }

function policyReplay(path){
  const v=Policy.get(path); const all=state.tickets.filter(t=>t.createdAt>Date.now()-30*DAY&&t.confidence!=null);
  const hit=n=>all.filter(t=>t.confidence>=n&&!t.reasons.length).length;
  const thr=Policy.get('autoReply.threshold'), band=Policy.get('autoReply.askBand');
  const reply=all.length?Math.round(hit(thr)/all.length*100):0, ask=all.length?Math.round((all.filter(t=>t.confidence>=thr-band&&t.confidence<thr&&!t.reasons.length).length)/all.length*100):0;
  return `<div class="notice" style="margin-top:10px"><span>i</span><div><b>按当前政策回放近 30 天 ${all.length} 条工单：</b>AI 直接回复 ${reply}%，先追问 ${ask}%，直接转人工 ${Math.max(0,100-reply-ask)}%（含 ${all.filter(t=>t.reasons.length).length} 条触发硬规则）。10 天内承诺寄件在 ${
    state.tickets.filter(t=>t.createdAt>Date.now()-30*DAY&&t.kbId&&!t.reasons.length).reduce((n,t)=>{ const kb=Engine.KB.find(k=>k.id===t.kbId); return n+(kb&&kb.part&&kb.partValue<=Policy.get('shipping.autoCommitLimitUsd')?1:0); },0)} 条上会被 AI 自动承诺。</div></div>`;
}

// 触发词表面板：每条规则显示 近 30 天命中数 / 命中过的词 / 样例句 / 可增删的词
function hardRuleWordsPanel(){
  const since=Date.now()-30*DAY; const all=state.tickets.filter(t=>t.createdAt>since);
  const ruleMeta={ safety:['安全件','safety'], refund:['退换货 / 赔偿','refund'], negative:['负面情绪 / 公开渠道','negative'], b2b:['企业邮箱判定（免费邮箱白名单）','b2b'] };
  const samples=(key)=>all.filter(t=>t.reasons.includes(key)).slice(-3).map(t=>{
    const r=(t.reasons||[]); const words=[];
    const txt=(t.timeline.find(e=>e.who==='cust')||{}).text||t.issue||'';
    if(typeof Policy!=='undefined'&&Policy.hitWords) words.push(...Policy.hitWords(key==='b2b'?'b2b':key,txt));
    return {id:t.id,issue:t.issue||'',words:[...new Set(words)].slice(0,6)};
  });
  const chip=(rule,kind,w,locked)=>`<span class="wchip${locked?' locked':' editable'}" title="${locked?'锁定词：删改需双签':'点击删除'}" ${locked?'':`onclick="policyRemoveWord('${rule}','${kind}','${escAttr(w)}')"`}>${esc(w)}${locked?'<i class="wl">🔒</i>':'<i class="wx">×</i>'}</span>`;
  const escAttr=(s)=>String(s).replace(/'/g,'\\\'');
  const oneRule=(key,label)=>{
    const hits=all.filter(t=>t.reasons.includes(key)); const ss=samples(key);
    const off = Policy.get('hardRules.'+key)===false;
    const top={}; for(const t of hits){ for(const w of (Policy.hitWords?Policy.hitWords(key==='b2b'?'b2b':key,t.issue||''):[])) top[w]=(top[w]||0)+1; }
    const topWords=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([w,n])=>`<span class="tag grey">${esc(w)} ${n}</span>`).join(' ');
    return `<div class="card" style="border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px">
      <div class="wrow"><b>${label}</b>${off?'<span class="tag grey">规则当前关闭</span>':''}<span class="tag ${hits.length&&!off?'amber':'grey'}">近 30 天触发 ${hits.length} 次</span></div>
      ${topWords?`<div class="wline"><span class="muted small">命中最多</span><span class="wchips">${topWords}</span></div>`:''}
      ${ss.length?`<div class="wsample"><div class="muted small">样例句</div>${ss.map(x=>`<div class="wsample-i"><span class="wsample-t">「${esc((x.issue||'').slice(0,70))}」</span>${x.words.length?`<span class="tag grey">${x.words.slice(0,4).join(' · ')}</span>`:''}</div>`).join('')}</div>`:'<div class="muted small" style="margin-top:6px">近 30 天没有触发。</div>'}
      <div class="wblock">${wordChips(key)}</div>
      <div class="wadd"><input class="input" id="w_${key}" placeholder="新增一个词，回车添加" onkeydown="if(event.key==='Enter')policyAddWord('${key}')"><button class="btn sm" onclick="policyAddWord('${key}')">添加</button></div>
    </div>`;
  };
  const wordChips=(key)=>{
    if(key==='safety'){
      const w=Policy.words('safety');
      return `<div class="wgroup"><div class="wlabel">伤害描述 <span class="tag grey">锁定 · 删改需双签</span></div><div class="wchips">${w.locked.map(x=>chip('safety','injury',x,true)).join('')}</div></div>
              <div class="wgroup"><div class="wlabel">安全部件名 <span class="tag grey">随产品线增删</span></div><div class="wchips">${w.editable.map(x=>chip('safety','parts',x,false)).join('')||'<span class="muted small">（空）</span>'}</div></div>`;
    }
    const w=Policy.words(key).all;
    return `<div class="wchips">${w.map(x=>chip(key,'',x,false)).join('')||'<span class="muted small">（空）</span>'}</div>`;
  };
  return Object.entries(ruleMeta).map(([k,lab])=>oneRule(k,lab[0])).join('');
}

function policyRemoveWord(rule,kind,w){ try{ Policy.removeWord(rule,kind||'',w); save(); render(); toast(`已删除「${w}」`); }catch(e){ toast(e.message); } }
function policyRow(path,extra){
  const d=Policy.def(path)||{}; const cur=Policy.get(path); const isNum=typeof d.value==='number';
  const input=isNum
    ? `<input class="input num" type="number" value="${cur}" min="${d.min??''}" max="${d.max??''}" style="width:90px" onchange="policySet('${path}',this.value)"><span class="muted small">${d.unit||''}${d.min!=null?` · 可设 ${d.min}–${d.max}`:''}</span>`

    return `<div class="txt">${role==='factory'&&/升级给我|escalated to me|assigned to me/i.test(t)?`品牌方升级给你的工单 ${list.length} 条：`:`今天到现在共 ${today.length} 条新客诉，AI 自行解决 ${today.filter(x=>x.status==='done'&&x.resolvedBy==='ai').length} 条。进行中 ${list.length} 条，需要人工的 ${human} 条我放在最前面${late?`，${late} 条已经超时`:''}：`}</div>`+card(`进行中的工单（${list.length}）`,list.length?`<table class="tb"><tr><th>工单</th><th>客户 / 产品</th><th>问题</th><th>状态</th><th>SLA</th></tr>${list.slice(0,8).map(x=>`<tr class="trow" onclick="openTicket('${x.id}')"><td class="num">${x.id}</td><td>${custLabel(x)}<div class="sub">${x.product?Engine.productName(x.product):'未识别'}</div></td><td style="max-width:240px">${issueLabel(x)}</td><td>${tagOf(x)}</td><td class="sla ${isLate(x)?'late':''}">${slaText(x)}</td></tr>`).join('')}</table>${list.length>8?`<div class="muted small" style="padding:8px 10px">还有 ${list.length-8} 条，在工单处理里查看</div>`:''}`:'<div class="muted">没有进行中的工单</div>',`<button class="btn sm" onclick="go('tickets')">在工单处理中打开</button><button class="btn sm" onclick="weeklyReport()">生成周报并发到邮箱</button>`,'<span class="muted small">按紧急程度排序</span>'); }
  // 说明书生成
  if(/说明书|手册|manual/i.test(t)&&/生成|做|翻译|出一?份|generate|create/i.test(t)){ const p=prod||'SM-900'; const langs=[]; for(const [k,v] of Object.entries(LANG_ZH)) if(tl.includes(k)&&!langs.includes(v)) langs.push(v); if(!langs.length) langs.push('EN'); const market=/北美|美国|us\b/i.test(t)?'北美':/英国|uk\b/i.test(t)?'英国':/拉美|南美|墨西哥|巴西/.test(t)?'拉美':/中东|阿拉伯/.test(t)?'中东':langs.some(l=>['DE','FR','IT','NL','PL','SV'].includes(l))?'欧盟':langs.includes('ES')||langs.includes('PT')?'拉美':'北美'; const pr=state.products.find(x=>x.id===p); const files=state.kbFiles.filter(k=>k.p===p&&k.st==='已入库'); const missing=langs.filter(l=>TERM_LANGS.includes(l.toLowerCase())&&state.terms.some(x=>!x[l.toLowerCase()])); const outs=['pdf','docx'].concat(pr&&pr.has3d?['3d']:[]);
    if(!files.length) return `<div class="txt">${Engine.productName(p)} 的知识库里还没有入库资料（中文草版、图纸或模型），没法开始生成。把文件拖到对话框里，或者去产品管理 → 知识库上传。</div>`+card('缺少来源资料','',`<button class="btn sm" onclick="kbTab='files';go('kb')">去上传</button>`);
    Object.assign(wiz,{step:3,product:p,market,langs:[...langs],outputs:outs,template:'IronPeak 2025 A4 模板（欧盟）'});
    return `<div class="txt">我会用 IronPeak 2025 A4 模板，基于知识库里 ${files.length} 份 ${p} 资料生成${langs.map(l=>LANGS_ALL.find(x=>x[0]===l)?.[1]||l).join('、')}版本，并按${market}要求检查警示语和必备章节。${missing.length?`术语表缺 ${missing.join('、')} 列，AI 推断的术语会在审核时高亮。`:''}确认后开始：</div>`+card('生成说明书 · 预览',`<table class="tb"><tr><td class="muted" style="width:110px">产品</td><td>${Engine.productName(p)}（${pr?pr.sku:''}）</td></tr><tr><td class="muted">来源资料</td><td>${files.map(f=>esc(f.n)).join(' · ')}</td></tr><tr><td class="muted">目标语种</td><td>${langs.join('、')}</td></tr><tr><td class="muted">目标市场</td><td>${market}</td></tr><tr><td class="muted">输出</td><td>PDF、DOCX${pr&&pr.has3d?'、3D 安装动画（有 STEP 模型）':'（无 3D 模型，不生成动画）'}</td></tr><tr><td class="muted">预计</td><td>演示约 40 秒，完成后进入审核</td></tr></table>`,`<button class="btn sm primary" onclick="startManual();this.closest('.act').innerHTML='<span class=\\'tag green\\'>已开始生成</span>'">开始生成</button><button class="btn sm" onclick="manualView='new';wiz.step=2;go('manuals')">修改参数</button>`,'<span class="tag grey">待确认</span>'); }
  // 邀请
  if(isInvite){ const oid=(t.match(/PO-\d+/i)||[])[0]; const o=oid?state.orders.find(x=>x.id===oid.toUpperCase()):null; const mail=mailIn; const name=(t.match(/的\s*([一-龥]{1,3}工?)(?=[\s,，]|$)/)||[])[1]||(t.match(/(?:^|\s)([一-龥]{1,2}工)(?!厂|程)/)||[])[1]||(t.match(/\b([A-Z][a-z]+(?:\s[A-Z][a-z]+)?)\b/)||[])[1]||'受邀人'; let org=(t.match(/(宁波力健|东莞健步|青岛迈动|NordicGym|FitHaus|GymPro)[^\s的做,，]*/i)||[])[0]||(o?o.factory:''); const p=org?state.partners.find(x=>x.name.startsWith(org.replace(/机械|工业|器械|AB|GmbH|Ltd/gi,'').trim())||x.name===org):null; if(p) org=p.name; const isEng=/工程师|研发|engineer/i.test(t); const type=p?p.type:(/分销|经销|dealer|门店/i.test(t)?'dealer':'factory'); const scope=o?'order':'org';
    if(isEng&&tid){ const x=tById(tid); if(!x) return `<div class="txt">没有找到工单 ${tid}。</div>`; if(!mail) return `<div class="txt">要把${name}拉进 ${tid}，还需要对方的邮箱。</div>`; const key=uid(); window['_inv'+key]={kind:'eng',tid,name,mail}; return `<div class="txt">工程师只会看到这一张工单（序列号、照片、AI 摘要，不含客户身份），可以回复，回复经品牌方放行后发给客户。</div>`+card('工单级邀请 · 预览',`<table class="tb"><tr><td class="muted" style="width:110px">受邀人</td><td>${esc(name)} · ${esc(mail)}</td></tr><tr><td class="muted">范围</td><td>仅工单 ${tid}</td></tr></table>`,`<button class="btn sm primary" onclick="doInvite('${key}',this)">发送邀请</button>`); }
    if(role!=='brand') return `<div class="txt">邀请合作方联系人是品牌方的权限。${role==='factory'?'你可以在具体工单里邀请自己的内部工程师（“邀请工程师 xx@yy.cn 加入 T-xxxx-xxxx”）。':''}</div>`;
    if(!org) return `<div class="txt">请告诉我对方属于哪家工厂或分销商，例如："邀请青岛迈动的陈工 chen@maidong.cn 做工厂接口人"。</div>`;
    if(!mail){ const hist=p?p.contacts:[]; return `<div class="txt">要邀请 ${esc(org)} 的${esc(name)}，还需要对方的邮箱。${hist.length?`${esc(org)} 已有联系人：${hist.map(c=>esc(c.name)+'（'+esc(c.email)+'，'+(c.status==='active'?'已激活':'待接受')+'）').join('、')}。`:''}</div>`; }
    if(p&&p.contacts.some(c=>c.email===mail)){ const c=p.contacts.find(c=>c.email===mail); return `<div class="txt">${esc(mail)} 已经是 ${esc(org)} 的联系人（${c.status==='active'?'已激活':'待接受'}，${c.defaultAll?'默认覆盖全部订单':'仅被单独邀请的订单'}）。${o&&!orderMembers(o).some(m=>m.email===mail)?`要把他加到订单 ${o.id} 吗？`:''}</div>`+(o&&!orderMembers(o).some(m=>m.email===mail)?card('订单级覆盖','',`<button class="btn sm primary" onclick="openInvite('${o.id}','${esc(org)}')">加到 ${o.id}</button>`):''); }
    const key=uid(); window['_inv'+key]={kind:'contact',org,type,name,mail,scope,oid:o?o.id:null}; const covered=state.orders.filter(x=>x.factory===org||x.dealer===org);
    return `<div class="txt">好的。${scope==='org'?`${esc(name)} 会成为 ${esc(org)} 的默认${type==='factory'?'接口人':'联系人'}，覆盖这家${type==='factory'?'工厂':'分销商'}现在和以后的全部订单（${covered.length?covered.map(x=>x.id).join('、'):'目前还没有订单'}）；单张订单以后可以换人。`:`${esc(name)} 只会加入订单 ${o.id}。`}${type==='factory'?'工厂看到的工单会隐藏客户身份，回复经你放行后发给客户。':''}</div>`+card('协作邀请 · 预览',`<table class="tb"><tr><td class="muted" style="width:110px">受邀人</td><td>${esc(name)} · ${esc(org)} · ${esc(mail)}</td></tr><tr><td class="muted">角色</td><td><span class="tag ${type==='factory'?'violet':'amber'}">${type==='factory'?'工厂接口人（二级升级接收人）':'分销商联系人'}</span></td></tr><tr><td class="muted">范围</td><td>${scope==='org'?`${esc(org)} 全部订单（组织级默认）`:`仅订单 ${o.id}`}</td></tr><tr><td class="muted">权限</td><td>查看范围内工单（脱敏）、回复（经放行）、按工单邀请内部工程师</td></tr></table>`,`<button class="btn sm primary" onclick="doInvite('${key}',this)">发送邀请</button><button class="btn sm" onclick="openInvite(${o?`'${o.id}'`:'null'},'${esc(org)}')">改一下</button>`); }
  // 故障统计
  if(/故障|最多|统计|趋势|分析|多少条|排名|top|stat/i.test(t)){ const since=Date.now()-30*DAY; const all=visibleTickets().filter(x=>x.createdAt>since&&(!prod||x.product===prod)); const f={}; for(const x of all) if(x.kbId) f[x.kbId]=(f[x.kbId]||0)+1; const fl=Object.entries(f).sort((a,b)=>b[1]-a[1]); const max=fl[0]?fl[0][1]:1; const batch={}; for(const x of all) if(x.batch&&x.kbId) batch[x.product+' '+x.batch+' / '+x.kbId]=(batch[x.product+' '+x.batch+' / '+x.kbId]||0)+1; const hot=Object.entries(batch).sort((a,b)=>b[1]-a[1])[0];
    return `<div class="txt">最近 30 天${prod?Engine.productName(prod):''}共 ${all.length} 条客诉，故障集中在前三项。${hot?`批次聚集最明显的是 ${hot[0].split(' / ')[0]} 的「${Engine.KB.find(k=>k.id===hot[0].split(' / ')[1]).cat.zh}」，${hot[1]} 起，建议让工厂排查该批次。`:''}</div>`+card('近 30 天高频故障',fl.slice(0,6).map(([k,v])=>{ const kb=Engine.KB.find(x=>x.id===k); return `<div class="hbar"><span>${kb.product!=='*'?kb.product+' ':''}${kb.cat.zh}${kb.part?` <span class="muted small num">${kb.part}</span>`:''}</span><div class="bar"><i style="width:${v/max*100}%"></i></div><span class="num muted">${v}</span></div>`; }).join('')||'<div class="muted">暂无数据</div>',`<button class="btn sm" onclick="go('analytics')">查看完整分析</button><button class="btn sm" onclick="go('parts')">生成备件建议</button>`); }
  // 库存
  if(/库存|备件|备货|inventory|stock/i.test(t)){ const low=state.inventory.filter(i=>i.qty<=i.safe); return `<div class="txt">${low.length?`有 ${low.length} 项低于安全库存：${low.map(i=>`${i.name} 余量 ${i.qty}`).join('、')}。`:'所有免费配件都在安全库存以上。'}AI 在工单里承诺寄件时会自动扣减。</div>`+card('免费配件库存',`<table class="tb"><tr><th>零件</th><th>仓库</th><th>余量</th><th>安全库存</th></tr>${state.inventory.map(i=>`<tr><td>${i.name}</td><td class="muted small">${i.loc}</td><td class="num" style="${i.qty<=i.safe?'color:var(--red);font-weight:600':''}">${i.qty}</td><td class="num muted">${i.safe}</td></tr>`).join('')}</table>`,`<button class="btn sm" onclick="go('parts')">打开备件与库存</button>${low.length?`<button class="btn sm primary" onclick="${low.map(i=>`restock('${i.part}')`).join(';')};this.disabled=true">一键向工厂补货</button>`:''}`); }
  // 上传
  if(/上传|upload|传一?份|资料|草稿/i.test(t)&&!/常见/.test(t)) return `<div class="txt">把文件拖到下面的对话框，或点"＋ 附件"选择。我会按文件名和内容识别类型（说明书 / 爆炸图 / 3D 模型 / 故障代码 / 历史客诉）并关联产品，解析完成后入库，之后客诉回答和说明书生成都会用到。</div>`+card('支持的资料',`<div class="small">PDF、DOCX、XLSX、STEP/STP、MBOX/EML、CSV、MP4。${prod?`文件名里带 ${prod} 会自动关联到该产品。`:'文件名里带型号（如 TR-650）会自动关联。'}</div>`,`<label class="btn sm primary" style="cursor:pointer"><input type="file" multiple style="display:none" onchange="attachFiles(this.files)">选择文件</label>`);
  // 常见问题 / 知识库问答
  if(/常见问题|faq|有哪些问题/i.test(t)&&prod){ const since=Date.now()-90*DAY; const list=Engine.KB.filter(k=>k.product===prod||k.product==='*').map(k=>({k,n:state.tickets.filter(x=>x.kbId===k.id&&x.product===prod&&x.createdAt>since).length})).sort((a,b)=>b.n-a.n); return `<div class="txt">${Engine.productName(prod)} 近 90 天的常见问题，按出现次数排序。点开能看处理步骤，门店可以先按这个处理：</div>`+card(`${prod} 常见问题`,list.map(({k,n})=>`<details class="faq"><summary>${k.cat.zh} <span class="muted num small">${n} 起</span>${k.safety?' <span class="tag amber">安全件</span>':''}</summary><ol>${k.steps.zh.map(s=>`<li>${s}</li>`).join('')}</ol>${k.part?`<div class="small muted">涉及零件：${k.partName.zh} ${k.part}${k.partValue<=50?'（≤ 50 美元，AI 可直接承诺补发）':''}</div>`:''}</details>`).join('')); }
  const m=Engine.matchKB(t,prod||null); if(m&&m.hits>=1){ const kb=m.entry; const cases=state.tickets.filter(x=>x.kbId===kb.id); const done=cases.filter(x=>x.status==='done'); return `<div class="txt">这个问题对应知识库「${kb.cat.zh}」${kb.product!=='*'?`（${Engine.productName(kb.product)}）`:''}。历史上有 ${cases.length} 起，${done.length} 起已解决，其中 ${done.filter(x=>x.resolvedBy==='ai').length} 起由 AI 直接解决${kb.safety?'。这是安全件，按规则 AI 不会自动承诺，需要人工确认':''}。处理步骤：</div>`+card(kb.stepTitle.zh,`<ol style="margin:0;padding-left:18px">${kb.steps.zh.map(s=>`<li>${s}</li>`).join('')}</ol>${kb.part?`<div class="small muted" style="margin-top:8px">零件：${kb.partName.zh} ${kb.part} · 库存 ${state.inventory.find(i=>i.part===kb.part)?.qty??'无记录'}</div>`:''}${kb.video?`<div class="small muted">配套视频 ${kb.video}</div>`:''}`,`<button class="btn sm" onclick="tf.q='';tf.prod='${kb.product!=='*'?kb.product:''}';tf.batch='';go('tickets')">查看相关工单</button>`); }
  return `<div class="txt">我可以帮你做这些事：汇总和处理工单（说"把今天的工单汇总给我"或直接给我工单号）、查询产品知识和历史案例（比如"SM-900 常见问题"）、生成多语言说明书（"给 TR-650 生成西班牙语说明书"）、邀请上下游协作（"邀请 xx@yy.com 加入订单 PO-24118"）、统计故障和备件（"哪些故障最多"、"库存怎么样"），还能直接改设置（"把阈值调到 80"）。</div>`;
}
function doInvite(key,btn){ const d=window['_inv'+key]; if(!d) return;
  if(d.kind==='eng'){ const t=tById(d.tid); t.collab=(t.collab||[]).concat({name:d.name,email:d.mail,org:ROLE[role].org,role:'eng',status:'pending',by:ROLE[role].person,at:Date.now()}); addEntry(t,'sys',`${ROLE[role].person} 邀请内部工程师 ${d.name} 加入此工单（仅限本工单，待接受）。`); }
  else { let p=partnerOf(d.org); if(!p){ p={name:d.org,type:d.type,contacts:[]}; state.partners.push(p); } const c={name:d.name,email:d.mail,status:'pending',defaultAll:d.scope==='org',since:Date.now()}; p.contacts.push(c); if(d.scope==='order'){ const o=state.orders.find(x=>x.id===d.oid); o.overrides=(o.overrides||[]).concat({role:p.type==='factory'?'f':'d',name:d.name,email:d.mail,org:p.name,status:'pending',at:Date.now()}); } }
  save(); btn.closest('.act').innerHTML='<span class="tag green">邀请已通过邮件发出</span>'; renderNav(); $('#aside').innerHTML=asideHtml(); toast(`邀请已发给 ${d.mail}`); }
function attachFiles(files){ if(!files||!files.length) return; if(!chatStarted){ const h=$('#hello'); if(h) h.remove(); chatStarted=true; } const names=[...files].map(f=>f.name); uploadKB(files); const col=$('#chatCol'); const id='att'+Date.now(); const html=`<div class="m user"><div class="av">${ROLE[role].av}</div><div class="body"><div class="who">${ROLE[role].name}</div><div class="txt">上传了 ${files.length} 个文件：${names.map(esc).join('、')}</div></div></div><div class="m ai" id="${id}"><div class="av">AI</div><div class="body"><div class="who">售后智能体</div><div class="txt">收到，正在解析并关联产品：</div>${card('入库进度',names.map(n=>`<div class="check"><span class="tag ai">解析中</span><div>${esc(n)} <span class="muted small">${guessType(n)} · ${guessProduct(n)}</span></div></div>`).join(''))}</div></div>`; col.insertAdjacentHTML('beforeend',html); scrollChat(); setTimeout(()=>{ const el=$('#'+id); if(!el) return; el.querySelector('.body').innerHTML=`<div class="who">售后智能体</div><div class="txt">${names.length} 个文件已解析入库${names.some(n=>guessType(n)==='其他资料')?'，有的类型没认出来，放在"待确认"里等你归类':''}。之后客诉回答和说明书生成都会用到它们。</div>${card('已入库',names.map(n=>`<div class="check"><span class="tag ${guessType(n)==='其他资料'?'amber':'green'}">${guessType(n)==='其他资料'?'待确认':'已入库'}</span><div>${esc(n)} <span class="muted small">${guessType(n)} · ${guessProduct(n)}</span></div></div>`).join(''),`<button class="btn sm" onclick="kbTab='files';go('kb')">打开知识库</button>`)}`; logChat(html.replace(/<div class="m ai" id="[^"]+">[\s\S]*$/,'')+el.outerHTML); scrollChat(); },3000); }

/* ================= 启动 ================= */
function boot(){ state=load()||seed(); syncEngineOrders(); syncBatchLayer(); if(!state.chatLog) state.chatLog=[]; for(const k of state.kbFiles) if(k.st==='解析中') k.st='已入库'; ensureAllManualWorkspaces(); ensureDemoMailboxes(); save(); $('#avatar').textContent=ROLE[role].av; $('#whoName').textContent=ROLE[role].person; $('#whoOrg').textContent=ROLE[role].name+' · '+ROLE[role].org; restoreChrome(); I18N.boot(); const [h,hArg,hArg2]=decodeURIComponent(location.hash.replace('#','')).split(':'); if(h&&MENU.find(m=>m.id===h)) page=h; if(h==='products'&&hArg) batchOpen=hArg; /* 演示直链：#products:SM-900 打开即展开该型号批次 */
  if(h==='qr'&&hArg&&state.products.some(p=>p.id===hArg)){ qrFocus=hArg; if(QR_MODES.some(x=>x[0]===hArg2)){ state.qrMode[hArg]=hArg2; save(); } } /* #qr:SM-900:batch 打开即把该型号切到批次档并聚焦 */ const n=importInbox(); render(); if(n) toast(`从 H5 收到 ${n} 条新客诉`);
  setInterval(tickManuals,1000);
  setInterval(()=>{ const n=importInbox(); if(n){ toast(`从 H5 收到 ${n} 条新客诉`); render(); } },4000);
  window.addEventListener('storage',e=>{ if(e.key===INBOX_KEY){ const n=importInbox(); if(n){ toast(`从 H5 收到 ${n} 条新客诉`); render(); } } });
  setInterval(()=>{ if(page==='tickets') refreshTable(); if(page==='agent'){ const a=$('#aside'); if(a) a.innerHTML=asideHtml(); } renderNav(); },30000);
}
boot();
