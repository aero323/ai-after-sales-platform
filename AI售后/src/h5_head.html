  <div class="phone"><div class="notch"></div><div class="screen" id="screen" data-view="0">
    <div class="statusbar"></div>
    <div class="topbar">
      <button class="back" id="back" onclick="goBack()" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="logo">IP</div><b data-i="brand"></b><div class="sp"></div><button class="lang" id="langBadge" onclick="setLang(ui==='zh'?'en':'zh')" title="切换语言 / Switch language">ZH</button><button class="reset" id="resetDemo" onclick="resetDemo()" aria-label="重置演示" title="重置演示"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
    </div>
    <div class="prog"><i id="prog"></i></div>
    <div class="stepnote" id="stepnote"></div>

    <!-- 0 language -->
    <section class="view show" data-v="0">
      <h1 data-i="h1"></h1>
      <p class="lead" data-i="l1"></p>
      <div class="entries" id="langs"></div>
    </section>

    <!-- 1 landing -->
    <section class="view landing" data-v="1">
      <div class="landing-hero">
        <img data-img="hero" alt="">
        <div class="hero-model" role="group">
          <span class="model-scan" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/><path d="M8 8h3v3H8zM14 8h2M14 11h2M8 14h2M8 17h3M14 14h2v3h-2z"/></svg></span>
          <span class="model-copy"><small data-i="model_label"></small><b id="heroModel"></b></span>
        </div>
        <div class="shade"></div>
        <div class="in">
          <p class="kicker" data-i="hero_k"></p>
          <h1 data-i="h0"></h1>
          <p data-i="l0"></p>
        </div>
      </div>
      <div class="landing-sheet">
        <button type="button" class="action-primary" data-priority="primary" onclick="startReport()">
          <span class="action-ic"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg></span>
          <span class="action-copy"><b data-i="o1"></b><span data-i="o1s"></span></span>
          <span class="action-go" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
        </button>
        <div class="repair-steps" aria-label="Repair process">
          <div class="repair-step"><span class="n">1</span><b data-i="s3a"></b><small data-i="s3a2"></small></div>
          <div class="repair-step"><span class="n">2</span><b data-i="s3b"></b><small data-i="s3b2"></small></div>
          <div class="repair-step"><span class="n">3</span><b data-i="s3c"></b><small data-i="s3c2"></small></div>
        </div>
        <div class="landing-more">
          <button type="button" onclick="go('m')">
            <span class="action-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v14"/></svg></span>
            <span><b data-i="o2"></b></span>
            <span class="action-go" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
          </button>
          <button type="button" onclick="go('t')">
            <span class="action-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/></svg></span>
            <span><b data-i="o3"></b></span>
            <span class="action-go" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
          </button>
        </div>
        <p class="sysnote" data-i="note0"></p>
      </div>
    </section>

    <!-- 2 label -->
    <section class="view" data-v="2">
      <h1 id="t2"></h1>
      <p class="lead" id="l2"></p>
      <div class="finder" id="finder">
        <img data-img="label" alt="">
        <div class="frame"></div><div class="scanning"></div>
        <div class="hint" id="hint"></div>
      </div>
      <div id="labelResult" style="display:none;margin-top:14px" class="card"></div>
      <div class="snentry" id="snEntry"><input class="inp" id="snInput" autocapitalize="characters" onkeydown="if(event.key==='Enter')checkSn()"><div class="err" id="snErr"></div><button class="btn" onclick="checkSn()" data-i="b_check"></button></div>
      <div class="spacer"></div>
      <div id="labelActions">
        <label class="btn" style="cursor:pointer"><input type="file" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(this)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span data-i="b_snap"></span></label>
        <button class="btn sec" style="margin-top:10px" onclick="demoLabel()" data-i="b_demo_label"></button>
        <button class="btn ghost" onclick="showSnEntry()" data-i="b_type"></button>
        <button class="btn ghost" onclick="skipLabel()" data-i="b_skip_label"></button>
      </div>
      <div id="labelConfirm" style="display:none">
        <button class="btn" onclick="startReport()" data-i="b_start"></button>
        <button class="btn ghost" onclick="resetLabel()" data-i="b_retake"></button>
      </div>
    </section>

    <!-- 3 consult: aim / analyzing / confirm / verdict / guide / outcome / safety / handoff / text -->
    <section class="view consult" data-v="3">

      <div class="stg on" data-s="how">
        <div class="stg-head how-head"><button class="iconbtn" onclick="go(1)" aria-label="返回">‹</button><div class="t"><b data-i="how_t"></b></div></div>
        <div class="stg-body how-body">
          <div class="how-hero">
            <img data-img="engineer" alt="">
            <div class="shade"></div>
            <div class="how-focus" aria-hidden="true"></div>
            <div class="in"><b data-i="how_hero"></b><span data-i="how_hero2"></span></div>
          </div>
          <div class="how-sheet">
            <div class="how-list">
              <button class="how how-primary" onclick="enterCamera('video')">
                <span class="ic dark"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="2.5" y="6.5" width="13" height="11" rx="2.5"/><path d="M15.5 11l6-3.5v9l-6-3.5z"/></svg></span>
                <span class="tx"><b data-i="how_v"></b><span data-i="how_v2"></span><em data-i="how_v3"></em></span>
                <span class="ok">›</span>
              </button>
              <button class="how how-combo" onclick="startPhotoNote()">
                <span class="ic"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg><span class="addon"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span></span>
                <span class="tx"><b data-i="how_p"></b><span data-i="how_p2"></span></span>
                <span class="ok">›</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="stg dark" data-s="aim">
        <div class="cam" id="camWrap">
          <video id="camVideo" autoplay muted playsinline></video>
          <img id="camImg" alt="">
          <canvas id="camCanvas" style="display:none"></canvas>
          <div class="vig"></div>
          <div class="top">
            <button class="close" onclick="exitCamera()" aria-label="关闭相机"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            <button class="pill-b" id="camSpot" type="button" onclick="openSpotPicker()" aria-haspopup="dialog" aria-expanded="false" aria-controls="spotPicker"></button>
            <span class="sp"></span>
            <span class="pill-b demo" id="camDemo" style="display:none" data-i="cam_demo"></span>
          </div>
          <div class="rec-ring" id="recRing"><i></i><span id="recTime">00:08</span></div>
          <div class="ret"></div>
          <div class="tip" id="camTip" role="status" aria-live="polite"></div>
          <div class="cam-modes">
            <button class="mode" id="modePhoto" onclick="setCamMode('photo')" data-i="shot_photo"></button>
            <button class="mode" id="modeVideo" onclick="setCamMode('video')" data-i="shot_video"></button>
          </div>
          <div class="tools">
            <div class="shots-mini" id="shotsMini"></div>
            <button class="shutter" id="shutter" onclick="shoot()" aria-label="拍照 / 录制"><span></span></button>
            <button class="tool-btn" id="flipBtn" onclick="flipCam()" aria-label="切换前后摄像头"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.6-5.7L20 8"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 0 1-13.6 5.7L4 16"/><path d="M4 20v-4h4"/></svg></button>
          </div>
          <div class="cam-brand" id="camBrand"></div>
          <div class="cam-go"><button class="btn" id="toAnalyze" onclick="startAnalyze()" disabled data-i="b_analyze"></button></div>
        </div>
        <div class="opts-overlay" id="spotPicker"><div class="box"><h3 data-i="spot_q"></h3><div id="spotOpts"></div><button class="btn ghost" onclick="closeSpotPicker()" data-i="spot_close"></button></div></div>
      </div>

      <div class="stg" data-s="photo-review">
        <div class="stg-head"><button class="iconbtn" onclick="backToCamera()" aria-label="返回相机">‹</button><div class="t"><b data-i="review_t"></b><span data-i="review_s"></span></div></div>
        <div class="stg-body review-body">
          <div class="review-preview">
            <img id="reviewPhoto" alt="">
            <div class="review-shade"></div>
            <span class="review-count" id="reviewCount"></span>
            <button class="review-add" type="button" onclick="addReviewPhoto()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-i="review_add"></span></button>
          </div>
          <div class="review-strip" id="reviewStrip"></div>
          <div class="review-note-actions">
            <button class="review-note-action" data-mode="voice" type="button" onclick="openReviewNote('voice')"><span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg></span><span data-i="review_voice"></span></button>
            <button class="review-note-action" data-mode="text" type="button" onclick="openReviewNote('text')"><span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M6 10h1M10 10h1M14 10h1M18 10h.01M6 14h2M10 14h4M16 14h2"/></svg></span><span data-i="review_text"></span></button>
          </div>
          <div class="review-note-panel" id="reviewNotePanel" data-mode="voice">
            <div class="review-note-head"><b data-i="review_note_title"></b><div class="review-note-tools"><button type="button" onclick="clearReviewNote()" data-i="review_remove"></button><button class="done" type="button" onclick="saveReviewNote()" data-i="review_save"></button></div></div>
            <button class="review-voice" id="reviewVoiceBtn" type="button" onclick="toggleReviewVoice()" aria-pressed="false"><span class="mic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg></span><span class="copy"><b id="reviewVoiceTitle"></b><small data-i="review_voice_hint"></small></span><span class="wave" aria-hidden="true"><i></i><i></i><i></i></span></button>
            <label class="review-text"><textarea id="reviewNoteText" rows="3" oninput="reviewNoteText=this.value"></textarea></label>
          </div>
        </div>
        <div class="stg-foot"><button class="btn" onclick="analyzePhotoReview()" data-i="b_analyze"></button></div>
      </div>

      <div class="stg dark" data-s="analyzing">
        <div class="analyze">
          <div class="thumb"><img id="anImg" alt=""></div>
          <h2 data-i="an_title"></h2>
          <p class="lead" data-i="an_lead"></p>
          <div class="an-bar"><i id="anBar"></i></div>
          <ul class="an-list" id="anList"></ul>
        </div>
      </div>

      <div class="stg" data-s="confirm">
        <div class="stg-head"><button class="iconbtn" onclick="setStage('aim')" aria-label="返回">‹</button><div class="t"><b data-i="see_t"></b><span data-i="see_s"></span></div></div>
        <div class="stg-body">
          <div class="evi"><img id="seeImg" alt=""><div class="hs" id="seeHs"><b id="seeLabel"></b></div></div>
          <div class="badges" id="seeBadges"></div>
          <div class="said"><div class="who"><span class="tag ai">AI</span><span data-i="see_who"></span></div><div id="seeText"></div></div>
          <p class="small muted" style="margin:12px 0 0" data-i="see_foot"></p>
        </div>
        <div class="stg-foot">
          <button class="btn" onclick="confirmYes()" data-i="b_yes"></button>
          <button class="btn sec" id="photoNoteBtn" style="display:none" onclick="openText()" data-i="photo_note_add"></button>
          <button class="btn sec" onclick="setStage('aim')" data-i="b_no"></button>
        </div>
      </div>

      <div class="stg consult-stage" data-s="consult">
        <button class="consult-evidence" id="consultEvidence" type="button" onclick="toggleConsultEvidence()" aria-expanded="true" aria-label="收起画面">
          <img id="consultImg" alt="">
          <span class="consult-shade"></span>
          <span class="hs" id="consultHs"><b id="consultHsLabel"></b></span>
          <span class="consult-evidence-top"><span class="evidence-kicker" data-i="cf_evidence"></span><span class="consult-collapse-icon" aria-hidden="true">⌃</span></span>
          <span class="consult-evidence-bottom"><span class="risk-pill" id="consultRisk"></span><span class="confidence-pill" id="consultConf"></span></span>
        </button>
        <div class="consult-titlebar">
          <span class="consult-agent-avatar" aria-hidden="true">AI</span>
          <div class="consult-agent-copy"><b data-i="cf_title"></b><span id="consultContext"></span></div>
          <span class="consult-progress" id="consultProgress" role="status" aria-live="polite"></span>
        </div>
        <div class="consult-scrollwrap">
          <div class="consult-scroll" id="consultScroll" onscroll="onConsultScroll()">
            <div class="consult-chat" id="consultChat" role="log" aria-live="polite" aria-relevant="additions text"></div>
          </div>
          <button class="consult-new-msg" id="consultNewMsg" type="button" onclick="consultScrollBottom()" data-i="cf_new_message" aria-hidden="true" tabindex="-1"></button>
        </div>
        <div class="consult-composer" id="consultComposer">
          <textarea id="consultTa" rows="1" maxlength="500" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,96)+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendConsultMsg()}" aria-label="回复当前步骤"></textarea>
          <button class="consult-voice" id="consultVoiceBtn" type="button" onclick="toggleConsultVoice()" aria-label="点按说话" aria-pressed="false"><span class="consult-voice-orb"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg></span><span class="consult-voice-copy"><b id="consultVoiceTitle"></b><small id="consultVoiceHint"></small></span><span class="consult-wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button>
          <button class="consult-icon-btn consult-keyboard" id="consultKeyboardBtn" type="button" onclick="toggleConsultInputMode()" aria-label="切换键盘输入"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M6 10h1M10 10h1M14 10h1M18 10h.01M6 14h2M10 14h4M16 14h2"/></svg></button>
          <button class="consult-icon-btn consult-send" id="consultSendBtn" type="button" onclick="sendConsultMsg()" aria-label="发送回复"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 19V5 M5 12l7-7 7 7"/></svg></button>
        </div>
      </div>

      <div class="stg" data-s="outcome">
        <div class="stg-body outcome">
          <h1 data-i="o_t"></h1>
          <p class="lead" data-i="o_s"></p>
          <div class="out">
            <button class="good" onclick="finish('fixed')"><span class="ic">✓</span><span><b data-i="o_fixed"></b><span data-i="o_fixed2"></span></span><span class="muted">›</span></button>
            <button class="warn" onclick="finish('notfixed')"><span class="ic">↻</span><span><b data-i="o_notfixed"></b><span data-i="o_notfixed2"></span></span><span class="muted">›</span></button>
            <button class="bad" onclick="finish('danger')"><span class="ic">!</span><span><b data-i="o_danger"></b><span data-i="o_danger2"></span></span><span class="muted">›</span></button>
          </div>
          <p class="small muted" style="margin-top:14px" data-i="o_foot"></p>
        </div>
      </div>

      <div class="stg" data-s="safety">
        <div class="safety">
          <div class="stop">STOP</div>
          <h1 data-i="sf_t"></h1>
          <p data-i="sf_s"></p>
          <ol id="sfList"></ol>
          <div class="spacer"></div>
          <button class="btn" style="background:#fff;color:var(--red)" onclick="handoff('safety')" data-i="sf_b"></button>
        </div>
      </div>

      <div class="stg" data-s="handoff">
        <div class="stg-head"><button class="iconbtn" onclick="setStage('outcome')" aria-label="返回">‹</button><div class="t"><b data-i="h_t"></b><span data-i="h_s"></span></div></div>
        <div class="stg-body">
          <div class="tech"><img data-img="tech" alt=""><div><b id="techName"></b><span data-i="tech_role"></span><span class="on" id="techOn"></span></div><span class="tag done" data-i="tech_ok"></span></div>
          <div class="handoff-note">
            <label for="handoffNote"><b data-i="h_note"></b><span data-i="h_note_optional"></span></label>
            <textarea id="handoffNote" maxlength="240" oninput="saveHandoffNote(this.value)"></textarea>
            <small data-i="h_note_hint"></small>
          </div>
          <p class="small muted" style="margin:0 0 10px" data-i="h_p"></p>
          <div class="pack" id="hPack"></div>
        </div>
        <div class="stg-foot"><button class="btn" onclick="handoffGo()" data-i="h_go"></button></div>
      </div>

      <div class="stg" data-s="text">
        <div class="stg-head"><button class="iconbtn" onclick="backToShot()" aria-label="返回">‹</button><div class="t"><b id="txTitle" data-i="tx_t"></b><span id="txSub" data-i="tx_s"></span></div></div>
        <div class="scrollwrap" id="chatScroll"><div class="chat" id="chat"></div></div>
        <div class="composer" id="composer">
          <label class="ic" aria-label="添加图片或视频" style="cursor:pointer"><input type="file" accept="image/*,video/*" style="display:none" onchange="onChatMedia(this)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></label>
          <textarea id="ta" rows="1" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
          <button class="voice-main" id="voiceBtn" onclick="toggleVoice()" aria-label="点按说话" aria-pressed="false"><span class="voice-symbol"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg></span><span class="voice-text"><b id="voiceTitle">点按说话</b><small id="voiceHint">说说您遇到的问题</small></span><span class="voice-wave" aria-hidden="true"><i></i><i></i><i></i></span></button>
          <button class="ic keyboard" id="keyboardBtn" onclick="toggleInputMode()" aria-label="切换键盘输入"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M6 10h1M10 10h1M14 10h1M18 10h.01M6 14h2M10 14h4M16 14h2"/></svg></button>
          <button class="ic send" onclick="sendMsg()" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 19V5 M5 12l7-7 7 7"/></svg></button>

      </div>
    </section>

    <!-- t track -->

      <div class="field"><input class="inp" id="trackInput" autocapitalize="characters" onkeydown="if(event.key==='Enter')track()"></div>
      <button class="btn" onclick="track()" data-i="b_track"></button>
      <div id="trackResult" style="margin-top:14px"></div>
    </section>

    <div class="toast" id="toast"></div>
    <div class="home-indicator"></div>
  </div></div>
