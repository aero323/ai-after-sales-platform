<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>IronPeak Support · 扫码售后 H5 原型 v3</title>
<style>
:root{
  color-scheme: light;
  --brand:#0E7A6C; --brand-ink:#0B5F54; --brand-soft:#E3F3EF;
  --ink:#171C22; --muted:#6B7682; --faint:#9AA3AE; --line:#E4E8ED; --bg:#F6F7F9; --panel:#fff;
  --amber:#B7600A; --amber-soft:#FBEEDC; --green:#2F7D32; --red:#B42323; --red-soft:#FCEDEC;
  font-family:-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue","Segoe UI",Roboto,"Noto Sans SC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#DDE2E8;color:var(--ink);font-size:15px;line-height:1.5;min-height:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* desktop stage with phone frame */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:48px;padding:32px 16px;flex-wrap:wrap}
.phone{width:390px;height:844px;background:#000;border-radius:48px;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.35);position:relative;flex:none}
.screen{width:100%;height:100%;background:var(--bg);border-radius:38px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:32px;background:#000;border-radius:0 0 18px 18px;z-index:6}
.caption{max-width:310px;color:#3A4552;font-size:14px;line-height:1.6}
.caption h2{margin:0 0 8px;font-size:18px;font-weight:600}
.caption p{margin:0 0 10px}
.caption .flow{margin:0;padding-left:18px}
.caption .flow li{margin:3px 0}
.caption .flow li.on{font-weight:600;color:var(--brand-ink)}
.caption .note{margin-top:14px;font-size:12px;color:#6B7682;border-left:3px solid #B8C0CA;padding-left:10px}
.langtoggle{display:inline-flex;border:1px solid #B8C0CA;border-radius:8px;overflow:hidden;margin-bottom:16px}
.langtoggle button{border:0;background:#fff;padding:6px 14px;font-size:13px;color:#3A4552}
.langtoggle button.on{background:var(--brand);color:#fff}
@media (max-width:480px){.stage{padding:0}.phone{width:100%;height:100vh;border-radius:0;padding:0;box-shadow:none}.screen{border-radius:0}.notch,.caption{display:none}}

/* in-screen chrome */
.statusbar{height:44px;flex:none}
.topbar{display:flex;align-items:center;gap:10px;padding:6px 18px 10px;flex:none}
.topbar .logo{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.topbar b{font-weight:600;font-size:15px}
.topbar .sp{flex:1}
.topbar .lang{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:3px 10px;background:#fff;cursor:pointer}
.topbar .reset{width:28px;height:28px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--muted);display:grid;place-items:center;flex:none;padding:0;transition:background .15s,color .15s,transform .15s}
.topbar .reset:hover{background:var(--brand-soft);color:var(--brand-ink)}
.topbar .reset:active{transform:rotate(-24deg)}
.back{border:0;background:none;padding:4px;margin-left:-6px;color:var(--ink);display:none}
.back.show{display:block}
.prog{height:3px;background:var(--line);margin:0 18px 0;border-radius:2px;overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
.stepnote{font-size:12px;color:var(--faint);padding:6px 18px 0;flex:none;min-height:24px}
.view{flex:1;overflow:auto;padding:20px 18px 24px;display:none;flex-direction:column}
.view.show{display:flex}
h1{font-size:24px;font-weight:600;line-height:1.25;margin:10px 0 8px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 18px}
.btn{width:100%;border:0;border-radius:12px;padding:15px 16px;font-size:16px;font-weight:600;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{background:var(--brand-ink)}
.btn:disabled{background:#C3CBD3}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--red)}
.btn.ghost{background:none;color:var(--muted);font-weight:500;padding:11px;font-size:14px}
.btn + .btn{margin-top:10px}
.btn.sm{padding:11px 12px;font-size:14px;border-radius:10px}
.spacer{flex:1}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.card + .card{margin-top:10px}
.row{display:flex;align-items:center;gap:10px}
.row.sp{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:12px} .tiny{font-size:11px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500}
.tag.ai{background:var(--brand-soft);color:var(--brand-ink)} .tag.human,.tag.factory{background:var(--amber-soft);color:var(--amber)} .tag.done{background:#E6F2E6;color:#2F7D32}

/* ---- landing ---- */
#screen[data-view="1"]{background:#0B1815}
#screen[data-view="1"] .topbar{background:#0B1815;padding-bottom:12px}
#screen[data-view="1"] .topbar .logo{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
#screen[data-view="1"] .topbar b{color:#fff}
#screen[data-view="1"] .back{color:#fff}
#screen[data-view="1"] .topbar .lang,#screen[data-view="1"] .topbar .reset{background:rgba(255,255,255,.08);color:rgba(255,255,255,.9);border-color:rgba(255,255,255,.16)}
#screen[data-view="1"] .prog,#screen[data-view="1"] .stepnote{display:none}
#screen[data-view="1"] .view[data-v="1"]{padding:0;background:var(--bg)}
.landing-hero{position:relative;height:328px;flex:none;overflow:hidden;background:#13221E}
.landing-hero>img{width:100%;height:100%;object-fit:cover;object-position:50% 44%;display:block;transform:scale(1.015)}
.landing-hero>.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,14,12,.08) 0%,rgba(6,14,12,.28) 38%,rgba(6,14,12,.88) 100%);pointer-events:none}
.landing-hero .hero-model{position:absolute;top:16px;right:16px;z-index:2;display:flex;align-items:center;gap:9px;padding:7px 11px 7px 7px;border:1px solid rgba(255,255,255,.32);border-radius:13px;background:rgba(250,252,249,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#14201D;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.landing-hero .hero-model .model-scan{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;background:var(--brand);color:#fff;flex:none}
.landing-hero .hero-model .model-copy{display:flex;flex-direction:column;gap:2px;line-height:1}
.landing-hero .hero-model small{font-size:9px;line-height:1.15;letter-spacing:.04em;color:#69746F;font-weight:600}
.landing-hero .hero-model b{font-size:13px;line-height:1.15;letter-spacing:-.01em;font-weight:700;white-space:nowrap}
.landing-hero .in{position:absolute;left:20px;right:20px;bottom:44px;z-index:2;color:#fff}
.landing-hero .kicker{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.08em;font-weight:700;color:#BDE7DC;margin:0 0 9px}
.landing-hero .kicker::before{content:"";width:6px;height:6px;border-radius:50%;background:#75D6C1;box-shadow:0 0 0 3px rgba(117,214,193,.14)}
.landing-hero h1{color:#fff;font-size:29px;line-height:1.16;letter-spacing:-.035em;margin:0 0 9px;max-width:310px}
.landing-hero .in>p:last-child{color:rgba(232,241,237,.78);font-size:12.5px;line-height:1.6;margin:0;max-width:295px}
.landing-sheet{position:relative;z-index:3;flex:1;display:flex;flex-direction:column;margin-top:-28px;padding:20px 18px 14px;border-radius:28px 28px 0 0;background:var(--bg);box-shadow:0 -12px 32px rgba(5,14,11,.12)}
.landing-sheet .action-primary{width:100%;min-height:86px;display:grid;grid-template-columns:50px minmax(0,1fr) 38px;gap:13px;align-items:center;border:0;border-radius:20px;padding:16px 15px 16px 16px;background:var(--brand);color:#fff;text-align:left;box-shadow:0 17px 32px rgba(14,122,108,.26),inset 0 1px 0 rgba(255,255,255,.14);transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
.landing-sheet .action-primary .action-ic{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.14)}
.landing-sheet .action-primary .action-copy b{display:block;font-size:20px;line-height:1.25;letter-spacing:-.02em}
.landing-sheet .action-primary .action-copy span{display:block;margin-top:4px;font-size:11.5px;line-height:1.45;color:rgba(255,255,255,.77)}
.landing-sheet .action-primary .action-go{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--brand-ink);justify-self:end;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.repair-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:11px 0 13px;padding:13px 2px;border:1px solid #DDE8E3;border-radius:16px;background:#EDF4F1}
.repair-step{min-width:0;display:grid;grid-template-columns:21px minmax(0,1fr);column-gap:6px;row-gap:2px;align-items:start;padding:0 8px;text-align:left}
.repair-step+.repair-step{border-left:1px solid rgba(14,122,108,.14)}
.repair-step .n{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--brand-ink);font-size:10.5px;font-weight:700;box-shadow:inset 0 0 0 1px rgba(14,122,108,.12)}
.repair-step b{font-size:11.5px;line-height:1.3;letter-spacing:-.01em;color:#27332F}
.repair-step small{grid-column:2;font-size:9.5px;line-height:1.35;color:#78837E}
.landing-more{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#fff}
.landing-more button{width:100%;min-height:54px;display:grid;grid-template-columns:32px minmax(0,1fr) 15px;gap:10px;align-items:center;border:0;padding:10px 12px;background:#fff;color:var(--ink);text-align:left;transition:background .16s ease,color .16s ease}
.landing-more button+button{border-top:1px solid var(--line)}
.landing-more .action-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#F0F4F2;color:#65716C}
.landing-more b{display:block;font-size:12.5px;line-height:1.35;font-weight:600}
.landing-more .action-go{justify-self:end;color:#A2ABA7}
.landing-sheet .sysnote{display:flex;align-items:center;justify-content:center;gap:6px;margin:auto 0 2px;padding-top:13px;text-align:center;color:var(--faint);font-size:11.5px;line-height:1.4}
.landing-sheet .sysnote::before{content:"";width:5px;height:5px;border-radius:50%;background:#6BBE9E;flex:none}
.landing-sheet .action-primary:active{transform:scale(.985);background:var(--brand-ink)}
.landing-more button:active{background:var(--brand-soft);color:var(--brand-ink)}
.landing-sheet .action-primary:focus-visible,.landing-more button:focus-visible{outline:3px solid #9ACFC6;outline-offset:2px}
@keyframes landing-photo-in{from{opacity:.7;transform:scale(1.055)}to{opacity:1;transform:scale(1.015)}}
@keyframes landing-sheet-in{from{opacity:.4;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:no-preference){.landing-hero>img{animation:landing-photo-in .7s ease-out both}.landing-sheet{animation:landing-sheet-in .55s cubic-bezier(.22,.78,.25,1) both}}
@media (hover:hover){.landing-sheet .action-primary:hover{transform:translateY(-1px);background:var(--brand-ink);box-shadow:0 20px 38px rgba(14,122,108,.29),inset 0 1px 0 rgba(255,255,255,.14)}.landing-more button:hover{background:#F7FAF8}}
@media (max-height:720px){.landing-hero{height:292px}.landing-hero h1{font-size:27px}.landing-sheet{padding-top:17px}.landing-sheet .action-primary{min-height:80px}.repair-steps{padding:11px 2px;margin:9px 0 11px}.landing-more button{min-height:50px}.landing-sheet .sysnote{padding-top:9px}}
@media (prefers-reduced-motion:reduce){.landing-sheet .action-primary,.landing-more button{transition:none}}
.entries{display:flex;flex-direction:column;gap:10px}
.entry{display:grid;grid-template-columns:40px minmax(0,1fr) 16px;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;width:100%}
.entry:active{border-color:var(--brand);background:var(--brand-soft)}
.entry .ic{width:40px;height:40px;border-radius:11px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.entry b{display:block;font-size:15px}
.entry span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.entry:focus-visible{outline:3px solid #9ACFC6;outline-offset:2px}
/* ---- label ---- */
.finder{position:relative;background:#1B2129;border-radius:16px;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden}
.finder img{width:100%;height:100%;object-fit:cover;display:block}
.finder .frame{position:absolute;inset:26px 34px;border:2px solid rgba(255,255,255,.8);border-radius:10px}
.finder .frame::before,.finder .frame::after{content:"";position:absolute;width:24px;height:24px;border:3px solid #fff}
.finder .frame::before{top:-3px;left:-3px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.finder .frame::after{bottom:-3px;right:-3px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.finder .hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#fff;font-size:12px;text-shadow:0 1px 6px rgba(0,0,0,.6);padding:0 12px}
.finder .scanning{position:absolute;left:34px;right:34px;height:2px;background:var(--brand);box-shadow:0 0 12px var(--brand);top:26px;animation:scan 1.4s linear infinite;display:none}
.finder.busy .scanning{display:block}
@keyframes scan{0%{top:26px}100%{top:calc(100% - 26px)}}
@media (prefers-reduced-motion:reduce){.finder .scanning{animation:none}}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
.ok{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:600;font-size:13px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:6px}
.snentry{display:none;margin-top:12px}
.inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fff;outline:none;font-size:16px}
.inp:focus{border-color:var(--brand)}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}

/* ---- consult: shared stage shell ---- */
.view.consult{padding:0;overflow:hidden;position:relative;background:#0C1114}
.stg{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);color:var(--ink)}
.stg.on{display:flex}
.stg.dark{background:#0C1114;color:#fff}

/* aim — step 2: one full-screen camera, nothing else on screen */
.cam{position:relative;flex:1;min-height:0;background:#0C1114;overflow:hidden}
.cam video,.cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.cam.live video{display:block}
.cam:not(.live) img{display:block}
.cam .vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,rgba(0,0,0,0) 42%,rgba(0,0,0,.5) 100%);pointer-events:none}
.cam .top{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:8px}
.cam .top .sp{flex:1}
.cam .close{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(8,12,14,.5);color:#fff;display:grid;place-items:center;flex:none;padding:0;backdrop-filter:blur(4px)}
.pill-b{background:rgba(8,12,14,.62);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:11px;padding:5px 10px;border-radius:999px;backdrop-filter:blur(4px);white-space:nowrap}
button.pill-b{padding:5px 10px}
.pill-b.demo{color:#FFC15E;border-color:rgba(255,193,94,.45)}
.rec-ring{position:absolute;top:54px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:6px;background:rgba(180,35,35,.92);color:#fff;font-size:11px;padding:5px 11px;border-radius:999px;font-variant-numeric:tabular-nums}
.rec-ring.on{display:inline-flex}
.rec-ring i{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.rec-ring i{animation:none}}
.ret{position:absolute;left:50%;top:42%;width:168px;height:120px;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.85);border-radius:6px;pointer-events:none}
.ret::before,.ret::after{content:"";position:absolute;width:18px;height:18px;border:2px solid #fff}
.ret::before{left:-1px;top:-1px;border-right:0;border-bottom:0;border-radius:4px 0 0 0}
.ret::after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-radius:0 0 4px 0}
.cam .tip{position:absolute;left:20px;right:20px;top:calc(42% + 74px);text-align:center;color:#fff;font-size:12.5px;line-height:1.45;text-shadow:0 1px 8px rgba(0,0,0,.8);pointer-events:none}
.cam-modes{position:absolute;left:0;right:0;bottom:132px;display:flex;justify-content:center;gap:18px}
.mode{border:0;background:none;color:rgba(255,255,255,.6);font-size:12px;font-weight:600;padding:5px 2px;position:relative}
.mode.on{color:#fff}
.mode.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-1px;width:14px;height:2px;background:#E4573F;border-radius:2px}
.cam .tools{position:absolute;left:14px;right:14px;bottom:56px;display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:8px}
.shutter{width:70px;height:70px;border-radius:50%;border:3px solid rgba(255,255,255,.85);background:transparent;padding:5px;display:grid;place-items:center;justify-self:center}
.shutter span{width:100%;height:100%;border-radius:50%;background:#fff;display:block;transition:transform .12s,border-radius .12s,background .12s}
.shutter:active span{transform:scale(.92)}
.shutter.rec span{border-radius:9px;background:#E4573F;transform:scale(.6)}
.tool-btn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(8,12,14,.45);color:#fff;display:grid;place-items:center;justify-self:center;padding:0}
.shots-mini{display:flex;gap:4px;align-items:center;min-width:0}
.shots-mini .th{width:30px;height:30px;border-radius:5px;overflow:hidden;border:1px solid rgba(255,255,255,.4);position:relative;flex:none}
.shots-mini .th img{width:100%;height:100%;object-fit:cover}
.shots-mini .th b{position:absolute;left:1px;bottom:1px;font-size:7px;color:#fff;background:rgba(0,0,0,.6);padding:0 2px;border-radius:2px}
.cam-brand{position:absolute;left:0;right:0;bottom:34px;text-align:center;color:rgba(255,255,255,.42);font-size:9.5px;letter-spacing:.06em}
.cam-go{position:absolute;left:14px;right:14px;bottom:0;padding:0 0 6px}
.cam-go .btn{padding:12px;font-size:14px;border-radius:11px;background:rgba(255,255,255,.94);color:#0C1114}
.cam-go .btn:disabled{background:rgba(255,255,255,.22);color:rgba(255,255,255,.6)}
.opts-overlay{position:absolute;inset:0;background:rgba(8,12,14,.72);backdrop-filter:blur(6px);z-index:6;display:none;flex-direction:column;justify-content:flex-end;padding:16px}
.opts-overlay.on{display:flex}
.opts-overlay .box{background:#fff;border-radius:16px;padding:14px;color:var(--ink)}
.opts-overlay h3{margin:0 0 10px;font-size:14px}
.opts-overlay .spot{width:100%;display:grid;grid-template-columns:64px 1fr 16px;align-items:center;gap:10px;margin-bottom:8px;padding:6px 8px;background:#fff;color:var(--ink);border-radius:10px;text-align:left}
.opts-overlay .spot img{width:64px;height:48px;border-radius:8px}
.opts-overlay .spot b{padding:0;font-size:12.5px}

/* how (step 1: pick how to describe it) — full-bleed scene with a bottom action sheet */
.how-body{display:block;padding:0;overflow:hidden;background:#0C1114}
.how-hero{position:absolute;inset:0;overflow:hidden;background:#20262D}
.how-hero img{width:100%;height:100%;object-fit:cover;object-position:50% 42%;transform:scale(1.02);animation:how-image-in .7s cubic-bezier(.2,.72,.2,1) both}
.how-hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,14,17,.7) 0%,rgba(9,14,17,.02) 32%,rgba(9,14,17,.16) 58%,rgba(9,14,17,.82) 100%)}
.how-hero .in{position:absolute;left:20px;right:20px;top:20px;max-width:278px;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.32)}
.how-hero b{display:block;font-size:19px;line-height:1.25;letter-spacing:-.01em}
.how-hero span{display:block;font-size:12px;color:#D6DEE4;margin-top:4px}
.how-focus{position:absolute;left:50%;top:43%;width:148px;height:104px;transform:translate(-50%,-50%);opacity:.68;filter:drop-shadow(0 1px 5px rgba(0,0,0,.28));pointer-events:none}
.how-focus::before,.how-focus::after{content:"";position:absolute;inset:0;border-radius:16px;background:linear-gradient(#fff,#fff) left top/28px 2px no-repeat,linear-gradient(#fff,#fff) left top/2px 28px no-repeat,linear-gradient(#fff,#fff) right top/28px 2px no-repeat,linear-gradient(#fff,#fff) right top/2px 28px no-repeat,linear-gradient(#fff,#fff) left bottom/28px 2px no-repeat,linear-gradient(#fff,#fff) left bottom/2px 28px no-repeat,linear-gradient(#fff,#fff) right bottom/28px 2px no-repeat,linear-gradient(#fff,#fff) right bottom/2px 28px no-repeat}
.how-focus::after{inset:50% auto auto 50%;width:5px;height:5px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);opacity:.9}
.how-sheet{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:16px 16px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#F6F7F9 0%,#fff 20%);border-radius:26px 26px 0 0;box-shadow:0 -16px 42px rgba(8,12,14,.25);animation:how-sheet-in .55s cubic-bezier(.2,.72,.2,1) both}
.how-list{display:grid;gap:10px}
.how{display:grid;grid-template-columns:44px minmax(0,1fr) 30px;gap:12px;align-items:center;text-align:left;background:#fff;border:1px solid #D9E0E6;border-radius:17px;padding:14px;min-height:92px;box-shadow:0 6px 18px rgba(20,30,38,.06);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease}
.how .ic{width:44px;height:44px;border-radius:13px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center}
.how .ic.dark{background:#20262D;color:#fff}
.how .tx b{display:block;font-size:15px}
.how .tx span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.how .tx em{display:inline-block;font-style:normal;font-size:11px;color:var(--brand-ink);background:var(--brand-soft);border-radius:5px;padding:2px 7px;margin-top:6px}
.how .ok{display:grid;place-items:center;color:transparent;font-weight:800;font-size:15px;text-align:center;transition:transform .16s ease}
.how.on{border-color:var(--brand);background:#F4FBF9;box-shadow:0 0 0 3px var(--brand-soft)}
.how.on .ok{color:var(--brand)}
.how-primary{grid-template-columns:48px minmax(0,1fr) 34px;padding:16px 14px;background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 14px 30px rgba(15,25,32,.18)}
.how-primary .ic{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.16);color:#fff}
.how-primary .tx b{font-size:16px}
.how-primary .tx span{color:rgba(255,255,255,.78)}
.how-primary .tx em{color:#fff;background:rgba(255,255,255,.14)}
.how-primary .ok{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--brand-ink);font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.how-combo .ic{position:relative}
.how-combo .ic .addon{position:absolute;right:-5px;bottom:-5px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;border:2px solid #fff}
.how:active{transform:scale(.985)}
.how:focus-visible{outline:3px solid #9ACFC6;outline-offset:2px}
@keyframes how-image-in{from{opacity:.6;transform:scale(1.07)}to{opacity:1;transform:scale(1.02)}}
@keyframes how-sheet-in{from{opacity:.35;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}
@media (hover:hover){.how:not(.how-primary):hover{border-color:#BFC8D2;box-shadow:0 10px 22px rgba(20,30,38,.1);transform:translateY(-1px)}.how-primary:hover{background:var(--brand-ink);box-shadow:0 17px 34px rgba(20,30,38,.26)}.how:hover .ok{transform:translateX(2px)}}
@media (max-height:700px){.how-hero .in{top:14px}.how-sheet{padding-top:12px}.how{min-height:82px;padding:12px}.how-primary{min-height:88px}}
@media (prefers-reduced-motion:reduce){.how,.how .ok{transition:none}.how-hero img,.how-sheet{animation:none}}

/* photo review — captured photo, optional note, then hand off to the assistant */
.review-body{padding:14px 16px 18px}
.review-preview{position:relative;height:276px;border-radius:18px;overflow:hidden;background:#20262D;box-shadow:0 12px 28px rgba(15,25,32,.18)}
.review-preview img{width:100%;height:100%;object-fit:cover;display:block}
.review-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,14,17,.02) 50%,rgba(9,14,17,.66) 100%);pointer-events:none}
.review-count{position:absolute;left:12px;bottom:12px;color:#fff;background:rgba(8,12,14,.64);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:5px 9px;font-size:11px;backdrop-filter:blur(5px)}
.review-add{position:absolute;right:12px;bottom:12px;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.3);border-radius:999px;background:rgba(8,12,14,.68);color:#fff;padding:7px 11px;font-size:11.5px;font-weight:600;backdrop-filter:blur(5px)}
.review-add:active{transform:scale(.97)}
.review-strip{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
.review-strip::-webkit-scrollbar{display:none}
.review-thumb{width:50px;height:50px;border-radius:10px;overflow:hidden;border:2px solid transparent;background:#fff;padding:0;flex:none;transition:border-color .15s,transform .15s}
.review-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.review-thumb.on{border-color:var(--brand)}
.review-thumb.add{display:grid;place-items:center;border:1px dashed #B7C1CA;color:var(--brand-ink);font-size:22px;font-weight:300;background:#fff}
.review-thumb:active{transform:scale(.96)}
.review-note-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.review-note-action{min-height:56px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;font-weight:600;padding:9px 10px;transition:border-color .15s,background .15s,color .15s}
.review-note-action .ic{width:28px;height:28px;border-radius:9px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.review-note-action.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
.review-note-action:focus-visible,.review-add:focus-visible,.review-thumb:focus-visible,.review-voice:focus-visible{outline:3px solid #9ACFC6;outline-offset:2px}
.review-note-panel{display:none;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}
.review-note-panel.on{display:block}
.review-note-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.review-note-head b{font-size:13px}
.review-note-tools{display:flex;gap:6px}
.review-note-tools button{border:0;background:none;color:var(--muted);font-size:11px;padding:3px 4px}
.review-note-tools button.done{color:var(--brand-ink);font-weight:700}
.review-voice{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:var(--bg);text-align:left;color:var(--ink)}
.review-voice .mic{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none;transition:background .15s}
.review-voice .copy{min-width:0;display:flex;flex-direction:column;gap:1px}
.review-voice .copy b{font-size:12.5px}
.review-voice .copy small{font-size:10.5px;color:var(--muted)}
.review-voice .wave{margin-left:auto;display:flex;align-items:center;gap:2px;height:18px;flex:none}
.review-voice .wave i{width:2px;height:5px;border-radius:2px;background:var(--brand);opacity:.35}
.review-voice.recording{border-color:#EFB3B3;background:#FDECEC}
.review-voice.recording .mic{background:var(--red)}
.review-voice.recording .wave i{opacity:1;animation:wavebar .7s ease-in-out infinite}
.review-voice.recording .wave i:nth-child(2){animation-delay:.12s}
.review-voice.recording .wave i:nth-child(3){animation-delay:.24s}
.review-voice.done{border-color:#CBE6CF;background:#F2FAF3}
.review-voice.done .mic{background:var(--green)}
.review-text{display:none}
.review-note-panel[data-mode="text"] .review-voice{display:none}
.review-note-panel[data-mode="text"] .review-text{display:block}
.review-text textarea{width:100%;min-height:82px;border:1px solid var(--line);border-radius:11px;background:var(--bg);padding:10px 11px;resize:vertical;outline:none;font-size:13.5px;line-height:1.5}
.review-text textarea:focus{border-color:var(--brand);background:#fff}
@media (max-height:700px){.review-preview{height:232px}.review-body{padding-top:10px}.review-strip{padding:8px 0 9px}.review-note-action{min-height:50px}}
@media (prefers-reduced-motion:reduce){.review-thumb,.review-note-action,.review-voice .mic{transition:none}.review-voice.recording .wave i{animation:none}}

/* analyzing */
.analyze{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 26px;background:#0C1114;color:#fff}
.analyze .thumb{width:104px;height:104px;border-radius:50%;overflow:hidden;margin:0 auto 18px;position:relative}
.analyze .thumb img{width:100%;height:100%;object-fit:cover}
.analyze .thumb::after{content:"";position:absolute;inset:-7px;border:2px solid var(--brand-ink);border-top-color:transparent;border-radius:50%;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.analyze h2{font-size:19px;margin:0 0 4px;text-align:center}
.analyze .lead{color:#9AA7B0;font-size:12.5px;text-align:center;margin:0 0 16px}
.an-bar{height:4px;background:rgba(255,255,255,.16);border-radius:3px;overflow:hidden;margin-bottom:16px}
.an-bar i{display:block;height:100%;width:6%;background:#57C9B4;transition:width .45s}
.an-list{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.an-list li{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center;font-size:12.5px;color:#7C8992}
.an-list li::before{content:"";width:11px;height:11px;border-radius:50%;border:1px solid #5A666E}
.an-list li.done{color:#fff}
.an-list li.done::before{background:#57C9B4;border-color:#57C9B4;box-shadow:inset 0 0 0 3px #0C1114}
.an-list small{font-size:10px;color:#7C8992}

/* stage head bar shared by confirm/verdict/guide/outcome/handoff */
.stg-head{flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px 10px;background:#fff;border-bottom:1px solid var(--line)}
.stg-head .t{flex:1;min-width:0}
.stg-head b{display:block;font-size:15px;line-height:1.3}
.stg-head span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.iconbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--muted);display:grid;place-items:center;flex:none;padding:0}
.stg-body{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 20px}
.stg-foot{flex:none;padding:11px 16px 18px;background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(15,25,32,.05)}

/* evidence photo with hotspot */
.evi{position:relative;border-radius:14px;overflow:hidden;background:#111;margin-bottom:14px}
.evi img{width:100%;height:190px;object-fit:cover;display:block;filter:saturate(1.02)}
.evi .hs{position:absolute;width:56px;height:56px;border:2px solid #FFC15E;border-radius:50%;box-shadow:0 0 0 9999px rgba(8,12,14,.18)}
.evi .hs b{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);background:#0C1114;color:#fff;font-size:10px;padding:3px 7px;border-radius:5px;white-space:nowrap}
.evi .cap{position:absolute;left:10px;bottom:10px;right:10px;color:#fff;font-size:11px;text-shadow:0 1px 6px rgba(0,0,0,.8);display:flex;gap:6px;align-items:center}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.bdg{font-size:11px;border-radius:999px;padding:3px 9px;border:1px solid var(--line);background:#fff;color:var(--muted)}
.bdg.good{background:#E8F5EA;border-color:#CBE6CF;color:#2F7D32}
.bdg.warn{background:var(--amber-soft);border-color:#F0DBB8;color:var(--amber)}
.bdg.bad{background:var(--red-soft);border-color:#F3CFCB;color:var(--red)}
.risk{border-radius:14px;padding:13px 14px;margin-bottom:12px;background:var(--brand-soft);border:1px solid #CBE6DF}
.risk b{display:block;font-size:15px;color:var(--brand-ink)}
.risk p{margin:3px 0 0;font-size:12.5px;color:#31554E;line-height:1.5}
.risk.bad{background:var(--red-soft);border-color:#F1C9C6}
.risk.bad b{color:var(--red)} .risk.bad p{color:#7E3A33}
.risk.warn{background:var(--amber-soft);border-color:#F0DBB8}
.risk.warn b{color:var(--amber)} .risk.warn p{color:#7A5418}
.conf{display:grid;grid-template-columns:1fr 64px;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:12px}
.conf b{font-size:13px}
.conf p{margin:4px 0 0;font-size:11px;color:var(--faint)}
.conf .bar{height:5px;border-radius:3px;background:#E7EBEF;margin-top:7px;overflow:hidden}
.conf .bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .5s}
.conf strong{font-size:22px;color:var(--brand-ink);text-align:right;font-variant-numeric:tabular-nums}
.said{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:14px;line-height:1.6;white-space:pre-wrap}
.said .who{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--faint);margin-bottom:6px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}
#vEvi{margin-bottom:10px}
#vEvi img{height:118px}
.fact{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 10px}
.fact span{display:block;font-size:10.5px;color:var(--faint)}
.fact b{display:block;font-size:12.5px;margin-top:2px;line-height:1.35}

/* judgment + guided conversation */
.consult-stage{background:#F4F6F4}
.consult-live .stepnote{display:none}
.consult-evidence{position:relative;flex:none;width:100%;height:clamp(132px,24vh,176px);border:0;padding:0;overflow:hidden;background:#111;text-align:left;transition:height .28s cubic-bezier(.22,.78,.25,1)}
.consult-evidence img{width:100%;height:100%;object-fit:cover;object-position:center 44%;display:block;transition:transform .35s ease,filter .25s ease}
.consult-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,12,10,.5) 0%,rgba(5,12,10,.03) 42%,rgba(5,12,10,.72) 100%);pointer-events:none}
.consult-evidence .hs{position:absolute;left:32%;top:26%;width:58px;height:58px;border:2px solid #FFC15E;border-radius:50%;box-shadow:0 0 0 9999px rgba(8,12,14,.13),0 0 0 5px rgba(255,193,94,.12);transition:transform .25s ease,opacity .2s ease;pointer-events:none}
.consult-evidence .hs b{position:absolute;left:50%;bottom:calc(100% + 7px);transform:translateX(-50%);background:rgba(8,12,14,.9);color:#fff;font-size:10px;padding:4px 8px;border-radius:6px;white-space:nowrap;font-weight:600}
.consult-evidence-top,.consult-evidence-bottom{position:absolute;left:14px;right:14px;display:flex;align-items:center;gap:7px;color:#fff;z-index:2}
.consult-evidence-top{top:12px}
.consult-evidence-bottom{bottom:12px}
.evidence-kicker{margin-right:auto;display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.55)}
.evidence-kicker::before{content:"";width:6px;height:6px;border-radius:50%;background:#6ED4B7;box-shadow:0 0 0 3px rgba(110,212,183,.18)}
.consult-collapse-icon{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(8,12,14,.45);border:1px solid rgba(255,255,255,.24);font-size:13px;transform:rotate(0);transition:transform .25s ease;backdrop-filter:blur(6px)}
.risk-pill,.confidence-pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 9px;font-size:10.5px;font-weight:650;line-height:1.25;backdrop-filter:blur(8px)}
.risk-pill{background:rgba(255,255,255,.9);color:#245D51;border:1px solid rgba(255,255,255,.55);max-width:64%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.risk-pill.warn{background:rgba(255,245,224,.94);color:#7A5418;border-color:rgba(240,219,184,.9)}
.risk-pill.stop{background:rgba(255,235,232,.95);color:#A12D24;border-color:rgba(243,207,203,.9)}
.confidence-pill{background:rgba(8,12,14,.55);color:#fff;border:1px solid rgba(255,255,255,.18);margin-left:auto}
.consult-evidence.compact{height:76px}
.consult-evidence.compact img{transform:scale(1.035);filter:brightness(.88) saturate(.95)}
.consult-evidence.compact .hs{width:38px;height:38px;transform:scale(.72);opacity:.75}
.consult-evidence.compact .hs b{display:none}
.consult-evidence.compact .consult-collapse-icon{transform:rotate(180deg)}
.consult-evidence.compact .evidence-kicker{font-size:9.5px}
.consult-evidence.compact .risk-pill,.consult-evidence.compact .confidence-pill{font-size:9.5px;padding:3px 7px}
.consult-titlebar{flex:none;display:flex;align-items:center;gap:9px;padding:10px 15px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);box-shadow:0 5px 18px rgba(14,24,20,.04)}
.consult-agent-avatar{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:750;letter-spacing:.02em;flex:none;box-shadow:0 4px 10px rgba(14,122,108,.18)}
.consult-agent-copy{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.consult-agent-copy b{font-size:13px;font-weight:650}
.consult-agent-copy span{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.consult-progress{flex:none;border:1px solid #CFE3DD;background:#EDF7F4;color:var(--brand-ink);border-radius:999px;padding:4px 8px;font-size:10px;font-weight:650;max-width:112px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.consult-scrollwrap{position:relative;flex:1;min-height:0}
.consult-scroll{height:100%;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth}
.consult-chat{display:flex;flex-direction:column;gap:12px;padding:14px 14px 18px;min-height:100%}
.consult-row{display:flex;align-items:flex-end;gap:8px;animation:consult-bubble-in .22s ease-out both}
.consult-row.me{justify-content:flex-end}
.consult-avatar{width:26px;height:26px;border-radius:8px;background:var(--brand-soft);border:1px solid #CBE6DF;color:var(--brand-ink);display:grid;place-items:center;font-size:8px;font-weight:800;flex:none;margin-bottom:2px}
.consult-bubble{max-width:84%;padding:11px 13px;border-radius:17px 17px 17px 6px;background:#fff;border:1px solid var(--line);font-size:14px;line-height:1.55;color:var(--ink);box-shadow:0 5px 16px rgba(18,31,25,.035)}
.consult-row.me .consult-bubble{max-width:82%;background:var(--brand);border-color:var(--brand);color:#fff;border-radius:17px 17px 6px 17px;box-shadow:0 7px 18px rgba(14,122,108,.16)}
.consult-copy{white-space:pre-wrap;overflow-wrap:anywhere}
.consult-meta{font-size:10px;color:var(--faint);margin-top:6px;line-height:1.3}
.consult-row.me .consult-meta{color:rgba(255,255,255,.72)}
.judgment-row .consult-bubble{max-width:calc(100% - 34px);padding:13px 14px 11px}
.judgment-head{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.judgment-kicker{font-size:10px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.judgment-row .risk-pill{background:#E8F5EA;border-color:#CBE6CF;color:#2F7D32;backdrop-filter:none}
.judgment-row .risk-pill.warn{background:var(--amber-soft);border-color:#F0DBB8;color:var(--amber)}
.judgment-row .risk-pill.stop{background:var(--red-soft);border-color:#F1C9C6;color:var(--red)}
.judgment-row .confidence-pill{background:#F2F5F4;border-color:var(--line);color:var(--muted);backdrop-filter:none}
.judgment-lead{font-size:11px;color:var(--muted);margin-bottom:4px}
.judgment-copy{font-size:14.5px;line-height:1.6}
.consult-why{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.consult-why summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--brand-ink);font-weight:600;min-height:28px;user-select:none}
.consult-why summary::-webkit-details-marker{display:none}
.consult-why summary::after{content:"›";margin-left:auto;color:var(--faint);font-size:16px;transform:rotate(90deg);transition:transform .2s ease}
.consult-why[open] summary::after{transform:rotate(-90deg)}
.why-body{padding:4px 0 2px;font-size:11.5px;color:#4E5A63;line-height:1.5}
.why-meter{height:5px;border-radius:3px;background:#E7EBEF;overflow:hidden}
.why-meter i{display:block;height:100%;background:var(--brand);border-radius:3px}
.why-note{margin-top:6px;color:var(--muted)}
.why-facts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.why-facts span{background:#F7FAF8;border:1px solid #E4ECE9;border-radius:9px;padding:7px 8px;min-width:0}
.why-facts small{display:block;color:var(--faint);font-size:9.5px;margin-bottom:2px}
.why-facts b{display:block;font-size:10.5px;line-height:1.35;font-weight:600;color:#34423D}
.why-body p{margin:6px 0 0;color:var(--muted)}
.consult-step .consult-bubble{max-width:calc(100% - 34px);padding:13px 14px 12px;border-left:3px solid var(--brand);box-shadow:0 9px 24px rgba(17,37,29,.06)}
.consult-step-head{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.consult-step-num{width:25px;height:25px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:750;flex:none;box-shadow:0 4px 9px rgba(14,122,108,.2)}
.consult-step-label{font-size:10px;color:var(--muted);font-weight:650;letter-spacing:.02em}
.consult-step-state{margin-left:auto;width:21px;height:21px;border-radius:50%;border:1px solid #D7E4DF;color:transparent;display:grid;place-items:center;font-size:11px;transition:background .2s,color .2s,border-color .2s}
.consult-step-lead{font-size:13.5px;line-height:1.55;color:#3E4C47;margin:1px 0 5px}
.consult-step-title{font-size:14.5px;font-weight:700;line-height:1.35;margin-bottom:4px}
.consult-step.done{opacity:.76}
.consult-step.done .consult-step-state{background:#E8F5EA;border-color:#CBE6CF;color:#2F7D32}
.consult-video{width:100%;display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;margin-top:8px;padding:6px 8px;border:1px solid #DDE6E2;border-radius:10px;background:#F7FAF8;text-align:left;color:var(--ink)}
.consult-video-icon{width:30px;height:30px;border-radius:8px;background:#101816;color:#fff;display:grid;place-items:center;font-size:10px}
.consult-video b{display:block;font-size:11.5px;line-height:1.25}
.consult-video small{display:block;font-size:9.5px;color:var(--faint);margin-top:2px}
.consult-actions{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 2px 48px;animation:consult-bubble-in .2s ease-out both}
.consult-actions button{min-height:44px;border-radius:999px;padding:9px 15px;font-size:13px;font-weight:650;line-height:1.2;cursor:pointer}
.consult-actions button.primary{background:var(--brand);border:1px solid var(--brand);color:#fff;box-shadow:0 7px 16px rgba(14,122,108,.15)}
.consult-actions button.secondary{background:#fff;border:1px solid #CAD8D3;color:#44524D}
.consult-actions button:disabled{opacity:.5;box-shadow:none}
.consult-typing-row{align-items:center}
.consult-typing{display:inline-flex;gap:4px;padding:11px 13px;border:1px solid var(--line);border-radius:15px 15px 15px 6px;background:#fff}
.consult-typing i{width:5px;height:5px;border-radius:50%;background:var(--faint);animation:bl 1s infinite}
.consult-typing i:nth-child(2){animation-delay:.15s}.consult-typing i:nth-child(3){animation-delay:.3s}
.consult-transcribing{align-self:flex-start;margin-left:34px;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-size:11px;padding:7px 11px;animation:consult-bubble-in .18s ease-out both}
.consult-transcribing-dot{width:6px;height:6px;border-radius:50%;background:var(--brand);animation:voicepulse 1s ease-in-out infinite}
.consult-new-msg{position:absolute;left:50%;bottom:12px;transform:translate(-50%,8px);opacity:0;pointer-events:none;border:0;border-radius:999px;background:#17221E;color:#fff;font-size:11px;padding:7px 12px;box-shadow:0 7px 18px rgba(10,19,16,.2);transition:opacity .18s,transform .18s;z-index:3}
.consult-new-msg.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.consult-composer{flex:none;display:flex;align-items:flex-end;gap:8px;padding:9px 13px calc(15px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 22px rgba(15,25,32,.05)}
.consult-composer.busy .consult-voice,.consult-composer.busy textarea{opacity:.72}
.consult-composer textarea{display:none;flex:1;min-height:44px;max-height:96px;resize:none;border:1px solid var(--line);border-radius:22px;padding:11px 14px;outline:none;font-size:15px;line-height:1.35;background:var(--bg);color:var(--ink)}
.consult-composer.text-mode textarea{display:block}
.consult-composer.text-mode .consult-voice{display:none}
.consult-voice{flex:1;min-width:0;height:44px;border:1px solid #CADFD8;border-radius:22px;background:#EFF8F5;color:var(--brand-ink);display:flex;align-items:center;gap:8px;padding:0 10px;text-align:left;transition:background .16s,border-color .16s,box-shadow .16s}
.consult-voice-orb{width:27px;height:27px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.consult-voice-copy{min-width:0;display:flex;flex-direction:column;line-height:1.12}
.consult-voice-copy b{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.consult-voice-copy small{font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.consult-wave{margin-left:auto;height:16px;display:flex;align-items:center;gap:2px;flex:none}
.consult-wave i{width:2px;height:4px;border-radius:2px;background:var(--brand);opacity:.34}
.consult-voice.recording{background:#FAEDEA;border-color:#E9C1BA;box-shadow:0 0 0 4px rgba(180,35,35,.06)}
.consult-voice.recording .consult-voice-orb{background:#B42323}
.consult-voice.recording .consult-wave i{opacity:1;animation:wavebar .7s ease-in-out infinite}
.consult-voice.recording .consult-wave i:nth-child(2){animation-delay:.1s}
.consult-voice.recording .consult-wave i:nth-child(3){animation-delay:.2s}
.consult-voice.recording .consult-wave i:nth-child(4){animation-delay:.3s}
.consult-icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--muted);display:grid;place-items:center;flex:none;padding:0}
.consult-send{background:var(--brand);border-color:var(--brand);color:#fff}
.consult-composer button:disabled{opacity:.45}
.consult-evidence:focus-visible,.consult-actions button:focus-visible,.consult-voice:focus-visible,.consult-icon-btn:focus-visible,.consult-composer textarea:focus-visible,.consult-new-msg:focus-visible,.consult-why summary:focus-visible,.consult-video:focus-visible{outline:3px solid #8FC9BC;outline-offset:2px}
@keyframes consult-bubble-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media (max-height:720px){.consult-evidence{height:112px}.consult-evidence.compact{height:64px}.consult-titlebar{padding-top:8px;padding-bottom:8px}.consult-chat{gap:10px;padding-top:12px}.consult-bubble{font-size:13.5px}}
@media (prefers-reduced-motion:reduce){.consult-evidence,.consult-evidence img,.consult-collapse-icon,.consult-new-msg{transition:none}.consult-row,.consult-actions{animation:none}.consult-scroll{scroll-behavior:auto}.consult-voice.recording .consult-wave i{animation:none}}

/* outcome */
.outcome{padding:22px 18px 18px}
.outcome h1{margin:2px 0 6px;font-size:22px}
.outcome .lead{margin-bottom:16px;font-size:14px}
.out{display:grid;gap:10px}
.out button{display:grid;grid-template-columns:38px 1fr 14px;gap:12px;align-items:center;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.out button .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:var(--brand-soft);color:var(--brand-ink)}
.out button.good .ic{background:#E8F5EA;color:#2F7D32}
.out button.bad .ic{background:var(--red-soft);color:var(--red)}
.out button.warn .ic{background:var(--amber-soft);color:var(--amber)}
.out button b{display:block;font-size:15px}
.out button span{display:block;font-size:12px;color:var(--muted);margin-top:1px;line-height:1.4}

/* safety */
.safety{flex:1;background:var(--red);color:#fff;padding:22px 20px 18px;display:flex;flex-direction:column}
.safety .stop{width:54px;height:54px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.06em}
.safety h1{color:#fff;font-size:23px;margin:14px 0 6px}
.safety p{color:#FBE0DC;font-size:13.5px;margin:0}
.safety ol{margin:16px 0 0;padding:0;list-style:none;counter-reset:s;display:grid;gap:11px}
.safety ol li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:13px;line-height:1.5}
.safety ol li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:11px;font-weight:700}

/* handoff */
.tech{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.tech img{width:56px;height:56px;border-radius:12px;object-fit:cover}
.tech b{display:block;font-size:14px}
.tech span{display:block;font-size:11.5px;color:var(--muted)}
.tech .on{color:var(--green);font-weight:600}
.handoff-note{background:#F7FAF8;border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:12px;transition:border-color .15s,box-shadow .15s}
.handoff-note:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.handoff-note label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}
.handoff-note label b{font-size:12.5px;line-height:1.3}
.handoff-note label span{font-size:10.5px;color:var(--faint)}
.handoff-note textarea{display:block;width:100%;min-height:70px;max-height:150px;resize:vertical;border:0;background:transparent;padding:0;outline:0;color:var(--ink);font-size:13px;line-height:1.55}
.handoff-note textarea::placeholder{color:#9AA3AE}
.handoff-note small{display:block;margin-top:6px;font-size:10.5px;line-height:1.4;color:var(--faint)}
.pack{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:12px 0 14px;background:#fff}
.pack div{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:9px 11px;border-bottom:1px solid var(--line);font-size:12.5px}
.pack div:last-child{border-bottom:0}
.pack i{color:var(--green);font-style:normal;font-weight:800}
.pack small{color:var(--faint);font-size:11px}
/* text fallback stage (kept for typed input) */
.scrollwrap{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.chat{display:flex;flex-direction:column;gap:11px;padding:14px 14px 8px}
.msg{max-width:88%;padding:10px 13px;border-radius:15px;line-height:1.5;font-size:14.5px;white-space:pre-wrap}
.msg.ai{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start}
.msg.me{background:var(--brand);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.msg .meta{font-size:11px;color:var(--faint);margin-top:4px}
.human{align-self:center;background:var(--amber-soft);color:#6B3A05;border-radius:12px;padding:8px 14px;font-size:13px;text-align:center}
.quick{display:flex;gap:8px;flex-wrap:wrap;align-self:flex-start}
.quick button{border:1px solid var(--brand);color:var(--brand-ink);background:#fff;border-radius:18px;padding:7px 13px;font-size:14px}
.typing{align-self:flex-start;display:inline-flex;gap:4px;padding:11px 13px;background:#fff;border:1px solid var(--line);border-radius:15px;border-bottom-left-radius:6px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.3}40%{opacity:1}}
.composer{flex:none;display:flex;gap:8px;align-items:flex-end;padding:10px 14px 22px;background:#fff;border-top:1px solid var(--line)}
.composer textarea{flex:1;border:1px solid var(--line);border-radius:20px;padding:10px 14px;resize:none;outline:none;max-height:90px;font-size:15px;background:var(--bg)}
.composer .ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--muted);flex:none}
.composer .send{background:var(--brand);color:#fff;border:0}
.composer .voice-main{flex:1;min-width:0;height:40px;border:1px solid var(--brand);border-radius:20px;background:var(--brand-soft);color:var(--brand-ink);display:flex;align-items:center;gap:8px;padding:0 11px;text-align:left}
.composer .voice-main .voice-symbol{width:25px;height:25px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.composer .voice-main .voice-text{min-width:0;display:flex;flex-direction:column;line-height:1.15}
.composer .voice-main .voice-text b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.composer .voice-main .voice-text small{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.composer .voice-wave{margin-left:auto;display:flex;align-items:center;gap:2px;height:18px;flex:none}
.composer .voice-wave i{display:block;width:2px;height:5px;border-radius:2px;background:var(--brand);opacity:.35}
.composer .voice-main.recording{background:#FDECEC;border-color:#EFB3B3;color:#A32626;animation:voicepulse 1.2s ease-in-out infinite}
.composer .voice-main.recording .voice-symbol{background:#B42323}
.composer .voice-main.recording .voice-wave i{opacity:1;animation:wavebar .7s ease-in-out infinite}
.composer .voice-main.recording .voice-wave i:nth-child(2){animation-delay:.12s}
.composer .voice-main.recording .voice-wave i:nth-child(3){animation-delay:.24s}
.composer.text-mode .voice-main{display:none}
.composer:not(.text-mode) textarea{display:none}
@keyframes voicepulse{0%,100%{box-shadow:0 0 0 0 rgba(180,35,35,.15)}50%{box-shadow:0 0 0 7px rgba(180,35,35,0)}}
@keyframes wavebar{0%,100%{height:5px}50%{height:15px}}

/* wrap-up */
.done-icon{width:64px;height:64px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:12px 0 8px}
.sum{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;margin:12px 0 14px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:10px 13px;border-bottom:1px solid var(--line);font-size:13px}
.sum div:last-child{border-bottom:0}
.sum span{color:var(--muted)} .sum b{text-align:right;font-weight:600}
.stars{display:flex;gap:6px;margin:4px 0 14px}
.stars button{border:0;background:none;font-size:28px;color:#CBD2DA;padding:0}
.stars button.on{color:#E0A100}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:#1C232B;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;z-index:9;max-width:88%;text-align:center;pointer-events:none;line-height:1.4}
.toast.show{opacity:1}
.home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#171C22;opacity:.25;z-index:8}

/* manual */
.man{border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 12px;margin-bottom:9px}
.man summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px}
.man summary::-webkit-details-marker{display:none}
.man summary::after{content:"›";margin-left:auto;color:var(--faint);transform:rotate(90deg);font-size:16px}
.man[open] summary::after{transform:rotate(-90deg)}
.man ol{margin:9px 0 4px;padding-left:18px;font-size:13.5px;color:#2B333C;line-height:1.6}
.manual-video{width:100%;display:grid;grid-template-columns:74px 1fr;align-items:center;gap:11px;border:1px solid #DCE3E8;border-radius:11px;padding:7px;margin:9px 0;background:linear-gradient(135deg,#F7FAFB,#EDF2F4);text-align:left;color:var(--ink)}
.manual-video .thumb{height:50px;border-radius:8px;overflow:hidden;position:relative}
.manual-video .thumb img{width:100%;height:100%;object-fit:cover}
.manual-video .thumb::after{content:"";position:absolute;inset:0;background:rgba(8,12,14,.26)}
.manual-video .thumb .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;z-index:2}
.manual-video .thumb .play svg{width:11px;height:11px;margin-left:1px;color:#0C1114}
.manual-video .thumb .du{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:9px;padding:0 4px;border-radius:3px;z-index:2}
.manual-video .copy b{display:block;font-size:13px;margin-bottom:1px}
.manual-video .copy small{font-size:11px;color:var(--muted)}
.manual-support-link{margin:10px auto 0;border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:5px 8px}
.doc-view.show{padding:0;overflow:hidden;background:#EEF1F3}
.doc-scroll{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 18px}
.doc-paper{background:#fff;border:1px solid #E0E5E9;border-radius:16px;padding:20px 17px;box-shadow:0 8px 24px rgba(27,33,41,.06)}
.doc-cover{padding-bottom:16px;border-bottom:1px solid var(--line)}
.doc-kicker{display:inline-flex;align-items:center;gap:5px;color:var(--brand-ink);background:var(--brand-soft);border-radius:999px;padding:3px 8px;font-size:10px;font-weight:700;letter-spacing:.04em}
.doc-paper h1{font-family:"Songti SC","Noto Serif SC",Georgia,serif;font-size:22px;line-height:1.3;margin:10px 0 6px}
.doc-paper h2{font-family:"Songti SC","Noto Serif SC",Georgia,serif;font-size:18px;margin:0 0 6px}
.doc-paper h3{font-size:12px;color:var(--muted);margin:14px 0 6px;letter-spacing:.03em}
.doc-paper p{font-size:13px;color:var(--muted);margin:0}
.doc-toc{display:flex;flex-direction:column;gap:5px;margin-top:14px}
.doc-toc button{border:0;background:#F5F7F8;border-radius:8px;padding:8px 10px;text-align:left;color:#34404A;font-size:12px}
.doc-section{padding:18px 0;border-bottom:1px solid var(--line)}
.doc-section:last-child{border-bottom:0}
.doc-section .doc-section-count{font-size:10px;color:var(--faint);font-weight:700;letter-spacing:.08em;margin-bottom:5px}
.doc-section ol{margin:8px 0 12px;padding-left:20px;font-size:13px;line-height:1.65;color:#2B333C}
.doc-note{background:#F5F8F7;border-left:3px solid var(--brand);border-radius:0 8px 8px 0;padding:9px 10px;font-size:12px;color:#4D5B62;line-height:1.55}
.doc-footer{padding-top:16px;font-size:11px;color:var(--faint);text-align:center}
.doc-chat-panel{flex:none;border-top:1px solid var(--line);background:#fff;padding:9px 12px 19px;box-shadow:0 -8px 24px rgba(27,33,41,.07)}
.doc-chat-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.doc-chat-head b{display:block;font-size:12px}
.doc-chat-head span{display:block;font-size:10px;color:var(--faint)}
.doc-chat-list{max-height:98px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:7px 0}
.doc-msg{max-width:92%;padding:7px 10px;border-radius:11px;font-size:12px;line-height:1.5}
.doc-msg.ai{background:var(--bg);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.doc-msg.user{background:var(--brand);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.doc-msg.typing{color:var(--muted)}
.doc-composer{display:flex;gap:7px;align-items:center}
.doc-composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:18px;padding:9px 12px;background:var(--bg);outline:none;font-size:13px}
.doc-composer input:focus{border-color:var(--brand)}
.doc-composer button{width:36px;height:36px;border:0;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}

/* track */
.track-steps{list-style:none;margin:14px 0 0;padding:0;counter-reset:ts}
.track-steps li{position:relative;padding:0 0 14px 26px;counter-increment:ts}
.track-steps li::before{content:counter(ts);position:absolute;left:0;top:0;width:18px;height:18px;border-radius:50%;background:var(--line);color:var(--muted);font-size:10px;display:grid;place-items:center;font-weight:700}
.track-steps li::after{content:"";position:absolute;left:8.5px;top:20px;bottom:0;width:1px;background:var(--line)}
.track-steps li:last-child::after{display:none}
.track-steps li.done::before{background:var(--brand);color:#fff}
.track-steps b{display:block;font-size:13px}
.track-steps span{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
</style>
</head>
<body>
<div class="stage">
  <div class="caption">
    <div class="langtoggle"><button id="tg-zh" onclick="setLang('zh')">中文</button><button id="tg-en" onclick="setLang('en')">English</button></div>

    <p data-i="cap_p"></p>
    <ol class="flow" id="flow"></ol>
    <p class="note" data-i="cap_hint"></p>
