/* ---------- 工单相关工具 ---------- */
const ST = { ai:['AI处理中','ai'], guiding:['修复指导中','amber'], human:['待品牌方售后','amber'], factory:['已升级工厂','violet'], done:['已解决','green'], late:['SLA超时','red'] };
function slaDeadline(t){ if(t.status==='human') return t.statusSince+Policy.slaHours('l1')*HR; if(t.status==='factory') return t.statusSince+Policy.slaHours('l2')*HR; if(t.status==='guiding'&&t.guideDue) return t.guideDue; return null; }
function isLate(t){ const d=slaDeadline(t); return d!==null && Date.now()>d; }
function viewStatus(t){ return isLate(t)?'late':t.status; }
function slaText(t){ if(t.status==='done') return '已完成'; const d=slaDeadline(t); if(d===null) return t.status==='ai'&&t.pending?'等你确认':'—'; const r=d-Date.now(); return r<0?`超时 ${dur(-r)}`:dur(r); }
function tagOf(t){ const [l,c]=ST[viewStatus(t)]; return `<span class="tag ${c}"><span class="dot"></span>${l}</span>`; }
function tById(id){ return state.tickets.find(t=>t.id===id); }
function tByTag(tag){ return state.tickets.find(t=>t.tag===tag); }
function partnerOf(name){ return state.partners.find(p=>p.name===name)||null; }
function orderMembers(o){ const list=[{role:'b',name:'杨梦',email:'yang.meng@ironpeak.com',org:'IronPeak Fitness',status:'active',scope:'brand'}];
  for(const orgName of [o.factory,o.dealer]){ const p=partnerOf(orgName); if(!p) continue; for(const c of p.contacts) if(c.defaultAll&&!(o.excluded||[]).includes(c.email)) list.push({role:p.type==='factory'?'f':'d',name:c.name,email:c.email,org:p.name,status:c.status,scope:'org',title:c.title}); }
  for(const m of (o.overrides||[])) if(!list.some(x=>x.email===m.email)) list.push({...m,scope:'order'});
  return list; }
function factoryContact(o){ const ms=orderMembers(o).filter(m=>m.role==='f'); return ms.find(m=>m.status==='active')||ms[0]||null; }
function me(){ return ROLE[role].email; }
function isMember(o,email){ return orderMembers(o).some(m=>m.email===email&&m.status==='active'); }
function myOrders(){ if(role==='brand') return state.orders; return state.orders.filter(o=>isMember(o,me())); }
function visibleTickets(){ const ids=new Set(myOrders().map(o=>o.id)); return state.tickets.filter(t=>role==='brand'||ids.has(t.order)||(t.collab||[]).some(c=>c.email===me()&&c.status==='active')).sort((a,b)=>b.updatedAt-a.updatedAt); }
function ordersWithoutFactory(){ return state.orders.filter(o=>!factoryContact(o)); }
// 订单号与种子一致：PO-YY + 三位流水（PO-24118 → 下一张 PO-24132 之后）
function nextOrderId(){ const d=new Date(); const yy=String(d.getFullYear()).slice(2); const nums=state.orders.map(o=>(o.id.match(/^PO-\d{2}(\d{3})$/)||[])[1]).filter(Boolean).map(Number); const n=(nums.length?Math.max(...nums):100)+1; return `PO-${yy}${String(n).padStart(3,'0')}`; }
// 新建 / CSV 导入共用的校验与构造；返回 {ok, error} 或 {ok, order}
function buildOrder(f){ const id=(f.id||'').trim().toUpperCase(); if(!/^PO-\d{3,6}$/.test(id)) return {ok:false,error:`订单号 ${id||'(空)'} 格式应如 PO-24140`}; if(state.orders.some(o=>o.id===id)) return {ok:false,error:`订单号 ${id} 已存在`};
  const product=(f.product||'').trim().toUpperCase(); if(!state.products.some(p=>p.id===product)) return {ok:false,error:`型号 ${product||'(空)'} 不存在`};
  const batch=(f.batch||'').trim().toUpperCase(); if(!/^\d{2}[A-Z]$/.test(batch)) return {ok:false,error:`批次 ${batch||'(空)'} 格式应如 25B`};
  const dup=state.orders.find(o=>o.product===product&&(o.batches||[]).includes(batch)); if(dup) return {ok:false,error:`${product} 的批次 ${batch} 已属于订单 ${dup.id}，序列号会解析到那张订单；一个批次只能属于一张订单`};
  const factory=(f.factory||'').trim(); if(!factory) return {ok:false,error:'工厂不能为空'};
  const ship=/^\d{4}-\d{2}-\d{2}$/.test(f.ship||'')?f.ship:new Date().toISOString().slice(0,10); const warrantyUntil=ship.slice(0,7).replace(/^(\d{4})/,(m)=>String(+m+2));
  const order={id,product,qty:+f.qty||0,brand:'IronPeak Fitness',factory,dealer:(f.dealer||'').trim()||'—',dealerCity:(f.city||'').trim()||'—',batches:[batch],ship,warrantyUntil,source:f.source||'手动创建',createdAt:Date.now(),overrides:[],excluded:[]};
  return {ok:true,order}; }
function addOrder(order){ if(!partnerOf(order.factory)) state.partners.push({name:order.factory,type:'factory',contacts:[]}); if(order.dealer&&order.dealer!=='—'&&!partnerOf(order.dealer)) state.partners.push({name:order.dealer,type:'dealer',contacts:[]}); state.orders.push(order); syncEngineOrders(); }
// 接口人失去某订单（撤销 / 关掉默认覆盖 / 单订单移除）后，其名下该范围的工厂工单退回品牌方
function recallFrom(email, orderIds, why){ let n=0; for(const t of state.tickets){ if(t.status==='factory'&&t.assignee&&t.assignee.email===email&&(!orderIds||orderIds.includes(t.order))){ setStatus(t,'human'); t.assignee=null; addEntry(t,'sys',`${why}，工单退回品牌方售后。`); n++; } } return n; }
function openTickets(){ return visibleTickets().filter(t=>t.status!=='done'); }
function touch(t){ t.updatedAt=Date.now(); save(); }
function addEntry(t,who,text,tr,actor){ t.timeline.push({t:Date.now(),who,text,tr,actor}); touch(t); }
function setStatus(t,st,by){ t.status=st; t.statusSince=Date.now(); if(st==='done'){ t.resolvedAt=Date.now(); t.resolvedBy=by||'brand'; } touch(t); }
function nextTicketId(){ const d=new Date(); return `T-${String(d.getFullYear()).slice(2)}${pad(d.getMonth()+1)}-${pad(++state.seq.ticket).padStart(4,'0')}`; }
function shipPart(partId, qty=1){ const inv=state.inventory.find(i=>i.part===partId); if(inv){ inv.qty=Math.max(0,inv.qty-qty); save(); return inv; } return null; }

/* ---------- 客诉处理流水线（邮件 / H5 / 代录入 共用） ---------- */
// 输入：{from, name, lang?, subject, body, channel, photos, sn?, product?, transcript?} → 返回 {ticket, steps[], merged, assessment}
// 原则：订单归属只来自序列号（不猜）；已经有人接手的工单，客户再来信只记录、提醒接手人，不重置状态与 SLA，AI 不再重复发模板
const WHO_HANDLES={ human:()=>Policy.get('routing.l1.name')+'（品牌方售后）', factory:(t)=>(t.assignee?t.assignee.name+'（'+t.assignee.org+'）':'工厂接口人') };
function runPipeline(input){
  const steps=[]; const text=[input.subject||'',input.body||''].join('\n'); const body=(input.subject?input.subject+'\n':'')+(input.body||'');
  const lang=input.lang||Engine.detectLang(text); steps.push({k:'lang',text:`识别语言：${Engine.LANG_NAME[lang]||lang}`});
  // 线程合并：同一发件人的进行中工单；7 天内关闭的工单再来信也归到原工单
  let existing=null; if(state.settings.mergeThreads&&input.from){ const mail=input.from.toLowerCase(); existing=state.tickets.find(t=>t.status!=='done'&&t.cust.email.toLowerCase()===mail)||state.tickets.find(t=>t.status==='done'&&t.resolvedAt>Date.now()-Policy.mergeReopenMs()&&t.cust.email.toLowerCase()===mail)||null; }
  let serial=Engine.parseSerial(input.sn||text); if(!serial&&existing&&existing.sn) serial=Engine.parseSerial(existing.sn); const product=input.product||(serial&&serial.valid?serial.product:null)||Engine.detectProduct(text)||(existing&&existing.product)||null;
  steps.push({k:'product',text:product?`识别产品：${Engine.productName(product)}${serial&&serial.valid?` · 序列号 ${serial.sn}（批次 ${serial.batch}）`:serial?` · 序列号 ${serial.sn} 格式无效`:' · 未提供序列号'}`:'未识别出产品型号'});
  // 订单归属只认序列号
  const order=serial&&serial.order?Engine.ORDERS.find(o=>o.id===serial.order):(existing&&existing.order?Engine.ORDERS.find(o=>o.id===existing.order):null);
  if(order) steps.push({k:'order',text:`匹配订单 ${order.id} · 分销商 ${order.dealer}（${order.dealerCity}）· 工厂 ${order.factory}${serial&&serial.warrantyUntil?` · 保修至 ${serial.warrantyUntil}`:''}`});
  else if(product) steps.push({k:'order',text:serial&&serial.valid?`序列号 ${serial.sn} 的批次 ${serial.batch} 不在任何订单里 → 订单待定，保修情况需人工核实`:`没有序列号 → 不猜订单；分销商 / 工厂待定，升级前需补序列号（${Engine.ordersFor(product).length} 张 ${product} 订单可能相关）`});
  const confirm=existing?Engine.detectConfirm(input.body||''):null;
  const name=input.name||(input.from||'').split('@')[0].replace(/[._]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());

  /* ---- A. 已关闭 7 天内再来信 ---- */
  if(existing&&existing.status==='done'){
    const t=existing; addEntry(t,'cust',body,confirm==='solved'?'客户致谢':'客户在关闭后再次来信');
    if(confirm==='solved'){ steps.push({k:'merge',text:`归入已关闭的工单 ${t.id}（同一发件人，${dur(Date.now()-t.resolvedAt)}前关闭）`},{k:'decision',text:'决策：客户致谢，工单保持关闭，不回复'}); }
    else { t.resolvedAt=null; t.resolvedBy=null; setStatus(t,'human'); addEntry(t,'sys',`客户在工单关闭后再次来信，重新打开并转 ${Policy.get('routing.l1.name')}（品牌方售后）。`); steps.push({k:'merge',text:`归入已关闭的工单 ${t.id}（同一发件人）`},{k:'decision',text:'决策：关闭后再来信 → 重新打开，直接给人看，AI 不再自动回复'}); }
    steps.push({k:'ticket',text:`工单 ${t.id} 已更新`}); touch(t); return { ticket:t, steps, merged:true, assessment:null, reopened:confirm!=='solved' };
  }
  /* ---- B. 已由人工 / 工厂接手的工单：只记录并提醒，不改状态 ---- */
  if(existing&&(existing.status==='human'||existing.status==='factory')){
    const t=existing; const who=WHO_HANDLES[t.status](t);
    addEntry(t,'cust',body,confirm==='solved'?'客户确认问题已解决':confirm==='notfixed'?'客户反馈仍未解决':confirm==='human'?'客户要求人工':'客户追加来信');
    t.photos+=input.photos||0; if(serial&&serial.valid&&!t.sn){ t.sn=serial.sn; t.batch=serial.batch; if(order){ t.order=order.id; t.dealer=order.dealer; } }
    steps.push({k:'merge',text:`与进行中的工单 ${t.id} 合并（同一发件人），当前由 ${who} 处理`});
    if(confirm==='solved'){ setStatus(t,'done',t.status==='factory'?'factory':'brand'); addEntry(t,'sys','客户确认问题已解决，工单关闭。'); steps.push({k:'decision',text:'决策：客户确认解决 → 关闭工单'}); }
    else { addEntry(t,'sys',`客户追加来信，已提醒 ${who}；工单状态与 SLA 不变，AI 不重复发送安抚模板。`); steps.push({k:'decision',text:`决策：工单已有人接手，AI 不自动回复，只把新来信附到工单并提醒 ${who}（SLA 继续计时）`}); }
    steps.push({k:'ticket',text:`工单 ${t.id} 已更新`}); touch(t); return { ticket:t, steps, merged:true, assessment:null };
  }

  /* ---- C. 新工单，或 AI 仍在处理中的工单 ---- */
  const a=Engine.assess({text,product,serial,photos:(input.photos||0)+(existing?existing.photos:0),email:input.from||'',settings:state.settings});
  if(existing){
    if(confirm==='solved'){ const t=existing; addEntry(t,'cust',body,'客户确认问题已解决'); setStatus(t,'done','ai'); addEntry(t,'sys','客户确认问题已解决，工单自动关闭。'); steps.push({k:'merge',text:`与进行中的工单 ${t.id} 合并（同一发件人）`},{k:'decision',text:'决策：客户确认 AI 的方案有效 → 自动关闭'},{k:'ticket',text:`工单 ${t.id} 已更新`}); touch(t); return { ticket:t, steps, merged:true, assessment:a }; }
    if(confirm==='human'){ a.route='human'; a.action='hold'; a.humanRequest=true; }
    else if(confirm==='notfixed'||(a.match&&existing.kbId===a.match.entry.id&&a.route==='ai'&&existing.timeline.some(e=>e.who==='ai'))){ a.route='human'; a.action='hold'; a.followUp=true; }
  }
  steps.push({k:'kb',text:a.match?`检索知识库：「${a.match.entry.cat.zh}」命中 ${a.match.hits} 个关键词${a.match.ambiguous?`（与「${a.match.runnerUp.cat.zh}」得分相同）`:''}`:'检索知识库：无匹配条目（置信度封顶 45%，不会直接回复）'});
  steps.push({k:'conf',text:`置信度 ${a.confidence}%，阈值 ${a.threshold}%`});
  steps.push({k:'rules',text:a.reasons.length?`规则检查：${a.reasons.map(r=>r.zh).join('、')} → 一律先给人看`:'规则检查：未触发'});
  if(a.followUp) steps.push({k:'follow',text:confirm==='notfixed'?'客户明确反馈方案无效 → 不再重复猜测，转人工':'客户就同一问题再次来信，说明 AI 的建议未解决 → 不再重复建议，转人工'});
  if(a.humanRequest) steps.push({k:'follow',text:'客户要求真人处理 → 转人工'});
  // 同批次聚集（相对其他批次）
  let cluster=null; if(a.match&&serial&&serial.valid&&order){ cluster=batchCluster(state.tickets,a.match.entry.id,product,serial.batch,existing); if(cluster.hot) steps.push({k:'batch',text:`${clusterReason(cluster)} → AI 建议升级工厂（需品牌方确认，不自动升级）`}); else if(cluster.same) steps.push({k:'batch',text:`批次 ${serial.batch} 此前 ${cluster.same} 起「${a.match.entry.cat.zh}」，其他批次 ${cluster.others} 起，未达到批次异常判定`}); }
  let t=existing;
  if(t){ steps.push({k:'merge',text:`与进行中的工单 ${t.id} 合并（同一发件人）`}); addEntry(t,'cust',body,a.match?a.match.entry.cat.zh:'（未匹配知识条目）'); t.photos+=input.photos||0; if(serial&&serial.valid&&!t.sn){ t.sn=serial.sn; t.batch=serial.batch; if(order){ t.order=order.id; t.dealer=order.dealer; } } }
  else { t=newTicket({ id:input.id||nextTicketId(), cust:{name,email:input.from||'',lang}, product, sn:serial&&serial.valid?serial.sn:null, batch:serial&&serial.valid?serial.batch:null, order:order?order.id:null, dealer:order?order.dealer:null, channel:input.channel||'email', issue:(input.subject||input.body||'').slice(0,120), kbId:a.match?a.match.entry.id:null, confidence:a.confidence, reasons:a.reasons.map(r=>r.k), photos:input.photos||0 });
    const tr=a.match?a.match.entry.cat.zh:'（未匹配知识条目）';
    if(input.transcript&&input.transcript.length){ input.transcript.forEach(m=>t.timeline.push({t:m.t||Date.now(),who:m.who,text:m.text,tr:m.tr||(m.who==='cust'?tr:'')})); t.h5Seen=input.transcript.length; } else t.timeline.push({t:Date.now(),who:'cust',text:body,tr});
    state.tickets.push(t); }
  t.confidence=a.confidence; t.reasons=a.reasons.map(r=>r.k); if(a.match) t.kbId=a.match.entry.id;
  if(cluster&&cluster.hot&&t.status!=='factory') t.suggest={type:'factory',reason:clusterReason({...cluster,same:cluster.same+1}),at:Date.now()};
  if(input.skipReply){ t.status=input.status||(a.route==='human'?'human':'ai'); t.statusSince=Date.now(); if(t.status==='done'){ t.resolvedAt=Date.now(); t.resolvedBy='ai'; } }
  else if(a.route==='ai'){
    if(a.action==='ask' && t.asks>=Policy.maxAskRounds()){ setStatus(t,'human'); addEntry(t,'sys',`AI 已追问 ${Policy.maxAskRounds()} 轮仍无法判断，转品牌方售后（一级）。`); steps.push({k:'decision',text:'决策：追问次数用尽 → 转品牌方售后'}); }
    else { const reply=Engine.compose(a,ctxFor(t)); addEntry(t,'ai',reply,Engine.summarizeZh(a,{})); if(a.action==='ask') t.asks=(t.asks||0)+1;
      // 修复优先：条目声明 repairFirst → 进入「指导中」，给客户 N 天自修窗口，到期自动追问；反馈“没修好”走已有 notfixed 分支转寄件确认
      const repairFirst=a.action==='reply'&&a.match&&a.match.entry.repairFirst;
      t.status=repairFirst?'guiding':'ai'; t.statusSince=Date.now();
      if(repairFirst&&!t.guideDue){ t.guideDue=Date.now()+Policy.repairGuideMs(); addEntry(t,'sys',`按「修复优先」处理：已发送自修指引（${a.match.entry.stepTitle.zh}），约定 ${Policy.get('guard.repairGuideDays')} 天内跟进客户结果；确认没修好则转寄件确认。`); steps.push({k:'guide',text:'修复优先：AI 发送自修指引，2 天跟进窗口内等客户反馈；未反馈自动追问，没修好转寄件确认'}); }
      if(a.action==='reply'&&Engine.offersPart(a)){ const e=a.match.entry;
        if(a.canShip){ const inv=shipPart(e.part); t.pending=null; t.shipped=true; addEntry(t,'sys',`AI 已承诺免费寄送 ${e.partName.zh}（${e.part}），${inv?`${inv.loc} 库存扣减至 ${inv.qty}`:'无库存记录'}。`); steps.push({k:'ship',text:`承诺寄件：${e.partName.zh}${e.partValue<=50?' ≤ 50 美元':' > 50 美元'}，按设置 AI 可直接承诺；库存已扣减`}); }
        else { t.pending={type:'ship',part:e.part,from:shipFrom(t,e.part),value:e.partValue,at:Date.now()}; addEntry(t,'sys',`${e.partName.zh}（${e.part}，约 ${e.partValue} 美元）${e.partValue>Policy.get('shipping.autoCommitLimitUsd')?'超过 AI 可自行承诺的 '+Policy.get('shipping.autoCommitLimitUsd')+' 美元':'按设置 AI 不可自行承诺'}，已告知客户“同事会在 ${Policy.get('routing.l1.hours')} 小时内确认”，等品牌方确认补发。`); steps.push({k:'ship',text:`寄件需确认：${e.partName.zh} 约 ${e.partValue} 美元，${e.partValue>Policy.get('shipping.autoCommitLimitUsd')?'> '+Policy.get('shipping.autoCommitLimitUsd')+' 美元':'小件承诺已关闭'} → AI 不承诺，生成"等你确认补发"，客户已收到说明`}); } }
      steps.push({k:'decision',text:a.action==='reply'?`决策：AI 用${Engine.LANG_NAME[lang]}直接回复${state.settings.ccBrand?'，抄送品牌方售后邮箱':''}`:'决策：信息不足，AI 向客户追问（第 '+t.asks+' 轮）'}); }
  } else { const reply=Engine.compose(a,ctxFor(t)); addEntry(t,'ai',reply,Engine.summarizeZh(a,{})); setStatus(t,'human'); addEntry(t,'sys',`已转 ${Policy.get('routing.l1.name')}（品牌方售后，一级，${Policy.get('routing.l1.hours')} 小时）。`); steps.push({k:'decision',text:`决策：暂停自动承诺，AI 先安抚并转 ${Policy.get('routing.l1.name')}（${Policy.get('routing.l1.hours')} 小时内）`}); }
  steps.push({k:'ticket',text:existing?`工单 ${t.id} 已更新`:`已创建工单 ${t.id}`});
  touch(t); return { ticket:t, steps, merged:!!existing, assessment:a };
}

/* ---------- 读取 H5 收件箱（增量：首次建单，之后同一工单的新消息 / 邮箱 / 评分 / 状态 / 寄件都会合并进来） ---------- */
function importInbox(){
  let inbox=[]; try{ inbox=JSON.parse(localStorage.getItem(INBOX_KEY)||'[]'); }catch(e){ return 0; }
  let created=0, updated=0;
  for(const it of inbox){ if(!it.id) continue; const isNew=!state.importedH5.includes(it.id);
    if(isNew){
      if(it.product&&state.qrs[it.product]) state.qrs[it.product].scans++;
      runPipeline({ id:it.id, from:it.email||`h5-${it.id.toLowerCase()}@anonymous`, name:it.name||'H5 用户', lang:it.lang, subject:'', body:[it.chips,it.issue].filter(Boolean).join('\n'), channel:'h5', photos:it.photos||0, sn:it.sn, product:it.product, transcript:it.transcript, skipReply:true, status:it.status });
      state.importedH5.push(it.id); created++;
    }
    const t=state.tickets.find(x=>x.id===it.id); if(!t) continue;   // 被合并进其他工单的情况不做增量
    let changed=false; const tr=t.kbId?(Engine.KB.find(k=>k.id===t.kbId)||{cat:{zh:''}}).cat.zh:'（未匹配知识条目）';
    const seen=t.h5Seen||0; const tx=it.transcript||[];
    if(tx.length>seen){ for(const m of tx.slice(seen)) t.timeline.push({t:m.t||Date.now(),who:m.who,text:m.text,tr:m.tr||(m.who==='cust'?tr:'')}); t.h5Seen=tx.length; changed=true; }
    if(it.photos&&it.photos>t.photos){ t.photos=it.photos; changed=true; }
    if(it.email&&t.cust.email!==it.email){ t.cust.email=it.email; t.cust.name=it.name||t.cust.name; t.timeline.push({t:Date.now(),who:'sys',text:`客户在 H5 留下邮箱 ${it.email}，后续进度将邮件通知。`}); changed=true; }
    if(it.rating&&t.rating!==it.rating){ t.rating=it.rating; t.timeline.push({t:Date.now(),who:'sys',text:`客户在 H5 评分 ${it.rating} / 5。`}); changed=true; }
    if(it.ship&&!t.shipped){ const inv=shipPart(it.ship); t.shipped=true; t.pending=null; t.timeline.push({t:Date.now(),who:'sys',text:`H5 对话中 AI 已承诺免费寄送 ${inv?inv.name:it.ship}，${inv?`${inv.loc} 库存扣减至 ${inv.qty}`:'无库存记录'}。`}); changed=true; }
    if(it.pendingShip&&!t.shipped&&!t.pending){ const kb=Engine.KB.find(k=>k.part===it.pendingShip); t.pending={type:'ship',part:it.pendingShip,from:shipFrom(t,it.pendingShip),value:kb?kb.partValue:null,at:Date.now()}; t.timeline.push({t:Date.now(),who:'sys',text:`H5 对话中 AI 判断需要 ${kb?kb.partName.zh:it.pendingShip}（${it.pendingShip}${kb?'，约 '+kb.partValue+' 美元':''}），超出 AI 可承诺范围，等品牌方确认补发。`}); changed=true; }
    if(it.status==='done'&&t.status!=='done'){ setStatus(t,'done','ai'); t.timeline.push({t:Date.now(),who:'sys',text:'客户在 H5 确认问题已解决，工单关闭。'}); changed=true; }
    else if(it.status==='human'&&t.status==='ai'){ setStatus(t,'human'); t.timeline.push({t:Date.now(),who:'sys',text:`H5 对话转人工，已转 ${Policy.get('routing.l1.name')}（品牌方售后，一级）。`}); changed=true; }
    if(changed){ t.updatedAt=Date.now(); if(!isNew) updated++; }
  }
  if(created||updated) save(); return created+updated;
}

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2400)}
function closeAll(){$('#overlay').classList.remove('show');$('#drawer').classList.remove('show');$('#modal').classList.remove('show')}

function download(name, content, type='text/plain'){ const b=new Blob([content],{type}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); }
function decisions(){ const d=[]; for(const t of openTickets()){ if(t.status==='human'||isLate(t)) d.push({k:'ticket',id:t.id,title:`${t.id} ${issueLabel(t,24)}`,sub:isLate(t)?`已超时 ${slaText(t).replace('超时 ','')}，${t.status==='factory'?'工厂未在时限内回复，考虑催促或换人':'等品牌方确认；AI 不会自动越级'}`:(t.reasons.length?`触发规则「${t.reasons.map(r=>({safety:'安全件',refund:'退换货',negative:'负面情绪',b2b:'B端'}[r])).join('、')}」，AI 已暂停自动承诺`:'AI 无法判断，等人工确认')});
    if(t.pending) d.push({k:'ticket',id:t.id,title:`${t.id} 等你确认补发`,sub:`${state.inventory.find(i=>i.part===t.pending.part)?.name||t.pending.part}${t.pending.value?`（约 ${t.pending.value} 美元）`:''}，AI 建议由 ${t.pending.from} 就近补发；客户已被告知等确认`});
    for(const s of (t.shipments||[])) if(s.shippedAt&&!s.tracking&&Date.now()-s.shippedAt>Policy.trackingMs()) d.push({k:'ticket',id:t.id,title:`${t.id} 已发货但没有运单号`,sub:`${s.parts} 已于 ${fmt(s.shippedAt)} 发出，超过 ${Policy.get('shipping.requireTrackingWithinHours')} 小时未回填运单号——品牌与消费者都在等（FWT-61 里这拖了 4 天）`});
    if(t.capa&&t.capa.status==='open'&&new Date(t.capa.due).getTime()-Date.now()<30*DAY) d.push({k:'ticket',id:t.id,title:`${t.id} 质量事件待验证`,sub:`${t.capa.title}（负责人 ${t.capa.owner}，截止 ${t.capa.due}）——口头措施不结案，需工厂提交验证结果`});
    if(t.suggest&&t.status!=='factory'){ const o=state.orders.find(x=>x.id===t.order); const fc=o?factoryContact(o):null; d.push({k:'ticket',id:t.id,title:`AI 建议升级工厂：${t.id}`,sub:`${t.suggest.reason}。接收人：${fc?fc.name+'（'+fc.org+(fc.status==='pending'?'，待接受':'')+'）':'缺少接口人，升级前需先邀请'}`}); }
    if(t.status==='factory'&&t.assignee&&t.assignee.status==='pending') d.push({k:'ticket',id:t.id,title:`${t.id} 指派给了尚未接受邀请的 ${t.assignee.name}`,sub:`${t.assignee.org} 还没接受邀请，这张工单目前没人处理`});

    </div>`).join('')}</div></div>`:''}
    ${t.capa?`<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>质量事件（CAPA）</h3><div class="sp"></div><span class="tag ${t.capa.status==='open'?'amber':'green'}">${t.capa.status==='open'?'跟进中':'已验证'}</span></div><div class="card-b"><b>${esc(t.capa.title)}</b><div class="muted small">负责人 ${esc(t.capa.owner)} · 截止 ${esc(t.capa.due)}${t.capa.note?` · ${esc(t.capa.note)}`:''}</div>${canAct&&role==='brand'&&t.capa.status==='open'?`<div class="row" style="margin-top:8px"><button class="btn sm" onclick="capaDone('${t.id}')">工厂已提交验证结果</button></div>`:''}</div></div>`:''}
    <div class="card"><div class="card-h"><h3>对话时间线</h3><div class="sp"></div><span class="muted small">${masked()?'客户原文已隐藏，显示 AI 摘要':'原文 + 系统摘要'}</span><button class="btn sm" onclick="openTimelineNote('${t.id}')">＋ 添加时间线事件描述</button></div>
    <div class="card-b"><ul class="tl">${t.timeline.map(e=>`<li class="${e.who}"><div class="t">${fmt(e.t)}</div><div><div class="who">${WHO[e.who]}${e.actor?` · ${esc(e.actor)}`:''}${e.who==='ai'&&t.status!=='done'&&e===last?' <span class="tag ai">最新</span>':''}</div><div class="msg">${esc(maskText(e))}</div>${e.tr&&!masked()?`<div class="tr">${esc(e.tr)}</div>`:''}</div></li>`).join('')}</ul></div></div>
    ${!canAct?`<div class="row" style="margin-top:16px;justify-content:flex-end"><span class="muted small">由 ${({ai:'AI',brand:'品牌方',factory:'工厂',dealer:'分销商'})[t.resolvedBy]||'—'} 解决 · 用时 ${dur(t.resolvedAt-t.createdAt)}</span>${role==='brand'?`<button class="btn" onclick="reopen('${t.id}')">重新打开</button>`:''}</div>`:''}
  </div>
  ${canAct?`<div class="drawer-reply"><div class="card" style="margin:0">
    <div class="card-h"><h3>${replyLabel}</h3><div class="sp"></div>${replyMeta?`<span class="muted small">${replyMeta}</span>`:''}</div>
    <div class="card-b"><textarea class="input" id="replyBox" style="width:100%" placeholder="${role==='factory'?'用中文写即可，例如：同批次抽检 5 台未复现，判定为个案，按保修更换。':''}">${esc(suggest)}</textarea>
      <div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn primary" onclick="sendReply('${t.id}')">${replyLabel}</button>${role==='factory'?'':`<span class="muted small" title="正式版：LLM 按条目步骤与客户语气改写草稿；原型不模拟">换一种说法（正式版由 LLM 改写）</span>`}<div class="sp" style="flex:1"></div>${role==='brand'&&t.status!=='factory'?`<button class="btn" onclick="escalate('${t.id}')">升级给工厂${fc?'':'（需先邀请）'}</button>`:''}${role==='brand'&&t.status==='factory'?`<button class="btn" onclick="recall('${t.id}')">撤回到品牌方</button>`:''}${role==='factory'?'<span class="muted small">关单由品牌方确认</span>':`<button class="btn" onclick="resolve('${t.id}')">${role==='dealer'?'门店已处理':'标记已解决'}</button>`}</div>
    </div>
  </div></div>`:''}

function openTimelineNote(id){
  const t=tById(id); if(!t) return;
  openModal(`<div class="drawer-h"><h3>添加时间线事件描述</h3><span class="tag grey">${ROLE[role].name}</span><div class="sp" style="flex:1"></div><button class="x" onclick="closeModalOnly()">×</button></div><div class="drawer-b">
    <div class="notice" style="background:var(--ai-soft);border-color:#BFE3DA;color:var(--ai-ink)"><span>i</span><div>将以 <b>${esc(ROLE[role].person)} · ${esc(ROLE[role].org)}</b> 的身份写入 ${t.id} 的时间线，用于同步当前处理现状；不会改变工单状态或 SLA。</div></div>
    <div class="field" style="margin-top:16px"><label>事件描述</label><textarea class="input" id="tl_note" rows="5" placeholder="例如：已联系工厂确认批次情况，等待明天的检测结果。"></textarea></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModalOnly()">取消</button><button class="btn primary" onclick="saveTimelineNote('${t.id}')">保存到时间线</button></div>
  </div>`);
  setTimeout(()=>{const e=$('#tl_note');if(e)e.focus()},30);
}
function saveTimelineNote(id){
  const t=tById(id); if(!t) return; const text=($('#tl_note').value||'').trim(); if(!text){toast('请输入事件描述');return;}
  addEntry(t,whoByRole(),text,'手动补充时间线描述',`${ROLE[role].person} · ${ROLE[role].org}`);
  closeAll(); openTicket(id); render(); toast('已添加到时间线');
  setTimeout(()=>{const d=$('#drawer .drawer-b');if(d)d.scrollTop=d.scrollHeight},0);
}
function whoByRole(){ return role==='brand'?'human':role==='factory'?'fact':'dealer'; }
function sendReply(id){ const t=tById(id); const text=$('#replyBox').value.trim(); if(!text){ toast('回复内容为空'); return; }
  if(role==='factory'){ addEntry(t,'fact',text,`工厂接口人 ${ROLE.factory.person} 回复，待品牌方确认`); setStatus(t,'human'); addEntry(t,'sys','工厂已回复。品牌方确认后由 AI 翻译成客户语言发送。'); openTicket(id); render(); toast('已发送给品牌方，等待确认'); return; }
  if(role==='dealer'){ addEntry(t,'dealer',text,'分销商备注'); openTicket(id); render(); toast('已记录到时间线'); return; }
  const ln=lastNonSys(t); const fromFactory=ln&&ln.who==='fact';
  addEntry(t,'human',text,fromFactory?`品牌方基于工厂回复直接回复客户，由 ${ROLE[role].person} 确认`:`由 ${ROLE[role].person} 确认发送`);
  // 人工回复里出现零件号或"补发/寄送"字样 → 视为承诺寄件，扣库存并清掉待确认项（与 AI 承诺同一口径）
  const partHit=state.inventory.find(i=>text.toUpperCase().includes(i.part.toUpperCase()))||(t.pending&&/补发|寄|ship|send|versand|schick|envi|expédi/i.test(text)?state.inventory.find(i=>i.part===t.pending.part):null);
  if(partHit&&!t.shipped){ const inv=shipPart(partHit.part); t.shipped=true; t.pending=null; addEntry(t,'sys',`人工回复中承诺寄送 ${inv.name}（${inv.part}），${inv.loc} 库存扣减至 ${inv.qty}。`); }
  addEntry(t,'ai',`[${Engine.LANG_NAME[t.cust.lang]||t.cust.lang}] ${text}`,fromFactory?'AI 已将工厂回复翻译为客户语言发送':'AI 已翻译并发送');
  if(t.status==='human'||t.status==='factory'){ setStatus(t,'ai'); addEntry(t,'sys','已用客户语言发送，AI 继续跟进客户回复。'); }
  openTicket(id); render(); toast('已发送，并抄送品牌方售后邮箱'); }
function escalate(id){ if(role!=='brand'){ toast('只有品牌方可以把工单升级给工厂'); return; } const t=tById(id); const o=state.orders.find(x=>x.id===t.order);
  if(!o){ toast('工单未匹配到订单，无法确定工厂接口人；请先补序列号'); return; }
  const fc=factoryContact(o);
  if(!fc){ openInvite(o.id,o.factory,t.id); return; }
  setStatus(t,'factory'); t.assignee={name:fc.name,email:fc.email,org:fc.org,status:fc.status}; t.suggest=null;
  if(fc.status==='active') addEntry(t,'sys',`已指派工厂接口人 ${fc.name}（${fc.org}），邮件通知已发送（二级，${Policy.slaHours('l2')} 小时）。附带序列号、批次、照片与 AI 摘要；客户身份不对工厂展示。`);
  else addEntry(t,'sys',`已指派 ${fc.name}（${fc.org}），但对方尚未接受邀请，已再次发送邀请邮件。接受前这张工单不会被处理，已列入"需要你的决定"。`);
  openTicket(id); render(); toast(fc.status==='active'?`已升级给 ${fc.name}`:`已升级，但 ${fc.name} 还没接受邀请`); }
function recall(id){ const t=tById(id); setStatus(t,'human'); addEntry(t,'sys',`品牌方撤回工单，${t.assignee?t.assignee.name:'工厂'}不再处理。`); t.assignee=null; openTicket(id); render(); }
function dismissSuggest(id){ const t=tById(id); addEntry(t,'sys',`品牌方忽略了 AI 的升级建议（${t.suggest.reason}）。`); t.suggest=null; openTicket(id); render(); }
function resolve(id){ if(role==='factory'){ toast('工厂不能直接关闭工单：请把结论回复给品牌方，由品牌方放行并关单'); return; } const t=tById(id); setStatus(t,'done',role==='brand'?'brand':role); addEntry(t,role==='dealer'?'dealer':'sys',role==='dealer'?'分销商门店已就近处理，同步回品牌方和工厂。':`工单由${ROLE[role].name}关闭。`); if(role==='dealer') addEntry(t,'sys','工单已关闭（分销商处理）。'); closeAll(); render(); toast(`${id} 已标记为已解决`); }
function reopen(id){ if(role!=='brand'){ toast('只有品牌方可以重新打开工单'); return; } const t=tById(id); t.status='human'; t.statusSince=Date.now(); t.resolvedAt=null; t.resolvedBy=null; addEntry(t,'sys','工单重新打开，等待品牌方售后。'); openTicket(id); render(); }
function confirmShip(id){ if(role!=='brand'){ toast('补发由品牌方确认'); return; } const t=tById(id); const inv=shipPart(t.pending.part); const kb=Engine.KB.find(k=>k.id===t.kbId); const c=ctxFor(t); addEntry(t,'human',`确认由 ${t.pending.from} 补发 ${inv?inv.name:t.pending.part}，2 到 4 个工作日内寄出。${inv?`库存扣减至 ${inv.qty}。`:''}`); const lang=['en','de','es','fr','sv','zh'].includes(c.lang)?c.lang:'en'; addEntry(t,'ai',Engine.shipLine(lang,true,{dealer:c.dealer,city:c.city}),`已用客户语言通知：${kb?kb.partName.zh:t.pending.part} 将从 ${t.pending.from} 寄出`); t.pending=null; t.shipped=true; touch(t); openTicket(id); render(); toast('已通知客户补发'); }
function declineShip(id){ const t=tById(id); addEntry(t,'human',`品牌方未确认补发 ${t.pending.part}，转人工跟进。`); t.pending=null; setStatus(t,'human'); addEntry(t,'sys',`已转 ${Policy.get('routing.l1.name')}（品牌方售后，一级）。`); openTicket(id); render(); toast('已转人工处理'); }
/* ---- 子问题核销 / 运单 / CAPA（FWT-61 引入；改的是工单上的结构化字段，时间线只做记录） ---- */
function issueDone(id,i,j){ const t=tById(id); const it=t.issues[i]; if(!it||!it.checklist[j]) return; it.checklist[j].done=!it.checklist[j].done; if(it.checklist.every(c=>c.done)&&['open','waitfact','guiding'].includes(it.status)) it.status='closed'; addEntry(t,'sys',`子问题「${it.title}」核销项${it.checklist[j].done?'完成':'取消'}：${it.checklist[j].q}`); openTicket(id); render(); }
function capaDone(id){ const t=tById(id); if(!t.capa) return; t.capa.status='verified'; t.capa.verifiedAt=Date.now(); addEntry(t,'sys',`质量事件「${t.capa.title}」验证通过，关闭 CAPA。`); openTicket(id); render(); toast('CAPA 已关闭'); }
function shipSend(id,i){ const t=tById(id); const s=t.shipments[i]; if(!s) return; s.shippedAt=Date.now(); addEntry(t,'sys',`登记发货：${s.parts} → ${s.to}（${s.method}）。运单号须在 24 小时内回填。`); openTicket(id); render(); }
function shipTrack(id,i){ const t=tById(id); const s=t.shipments[i]; if(!s) return; const v=($('#trk'+i).value||'').trim(); if(!v){ toast('运单号为空'); return; } s.tracking=v; s.trackingAt=Date.now(); addEntry(t,'sys',`运单号 ${v} 已回填并推送给品牌与消费者（FWT-61 里这拖了 4 天）。`); openTicket(id); render(); toast('运单号已推送'); }
function shipArrived(id,i){ const t=tById(id); const s=t.shipments[i]; if(!s) return; s.arrivedAt=Date.now(); addEntry(t,'sys',`${s.to} 确认签收（${s.parts}）。`); openTicket(id); render(); }
function simCustomer(id){ const t=tById(id); const text=$('#custSim').value.trim(); if(!text) return; const r=runPipeline({from:t.cust.email,name:t.cust.name,lang:t.cust.lang,subject:'',body:text,photos:/photo|video|foto|bild|照片|视频/i.test(text)?1:0}); openTicket(r.ticket.id); render(); toast(r.steps.at(-2).text); }
// 品牌方给没有序列号的工单补录序列号：校验格式与型号，写入批次 / 订单 / 分销商，之后才能升级给对应工厂
function setSerial(id){ const t=tById(id); const v=$('#snFix').value.trim().toUpperCase(); const p=Engine.parseSerial(v); if(!p){ toast('序列号格式不对，应为 AA0-00A-00000'); return; } if(!p.valid){ toast(`前缀 ${v.slice(0,3)} 不对应任何型号`); return; } if(t.product&&p.product!==t.product){ toast(`这个序列号属于 ${Engine.productName(p.product)}，与工单识别的 ${Engine.productName(t.product)} 不一致`); return; } t.sn=p.sn; t.batch=p.batch; t.product=t.product||p.product; if(p.order){ t.order=p.order; t.dealer=p.dealer; } addEntry(t,'sys',`品牌方补录序列号 ${p.sn}（批次 ${p.batch}）${p.order?`，匹配订单 ${p.order} · 分销商 ${p.dealer} · 工厂 ${p.factory}${p.warrantyUntil?' · 保修至 '+p.warrantyUntil:''}`:'，批次不在任何订单里，订单待定'}。`); if(t.kbId&&p.order){ const c=batchCluster(state.tickets,t.kbId,t.product,t.batch,t); if(c.hot&&t.status!=='factory') t.suggest={type:'factory',reason:clusterReason({...c,same:c.same+1}),at:Date.now()}; } openTicket(id); render(); toast(p.order?`已写入，订单 ${p.order}`:'已写入，但没有匹配到订单'); }
function openNewTicket(){ openModal(`<div class="drawer-h"><h3>代客户录入客诉</h3><div class="sp" style="flex:1"></div><button class="x" onclick="closeAll()">×</button></div><div class="drawer-b">
<p class="muted small" style="margin-top:0">用于电话或社交媒体收到的客诉。录入后走和邮件一样的流水线，AI 会用客户语言联系对方。</p>
<div class="grid g2"><div class="field"><label>客户姓名</label><input class="input" id="nt_name" placeholder="Mark Reynolds"></div><div class="field"><label>客户邮箱</label><input class="input" id="nt_mail" placeholder="customer@example.com"></div></div>

   KG._sel / KG._nodes / KG._setSel 供测试与调试，页面逻辑不依赖。 */
const KG=(()=>{
  let sel='all';
  const TAU=Math.PI*2;
  const reduce=()=>{ try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } };
  const PAL={
    product:{line:'#4FE3CE',halo:'#2DD4BF',core:'#0F8F80'},
    entry:{line:'#7FF0DE',halo:'#2DD4BF',core:'#0E7A6C'},
    part:{line:'#C6B8FF',halo:'#9C8CFF',core:'#5A4FCF'},
    term:{line:'#CBD6DC',halo:'#9FB3BC',core:'#8FA3AC'},
    gap:{line:'#F5B14C',halo:'#F5B14C',core:'#070D12'},
    file:{说明书:'#7CC5FF',零件结构:'#A79BFF','3D 模型':'#5EE0DA',历史客诉:'#F0B26B',故障代码:'#FF8F8F',安装指导:'#9BE29B',术语表:'#C9D3D9',其他资料:'#8C9AA0'}
  };
  const SHORT={说明书:'说明书',零件结构:'爆炸图','3D 模型':'3D 模型',历史客诉:'历史客诉',故障代码:'故障码表',安装指导:'安装视频',术语表:'术语表',其他资料:'资料'};
  const SKIN={product:{r:13,charge:6},entry:{r:8.5,charge:3.4},part:{r:6,charge:1.6},term:{r:4,charge:.8},file:{r:6.5,charge:2.4},gap:{r:5.5,charge:1.3},hub:{r:11,charge:4.5}};
  const FONT='-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif';
  const now90=()=>Date.now()-90*DAY;
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const randOf=id=>{ let h=2166136261; id=String(id); for(let i=0;i<id.length;i++){ h^=id.charCodeAt(i); h=Math.imul(h,16777619); } h^=h>>>13; return ((h>>>0)%1000)/1000; };
  const rgba=(hex,a)=>{ const h=hex.replace('#',''); return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${clamp(a,0,1).toFixed(3)})`; };

  /* ---------- 选择器：图谱、左侧产品线与下方列表共用 ---------- */
  const curId=()=>sel!=='all'&&state.products.some(p=>p.id===sel)?sel:'all';
  const viewFiles=()=>{ const id=curId(); return id==='all'?state.kbFiles:state.kbFiles.filter(k=>k.p===id); };
  const viewEntries=()=>{ const id=curId(); return id==='all'?Engine.KB:Engine.KB.filter(k=>k.product===id); };
  const entrySrcs=k=>state.kbFiles.filter(f=>(f.p===k.product||f.p==='全部')&&f.st==='已入库');
  const partStock=part=>{ const i=state.inventory.find(x=>x.part===part); return i?i.qty:null; };

  function gapsFor(p){
    const since=now90(), g=[];
    const files=state.kbFiles.filter(k=>k.p===p.id&&k.st==='已入库');
    const entries=Engine.KB.filter(k=>k.product===p.id);
    const tickets=state.tickets.filter(t=>t.product===p.id&&t.createdAt>since).length;
    if(!files.length) g.push({key:p.id+':files',title:`${p.id} 没有任何入库资料`,detail:`近 90 天 ${tickets} 条客诉，AI 只能靠通用条目回答，也无法生成说明书`,act:'upload'});
    else if(!entries.length) g.push({key:p.id+':entries',title:`${p.id} 有资料但没有知识条目`,detail:`${files.length} 份资料已入库，AI 尚未归纳出可直接回答的条目`,act:'tab',tab:'entries'});
    if(!p.has3d&&p.manualLangs.length) g.push({key:p.id+':3d',title:`${p.id} 没有 3D 模型`,detail:'说明书可以生成，但没有安装动画',act:'upload'});
    if(!p.maxUserWeight) g.push({key:p.id+':weight',title:`${p.id} 缺最大用户体重`,detail:'欧盟 / 北美说明书合规检查会不通过',act:'products'});
    return g;
  }
  function gapsAll(){ const g=[]; for(const p of state.products) g.push(...gapsFor(p)); return g; }

  /* ---------- 左侧产品线 ---------- */
  function railHtml(){
    const cur=curId();
    const row=(id,main,sub,warn)=>`<button class="kg-p ${cur===id?'on':''}" data-p="${esc(id)}" onclick="KG.setSel('${esc(id)}')"><span class="kg-pn">${main}</span>${warn?'<span class="kg-pg"></span>':'<span></span>'}<span class="kg-ps">${sub}</span></button>`;
    const rows=state.products.map(p=>{
      const nf=state.kbFiles.filter(k=>k.p===p.id).length, ne=Engine.KB.filter(k=>k.product===p.id).length;
      return row(p.id,`${esc(p.series)} <span style="color:#5F7378">${p.id}</span>`,`资料 ${nf} · 条目 ${ne}`,gapsFor(p).length>0);
    }).join('');
    return `<div class="kg-rail"><div class="kg-rail-h">产品线</div><div class="kg-list">
      ${row('all','全部产品线',`证据 ${state.kbFiles.length} 份 · 条目 ${Engine.KB.length} 条`,false)}${rows}
    </div></div>`;
  }
  function panel(){
    const cur=curId(), open=gapsAll().length;
    const missing=TERM_LANGS.filter(l=>state.terms.some(t=>!t[l]));
    let title,line;
    if(cur==='all'){
      title='全部产品线';
      const pend=state.kbFiles.filter(k=>k.st!=='已入库').length;
      const covered=new Set(Engine.KB.filter(k=>k.product!=='*').map(k=>k.product)).size;
      line=`<b>${state.kbFiles.length}</b> 份资料${pend?`（<b class="w">${pend}</b> 份待处理）`:''} · <b>${Engine.KB.length}</b> 条知识条目，覆盖 <b>${covered}</b> 个型号 + 通用 · 术语 <b>${state.terms.length}</b> 条${missing.length?` · <span class="w">缺 ${missing.map(l=>Engine.LANG_NAME[l]||l).join(' / ')} 列</span>`:''}${open?` · <span class="w">${open} 个缺口</span>`:''}`;
    } else {
      const p=state.products.find(x=>x.id===cur);
      const hits=state.tickets.filter(t=>t.product===cur&&t.createdAt>now90()).length, g=gapsFor(p).length;
      title=`${esc(p.series)} ${p.id}`;
      line=`资料 <b>${state.kbFiles.filter(k=>k.p===cur).length}</b> · 条目 <b>${Engine.KB.filter(k=>k.product===cur).length}</b> · 近 90 天客诉 <b>${hits}</b>${g?` · <span class="w">缺口 ${g}</span>`:''}`;
    }
    return `<div class="kg">
      <input type="file" id="kg_up" multiple hidden>
      ${railHtml()}
      <div class="kg-stage" id="kg_stage">
        <canvas id="kg_cv"></canvas>
        <div class="kg-hud kg-tl"><div class="kg-title">${title}</div><div class="kg-stat">${line}</div></div>
        <div class="kg-hud kg-tr">拖动节点或画布 · 单击跳转 · ⌘/Ctrl+滚轮缩放</div>
        <div class="kg-hud kg-bl"><div class="kg-legend">
          <span><i style="background:#2DD4BF;box-shadow:0 0 6px #2DD4BF"></i>产品</span>
          <span><i style="background:#7FF0DE"></i>知识条目</span>
          <span><i class="ring"></i>安全件</span>
          ${['说明书','零件结构','3D 模型','历史客诉','故障代码','安装指导'].map(k=>`<span><i style="background:${PAL.file[k]}"></i>${SHORT[k]}</span>`).join('')}
          <span><i class="dia"></i>零件</span><span><i class="sm"></i>术语</span><span><i class="hole"></i>缺口</span>
        </div></div>
        <div class="kg-hud kg-br"><button title="放大" onclick="KG.zoom(1.25)">+</button><button title="缩小" onclick="KG.zoom(0.8)">−</button><button title="复位视角" onclick="KG.resetView()">复位</button></div>
        <div class="kg-tip" id="kg_tip"></div>
      </div>
    </div>`;
  }

  /* ---------- 节点提示 ---------- */
  function nodeTip(n){
    if(n.type==='hub') return '<b>通用知识</b><div class="m">与所有产品线共用的条目、资料和术语</div>';
    if(n.type==='product'){
      const p=n.p, hits=state.tickets.filter(t=>t.product===p.id).length, g=gapsFor(p);
      return `<b>${esc(p.series)} ${p.id}</b><div class="m">${esc(p.seriesEn||'')} · SKU ${esc(p.sku)}</div>资料 ${state.kbFiles.filter(k=>k.p===p.id).length} · 条目 ${Engine.KB.filter(k=>k.product===p.id).length} · 累计客诉 ${hits}${g.length?`<div class="w">缺口：${g.map(x=>esc(x.title.replace(p.id+' ',''))).join('、')}</div>`:''}<div class="go">单击${curId()===p.id?'返回全部产品线':'聚焦这条产品线'}</div>`;
    }
    if(n.type==='entry'){
      const k=n.k;
      return `<b>${esc(k.cat.zh)}</b><div class="m">${esc(k.cat.en)} · ${k.product==='*'?'通用':k.product}</div>近 90 天命中 ${n.hits} 次 · 来源资料 ${entrySrcs(k).length} 份${k.safety?'<div class="w">安全件 · 先给人看</div>':''}<div class="go">单击查看条目</div>`;
    }
    if(n.type==='part'){
      const s=partStock(n.part);
      return `<b>${esc(n.partName)}</b><div class="m">零件号 ${esc(n.part)}</div>${n.safety?'<div class="w">安全件 · 需人工确认</div>':'AI 可承诺补发'}${s===null?'':` · <span class="m">在库 ${s}</span>`}`;
    }
    if(n.type==='term'){
      const miss=TERM_LANGS.filter(l=>!n.t[l]);
      return `<b>${esc(n.t.zh)}</b><div class="m">${TERM_LANGS.map(l=>esc(n.t[l]||'—')).join(' · ')}</div>${miss.length?`<div class="w">缺 ${miss.map(l=>Engine.LANG_NAME[l]||l).join(' / ')} 译法</div>`:''}${n.hits&&n.hits.length?`<div class="m">出现在 ${n.hits.map(k=>esc(k.cat.zh)).slice(0,3).join('、')}</div>`:''}<div class="go">单击查看术语表</div>`;
    }
    if(n.type==='file'){
      const f=n.file;
      return `<b>${esc(f.n)}</b><div class="m">${esc(f.t)}${f.size?' · '+esc(f.size):''}</div>关联 ${f.p} · ${esc(f.src)} · ${fmt(f.at)}<div class="m">${f.st==='解析中'?'正在解析，解析完会接上来源条目':f.st==='待确认'?'等待人工确认入库':'已入库'}</div><div class="go">单击查看资料</div>`;
    }
    if(n.type==='gap') return `<b class="w">缺口</b><b>${esc(n.gap.title)}</b><div class="m">${esc(n.gap.detail)}</div><div class="go">单击处理</div>`;
    return '';
  }

  /* ---------- 图数据 ---------- */
  const textOf=k=>[k.cat.zh,k.cat.en,...(k.steps&&k.steps.zh||[]),k.stepTitle&&k.stepTitle.zh||'',k.partName&&k.partName.zh||'',...Object.values(k.kw||{}).flat()].join(' ');
  const shortFile=f=>String(f.n||'').replace(/\.[^.]+$/,'').replace(/^\S*?\d{3,4}\s+/,'').slice(0,13)||SHORT[f.t]||'资料';
  const shortEntry=l=>{ const i=String(l).indexOf('（'); return i>4?String(l).slice(0,i):String(l); };

  function buildModel(id){
    const since=now90(), nodes=[], edges=[], nMap=new Map(), seen=new Set();
    const add=n=>{ if(nMap.has(n.id)) return; nMap.set(n.id,n); nodes.push(n); };
    const link=(a,b,kind,color)=>{ if(a===b||!nMap.has(a)||!nMap.has(b)) return; const key=[a<b?a:b,a<b?b:a,kind].join('|'); if(seen.has(key)) return; seen.add(key); edges.push({a,b,kind,color:color||null,ph:(seen.size*0.618)%1}); };
    const focusOf=k=>id==='all'||k==='*'||k===id;

    add({id:'hub',type:'hub',grp:'*',name:'hub',label:'通用',r:SKIN.hub.r});
    for(const p of state.products) add({id:'p-'+p.id,type:'product',p,grp:p.id,name:p.id,label:`${p.series} ${p.id}`,r:SKIN.product.r,focus:focusOf(p.id)});
    for(const k of Engine.KB){
      const hits=state.tickets.filter(t=>t.kbId===k.id&&t.createdAt>since).length;
      add({id:'e-'+k.id,type:'entry',k,hits,grp:k.product,name:'kbe_'+k.id,label:shortEntry(k.cat.zh),r:SKIN.entry.r+Math.min(6,Math.sqrt(hits)*1.25),focus:focusOf(k.product)});
      link('e-'+k.id,k.product==='*'?'hub':'p-'+k.product,'own');
    }
    for(const f of state.kbFiles){
      const g=(f.p==='全部')?'*':f.p;
      add({id:'f-'+f.id,type:'file',file:f,grp:g,name:'f-'+SHORT[f.t],label:shortFile(f),r:SKIN.file.r,focus:focusOf(g)});
      link('f-'+f.id,g==='*'?'hub':'p-'+g,'own');
    }
    // 聚焦单条产品线时才画「资料 → 条目」来源线（与「关键知识条目」页签里的来源规则一致），总览只画归属线
    if(id!=='all') for(const k of Engine.KB) if(k.product===id) for(const f of entrySrcs(k)) if(f.p!=='全部') link('f-'+f.id,'e-'+k.id,'src',PAL.file[f.t]||'#7CC5FF');
    for(const k of Engine.KB){
      if(!k.part) continue; const pid=String(k.part);
      if(!nMap.has('pt-'+pid)){
        add({id:'pt-'+pid,type:'part',part:pid,partName:k.partName.zh,safety:!!k.safety,grp:k.product,name:'pt-'+pid,label:k.partName.zh,r:SKIN.part.r,focus:focusOf(k.product)});
        for(const f of state.kbFiles) if(f.st==='已入库'&&f.p===k.product&&f.t==='零件结构') link('f-'+f.id,'pt-'+pid,'ref');
      }
      link('e-'+k.id,'pt-'+pid,'own');
    }
    for(const t of state.terms){
      if(!t.zh) continue;
      const hits=Engine.KB.filter(k=>textOf(k).includes(t.zh));
      add({id:'t-'+t.zh,type:'term',t,hits,grp:hits.length?(hits[0].product||'*'):'k',name:'term-'+t.zh,label:t.zh,r:SKIN.term.r,focus:id==='all'||hits.some(k=>focusOf(k.product))});
      if(hits.length) for(const k of hits) link('t-'+t.zh,'e-'+k.id,'ref');
      else { const gf=state.kbFiles.find(f=>f.p==='全部'&&f.t==='术语表'); if(gf) link('t-'+t.zh,'f-'+gf.id,'ref'); }
    }
    for(const g of gapsAll()){
      const pid=g.key.split(':')[0];
      add({id:'g-'+g.key,type:'gap',gap:g,grp:pid,name:'gap-'+g.key,label:g.title.replace(/^[A-Z]{2}-?\d+\s+/,''),r:SKIN.gap.r,focus:focusOf(pid)});
      link('g-'+g.key,'p-'+pid,'gap');
    }
    return {nodes,edges};
  }

  /* ---------- 布局：产品落位；子节点相对父节点按类型分方向 ---------- */
  function anchorsFor(id,W,H){
    const m=new Map(), prods=state.products;
    if(id==='all'){
      m.set('hub',{x:0,y:0});
      const N=prods.length, rx=Math.min(W*0.36,340), ry=Math.min(H*0.3,135);
      prods.forEach((p,i)=>{ const a=-Math.PI/2+i*TAU/N; m.set('p-'+p.id,{x:Math.cos(a)*rx,y:Math.sin(a)*ry}); });
    } else {
      m.set('p-'+id,{x:W*0.05,y:H*0.04}); m.set('hub',{x:W*0.36,y:-H*0.3});
      const others=prods.filter(p=>p.id!==id);
      others.forEach((p,j)=>{ m.set('p-'+p.id,{x:-W*0.31,y:(j-(others.length-1)/2)*Math.min(62,H*0.14)}); });
    }
    return m;
  }
  const DIRS={file:[-.95,-.42],entry:[.95,-.1],part:[.55,.85],term:[.25,.62],gap:[.72,.62]};
  function restFrom(par,child){
    if(par.type==='product'){
      const d=DIRS[child.type]||DIRS.entry;
      const isGen=child.type==='entry'&&child.k.product==='*';
      const base=isGen?70:(curId()!=='all'&&par.p&&par.p.id===curId()?140:105);
      return {x:d[0]*base,y:d[1]*base};
    }
    const a=randOf(child.id)*TAU; return {x:Math.cos(a)*80,y:Math.sin(a)*80};
  }
  function parentOf(n){
    if(n.type==='entry') return n.k.product==='*'?'hub':'p-'+n.k.product;
    if(n.type==='file') return n.file.p==='全部'?'hub':'p-'+n.file.p;
    if(n.type==='part'){ const k=Engine.KB.find(k=>k.part&&String(k.part)===n.part); return k?'e-'+k.id:null; }
    if(n.type==='gap') return 'p-'+n.gap.key.split(':')[0];
    if(n.type==='term'){ const k=n.hits&&n.hits[0]; if(k) return 'e-'+k.id; const gf=state.kbFiles.find(f=>f.p==='全部'&&f.t==='术语表'); return gf?'f-'+gf.id:null; }
    return null;
  }

  /* ---------- 模拟 ---------- */
  let kgPrev=null, kg=null, kgRo=null;
  function syncSim(id){
    const m=buildModel(id), old=kgPrev;
    const sim={nodes:[],edges:m.edges,nMap:new Map(),focus:id};
    for(const n of m.nodes){
      const o=old&&old.nMap.get(n.id);
      const nn=Object.assign({},n,{x:o?o.x:(randOf(n.id)-.5)*80,y:o?o.y:(randOf(n.id+'y')-.5)*80,vx:o?o.vx:0,vy:o?o.vy:0,drag:false,birth:o?1:0,alpha:o?o.alpha:0,scale:o?o.scale:.25});
      sim.nodes.push(nn); sim.nMap.set(nn.id,nn);
    }
    for(const e of sim.edges){ const o=old&&old.edges.find(x=>x.a===e.a&&x.b===e.b&&x.kind===e.kind); if(o){ e.ph=o.ph; e.lit=o.lit; } }
    // 新节点贴着父节点落位，避免第一帧从原点飞过来
    for(const n of sim.nodes){
      if(old&&old.nMap.has(n.id)) continue;
      const parId=parentOf(n), par=parId?sim.nMap.get(parId):null;
      if(par){ const r=restFrom(par,n); n.x=par.x+r.x*.3; n.y=par.y+r.y*.3; n.vx=r.x*.004; n.vy=r.y*.004; }
    }
    kgPrev=sim;
    return sim;
  }
  function refresh(){
    if(!kg||!kg.sim) return;
    const id=curId(), sim=kg.sim, anchors=anchorsFor(id,kg.W,kg.H);
    for(const n of sim.nodes){
      n.focus=id==='all'||n.grp==='*'||n.grp===id;
      n.sig=SKIN[n.type]||SKIN.entry;
      n.anchor=anchors.get(n.id)||null;
      const parId=parentOf(n), par=parId?sim.nMap.get(parId):null;
      n.rest=par?restFrom(par,n):null;
      n.tScale=n.focus?(id==='all'?.85:1):.36;
      n.tAlpha=n.focus?1:(id==='all'?.55:.26);
    }
    for(const e of sim.edges){ const A=sim.nMap.get(e.a),B=sim.nMap.get(e.b); if(!A||!B) continue; e.lit=Math.min(A.tAlpha,B.tAlpha)*.7+.3; }
  }
  function tick(){
    const sim=kg.sim, N=sim.nodes, W=kg.W, H=kg.H;
    for(let i=0;i<N.length;i++) for(let j=i+1;j<N.length;j++){
      const a=N[i],b=N[j];
      let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy;
      if(d2>250*250) continue;
      if(d2<1){ d2=1; dx=randOf(a.id+b.id)-.5; dy=randOf(b.id+a.id)-.5; }
      const d=Math.sqrt(d2), ux=dx/d, uy=dy/d;
      const s=(a.focus&&b.focus)?1:.3;
      const f=a.sig.charge*b.sig.charge*105*s/d2;
      a.vx-=ux*f; a.vy-=uy*f; b.vx+=ux*f; b.vy+=uy*f;
      const min=(a.r+b.r+9)*1.15;
      if(d<min){ const p=(min-d)*.05*s; a.vx-=ux*p; a.vy-=uy*p; b.vx+=ux*p; b.vy+=uy*p; }
    }
    for(const e of sim.edges){
      const a=sim.nMap.get(e.a), b=sim.nMap.get(e.b); if(!a||!b) continue;
      let par=a, ch=b;
      if(a.type!=='product'&&a.type!=='hub'){ par=b; ch=a; }
      const rest=restFrom(par,ch), len=Math.hypot(rest.x,rest.y)*(ch.focus?1:.72)+26;
      let dx=b.x-a.x, dy=b.y-a.y; const d=Math.hypot(dx,dy)||1;
      const strength=(e.kind==='own'?.9:e.kind==='gap'?.45:e.kind==='src'?.3:.18)*(ch.focus?1:.3);
      const f=(d-len)*.028*strength, ux=dx/d, uy=dy/d;
      a.vx+=ux*f; a.vy+=uy*f; b.vx-=ux*f; b.vy-=uy*f;
    }
    for(const n of N){
      if(n.drag){ n.vx*=.4; n.vy*=.4; continue; }
      if(n.anchor){ n.vx+=(n.anchor.x-n.x)*.06; n.vy+=(n.anchor.y-n.y)*.06; }
      else if(n.rest){ const par=sim.nMap.get(parentOf(n)); if(par){ const tx=par.x+n.rest.x*(n.focus?1:.7), ty=par.y+n.rest.y*(n.focus?1:.7); n.vx+=(tx-n.x)*.016; n.vy+=(ty-n.y)*.016; } }
      if(!n.focus){ const r=Math.hypot(n.x,n.y)||1; n.vx+=n.x/r*.06; n.vy+=n.y/r*.06; }
      n.vx*=.86; n.vy*=.86;
      n.vx=clamp(n.vx,-8,8); n.vy=clamp(n.vy,-8,8);
      n.x+=n.vx; n.y+=n.vy;
      n.scale=clamp(n.scale+(n.tScale-n.scale)*.08,.05,3); n.alpha=clamp(n.alpha+(n.tAlpha-n.alpha)*.1,0,1);
      if(n.birth<1) n.birth=Math.min(1,n.birth+.055);
    }
  }

  /* ---------- 相机与绘制 ---------- */
  function fitCam(){
    const sim=kg.sim;
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(const n of sim.nodes){ if(n.tAlpha<.8&&n.type!=='product') continue; const r=n.r*2.4+(n.tAlpha<.8?16:34);
      x0=Math.min(x0,n.x-r); y0=Math.min(y0,n.y-r); x1=Math.max(x1,n.x+r); y1=Math.max(y1,n.y+r); }
    if(x0>x1){ x0=y0=-200; x1=y1=200; }
    if(!isFinite(x0+x1+y0+y1)){ x0=y0=-200; x1=y1=200; }
    const z=clamp(Math.min((kg.W-70)/(x1-x0),(kg.H-118)/(y1-y0)),.3,1.35);
    kg.fit={x:-(x0+x1)/2*z,y:-(y0+y1)/2*z+6*z,z};
  }
  function setCam(){
    if(!userPan){ kg.cam.x+=(kg.fit.x-kg.cam.x)*.12; kg.cam.y+=(kg.fit.y-kg.cam.y)*.12; }
    kg.cam.z=clamp(kg.cam.z+(kg.fit.z*(kg.userZ||1)-kg.cam.z)*.1,.2,3);
  }
  function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function draw(){
    const cv=kg.cv, ctx=kg.ctx, W=kg.W, H=kg.H, dpr=kg.dpr, sim=kg.sim, HOV=kg.hov;
    const t=performance.now()/1000;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(!kg.bgGrad){ const g=ctx.createRadialGradient(W*.55,H*.42,20,W*.55,H*.42,Math.max(W,H)*.95);
      g.addColorStop(0,'#0E1E26'); g.addColorStop(.55,'#0A141A'); g.addColorStop(1,'#05090C'); kg.bgGrad=g; }
    ctx.fillStyle=kg.bgGrad; ctx.fillRect(0,0,W,H);
    if(!kg.stars){ kg.stars=[]; for(let i=0;i<80;i++) kg.stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.2+.3,a:Math.random()*.45+.12,p:Math.random()*TAU}); }
    for(const s of kg.stars){
      ctx.fillStyle=`rgba(140,220,210,${(s.a*(.6+.4*Math.sin(t*1.3+s.p))).toFixed(3)})`;
      const px=(((s.x*W+kg.cam.x*.12)%W)+W)%W, py=(((s.y*H+kg.cam.y*.12)%H)+H)%H;
      ctx.beginPath(); ctx.arc(px,py,s.r,0,TAU); ctx.fill();
    }
    ctx.save();
    ctx.translate(W/2+kg.cam.x,H/2+kg.cam.y); ctx.scale(kg.cam.z,kg.cam.z);
    // 星团光
    for(const n of sim.nodes){
      if(n.type!=='product'&&n.type!=='hub') continue;
      const a=n.alpha*(n.type==='product'?(n.focus?.14:0):.1);
      if(a<=0) continue;
      const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,150);
      g.addColorStop(0,rgba('#2DD4BF',a)); g.addColorStop(1,rgba('#2DD4BF',0));
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(n.x,n.y,150,0,TAU); ctx.fill();
    }
    // 悬停邻居
    const litSet=new Set();
    if(HOV){ for(const e of sim.edges){ if(e.a===HOV) litSet.add(e.b); else if(e.b===HOV) litSet.add(e.a); } }
    // 边
    for(const e of sim.edges){
      const a=sim.nMap.get(e.a), b=sim.nMap.get(e.b); if(!a||!b) continue;
      const hot=HOV&&(e.a===HOV||e.b===HOV);
      const col=e.color||(e.kind==='gap'?'#F5B14C':e.kind==='src'?'#7CC5FF':'#7FC8BD');
      const base=(e.kind==='src'?.55:e.kind==='ref'?.3:e.kind==='gap'?.5:.5)*(e.lit||.4);
      const alpha=clamp(HOV?(hot?1:.08):base,0,1);
      if(alpha<.02) continue;
      ctx.strokeStyle=rgba(col,alpha); ctx.lineWidth=(e.kind==='src'?1.2:.9)/kg.cam.z;
      if(e.kind==='gap') ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      ctx.setLineDash([]);
      if(!reduce()&&alpha>.12&&(e.kind==='src'||e.kind==='gap'||(e.kind==='own'&&(a.type==='product'||b.type==='product')))){
        const u=(t*.3+e.ph)%1, px=a.x+(b.x-a.x)*u, py=a.y+(b.y-a.y)*u;
        ctx.fillStyle=rgba(col,Math.min(1,alpha*1.6)); ctx.beginPath(); ctx.arc(px,py,1.7/kg.cam.z,0,TAU); ctx.fill();
      }
    }
    // 光晕
    for(const n of sim.nodes){
      const r=Math.max(.3,n.r*n.scale*(n.birth<1?Math.max(.05,n.birth):1)*(HOV===n.id?1.3:1));
      if(r<.4) continue;
      const dim=HOV&&HOV!==n.id&&!litSet.has(n.id)?.3:1;
      const a=n.alpha*(n.type==='product'?.9:.65)*dim;
      const col=n.type==='file'?(PAL.file[n.file.t]||'#8FA3AC'):((PAL[n.type]||PAL.entry).halo);
      let glowA=a*.42, glowR=r*4.4;
      if(n.type==='gap'){ const pump=.55+.45*Math.sin(t*2.2+n.r); glowA*=.55*pump; glowR=r*5; }
      const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,glowR);
      g.addColorStop(0,rgba(col,glowA)); g.addColorStop(.45,rgba(col,glowA*.35)); g.addColorStop(1,rgba(col,0));
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(n.x,n.y,glowR,0,TAU); ctx.fill();
    }
    // 本体
    for(const n of sim.nodes){
      const r=Math.max(.3,n.r*n.scale*(n.birth<1?Math.max(.05,n.birth):1));
      if(r<.4) continue;
      const dim=HOV&&HOV!==n.id&&!litSet.has(n.id)?.35:1;
      const a=clamp(n.alpha*dim,0,1);
      if(n.type==='product'){
        ctx.fillStyle=rgba('#0F2A2A',a); ctx.beginPath(); ctx.arc(n.x,n.y,r,0,TAU); ctx.fill();
        ctx.strokeStyle=rgba(PAL.product.line,a); ctx.lineWidth=2.2/kg.cam.z; ctx.stroke();
        ctx.fillStyle=rgba('#C8FFF4',a); ctx.beginPath(); ctx.arc(n.x,n.y,r*.36,0,TAU); ctx.fill();
        if(curId()===n.p.id){ ctx.strokeStyle=rgba('#FFFFFF',a*.7); ctx.lineWidth=1.1/kg.cam.z; ctx.beginPath(); ctx.arc(n.x,n.y,r+5+Math.sin(t*2)*1.5,0,TAU); ctx.stroke(); }
      } else if(n.type==='hub'){
        ctx.fillStyle=rgba('#0E2A28',a*.9); ctx.beginPath(); ctx.arc(n.x,n.y,Math.max(.4,r-1),0,TAU); ctx.fill();
        ctx.setLineDash([3,3]); ctx.strokeStyle=rgba('#9AD9CF',a*.8); ctx.lineWidth=1.3/kg.cam.z;
        ctx.beginPath(); ctx.arc(n.x,n.y,r,0,TAU); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle=rgba('#9AD9CF',a); ctx.beginPath(); ctx.arc(n.x,n.y,2.2,0,TAU); ctx.fill();
      } else if(n.type==='entry'){
        ctx.fillStyle=rgba(PAL.entry.core,a); ctx.beginPath(); ctx.arc(n.x,n.y,r,0,TAU); ctx.fill();
        ctx.strokeStyle=rgba(PAL.entry.line,a); ctx.lineWidth=1.3/kg.cam.z; ctx.stroke();
        if(n.k.safety){ ctx.strokeStyle=rgba('#F5B14C',a*.95); ctx.lineWidth=1.5/kg.cam.z; ctx.beginPath(); ctx.arc(n.x,n.y,r+3.5,0,TAU); ctx.stroke(); }
      } else if(n.type==='file'){
        const col=PAL.file[n.file.t]||'#8FA3AC';
        if(n.file.st==='解析中'){
          const k=(t*.8)%1; ctx.strokeStyle=rgba(col,a*(1-k)); ctx.lineWidth=1.2/kg.cam.z;
          ctx.beginPath(); ctx.arc(n.x,n.y,r*(1+k*1.6),0,TAU); ctx.stroke();
        }
        ctx.fillStyle=rgba('#08141A',a*.92); roundRect(ctx,n.x-r,n.y-r,r*2,r*2,Math.max(1.5,r*.45)); ctx.fill();
        ctx.strokeStyle=rgba(col,a); ctx.lineWidth=1.5/kg.cam.z;
        if(n.file.st==='待确认') ctx.setLineDash([2.5,2.5]);
        roundRect(ctx,n.x-r,n.y-r,r*2,r*2,Math.max(1.5,r*.45)); ctx.stroke(); ctx.setLineDash([]);
      } else if(n.type==='part'){
        ctx.fillStyle=rgba(PAL.part.core,a*.9);
        ctx.beginPath(); ctx.moveTo(n.x,n.y-r*1.15); ctx.lineTo(n.x+r*1.15,n.y); ctx.lineTo(n.x,n.y+r*1.15); ctx.lineTo(n.x-r*1.15,n.y); ctx.closePath(); ctx.fill();
        ctx.strokeStyle=rgba(PAL.part.line,a); ctx.lineWidth=1.2/kg.cam.z; ctx.stroke();
      } else if(n.type==='gap'){
        ctx.strokeStyle=rgba('#F5B14C',a); ctx.lineWidth=1.4/kg.cam.z; ctx.setLineDash([2.5,2.5]);
        ctx.beginPath(); ctx.arc(n.x,n.y,r,0,TAU); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle=rgba('#F5B14C',a); ctx.font=`700 ${r*1.1}px ${FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('!',n.x,n.y+r*.04);
      } else {
        ctx.fillStyle=rgba(PAL.term.line,a*.85); ctx.beginPath(); ctx.arc(n.x,n.y,r,0,TAU); ctx.fill();
      }
    }
    // 标签
    ctx.textAlign='center'; ctx.textBaseline='top';
    for(const n of sim.nodes){
      const r=Math.max(.3,n.r*n.scale*(n.birth<1?Math.max(.05,n.birth):1));
      if(r<.4||n.alpha<.22) continue;
      const hot=HOV===n.id||litSet.has(n.id);
      const show=hot||n.type==='product'||n.type==='entry'||n.type==='gap'||(curId()!=='all'&&n.focus)||kg.cam.z>1.15;
      if(!show) continue;
      const fs=(n.type==='product'?11.5:n.type==='entry'?10.5:9.5)/kg.cam.z;
      if(fs<6.5) continue;
      const a=clamp(n.alpha*(hot?1:n.type==='product'?1:.78),0,1);
      const above=n.type==='file'||n.type==='term';
      ctx.textBaseline=above?'bottom':'top';
      const y=above?n.y-r-3/kg.cam.z:n.y+r+4/kg.cam.z;
      ctx.font=`${n.type==='product'?600:400} ${fs}px ${FONT}`;
      ctx.lineWidth=3.2/kg.cam.z; ctx.strokeStyle=`rgba(5,10,13,${(.85*a).toFixed(3)})`; ctx.strokeText(n.label,n.x,y);
      ctx.fillStyle=n.type==='product'?`rgba(220,255,250,${a})`:n.type==='gap'?`rgba(245,177,76,${a})`:`rgba(199,224,221,${a})`;
      ctx.fillText(n.label,n.x,y);
    }
    ctx.restore();
  }

  /* ---------- 循环 ---------- */
  function raf(){
    if(!kg||!kg.cv||!kg.cv.isConnected||page!=='kb'){ if(kg) cancelAnimationFrame(kg.raf); kg=null; return; }
    if(kg.settle<2){ tick(); tick(); kg.settle++; if(kg.settle===2){ fitCam(); kg.cam={x:kg.fit.x,y:kg.fit.y,z:kg.fit.z}; } }
    else {
      let energy=0, moving=0;
      for(const n of kg.sim.nodes){ energy+=Math.abs(n.vx)+Math.abs(n.vy); if(n.birth<1||Math.abs(n.scale-n.tScale)>.01||Math.abs(n.alpha-n.tAlpha)>.01) moving++; }
      const active=energy>.5||moving>0||kg.hov||kg.drag||kg.pan||performance.now()<kg.animUntil;
      if(active) tick();
      if(!userPan||kg.resizing){ kg.resizing=false; fitCam(); }
    }
    setCam(); draw();
    kg.raf=requestAnimationFrame(raf);
  }

  /* ---------- 交互 ---------- */
  function bind(){
    const stage=document.getElementById('kg_stage'), cv=kg.cv, tip=document.getElementById('kg_tip');
    const toWorld=(cx,cy)=>{ const r=stage.getBoundingClientRect(); return {x:(cx-r.left-kg.W/2-kg.cam.x)/kg.cam.z,y:(cy-r.top-kg.H/2-kg.cam.y)/kg.cam.z}; };
    const hit=p=>{ let best=null,bd=1e9; for(const n of kg.sim.nodes){ if(n.alpha<.2) continue; const d=Math.hypot(n.x-p.x,n.y-p.y), rr=n.r*(n.scale*n.birth)+11/kg.cam.z; if(d<rr&&d<bd){ best=n; bd=d; } } return best; };
    const showTip=(n,ev)=>{ if(!n){ tip.classList.remove('show'); return; }
      tip.innerHTML=nodeTip(n); tip.classList.add('show');
      const r=stage.getBoundingClientRect(); let x=ev.clientX-r.left+16, y=ev.clientY-r.top+14;
      if(x+tip.offsetWidth>r.width-8) x=ev.clientX-r.left-tip.offsetWidth-16;
      if(y+tip.offsetHeight>r.height-8) y=r.height-tip.offsetHeight-10;
      tip.style.transform=`translate(${Math.max(8,x)}px,${Math.max(8,y)}px)`; };
    kg.down=null; kg.drag=null; kg.pan=null; kg.hov=null; kg.hovNode=null;
    cv.onpointerdown=ev=>{ if(cv.setPointerCapture){ try{ cv.setPointerCapture(ev.pointerId); }catch(e){} } const p=toWorld(ev.clientX,ev.clientY), n=hit(p);
      kg.down={x:ev.clientX,y:ev.clientY,moved:0};
      if(n){ kg.drag=n; n.drag=true; } else kg.pan={x:kg.cam.x,y:kg.cam.y};
      kg.animUntil=performance.now()+2500; };
    cv.onpointermove=ev=>{ const p=toWorld(ev.clientX,ev.clientY);
      if(kg.down) kg.down.moved=Math.max(kg.down.moved,Math.hypot(ev.clientX-kg.down.x,ev.clientY-kg.down.y));
      if(kg.drag&&kg.down&&kg.down.moved>=4){ kg.drag.x=p.x; kg.drag.y=p.y; kg.drag.vx=kg.drag.vy=0; }
      else if(kg.pan&&kg.down){ kg.cam.x=kg.pan.x+(ev.clientX-kg.down.x); kg.cam.y=kg.pan.y+(ev.clientY-kg.down.y); userPan=true; }
      const n=hit(p);
      if(kg.hov!==(n?n.id:null)){ kg.hov=n?n.id:null; kg.animUntil=performance.now()+2500; }
      kg.hovNode=n; cv.style.cursor=n?'pointer':(kg.pan&&kg.down?'grabbing':'grab');
      showTip(n,ev); };
    cv.onpointerup=ev=>{ const click=kg.down&&kg.down.moved<5, n=kg.drag;
      if(kg.drag){ kg.drag.drag=false; }
      kg.drag=null; kg.pan=null; kg.down=null;
      if(click&&n) clickNode(n);
      kg.animUntil=performance.now()+2500; };
    cv.onpointercancel=()=>{ if(kg.drag) kg.drag.drag=false; kg.drag=null; kg.pan=null; kg.down=null; };
    cv.onpointerleave=()=>{ kg.hov=null; kg.hovNode=null; tip.classList.remove('show'); kg.animUntil=performance.now()+2500; };
    cv.ondblclick=()=>{ kg.userZ=1; userPan=false; kg.cam.x=0; kg.cam.y=0; kg.resizing=true; };
    cv.addEventListener('wheel',ev=>{ if(!(ev.ctrlKey||ev.metaKey)) return; ev.preventDefault();
      const r=stage.getBoundingClientRect(), mx=ev.clientX-r.left-r.width/2, my=ev.clientY-r.top-r.height/2;
      const z0=kg.cam.z, z1=clamp(z0*(ev.deltaY<0?1.12:.9),.25,2.6);
      kg.cam.x=mx-(mx-kg.cam.x)*(z1/z0); kg.cam.y=my-(my-kg.cam.y)*(z1/z0);

function cancelManual(id){ state.manuals=state.manuals.filter(m=>m.id!==id); save(); render(); }
function tickManuals(){ let changed=false; for(const m of state.manuals) if(m.status==='generating'){ m.progress=Math.min(100,m.progress+2+Math.floor(Math.random()*4)); changed=true; if(m.progress>=100){ m.status='review'; m.checks=manualChecks(m); m.doneAt=Date.now(); ensureManualWorkspace(m); pushManualAudit(m,'generated','AI 重新生成完成',`版本 v${m.version} 已生成，进入品牌审核`,'AI',m.langs.join('/')); toast(`${m.id} 生成完成，等待审核`); } } if(changed){ save(); if(page==='manuals'&&manualView==='list') refreshManualList(); else renderNav(); } }

function ensureManualWorkspace(m){
  if(!m) return null;
  m.version=m.version||1;
  m.audit=Array.isArray(m.audit)?m.audit:[];
  m.versions=Array.isArray(m.versions)?m.versions:[];
  m.reviewByLang=m.reviewByLang||{};
  for(const lang of m.langs){
    const r=m.reviewByLang[lang]||(m.reviewByLang[lang]={});
    r.status=m.status==='delivered'?'approved':(r.status||'pending');
    r.edits=r.edits||{};
    r.issueStates=r.issueStates||{};
    r.viewed=r.viewed||{};
    r.dirty=!!r.dirty;
    r.approvedAt=r.approvedAt||null;
    r.approvedBy=r.approvedBy||null;
  }
  if(!m.audit.length){
    m.audit.push({id:uid(),type:'generated',title:'AI 生成完成',detail:`${m.langs.join('、')} 版本已生成，进入品牌审核`,actor:'AI',at:m.doneAt||m.createdAt});
    if(m.status==='delivered') m.audit.push({id:uid(),type:'delivered',title:'已交付工厂',detail:`版本 v${m.version} 已冻结并写入知识库`,actor:'杨梦',at:m.doneAt||Date.now()});
  }
  return m;
}

function openFixWeightModal(id){ const m=state.manuals.find(x=>x.id===id); if(!m) return; const p=state.products.find(x=>x.id===m.product); openModal(`<div class="drawer-h"><h3>补充最大用户体重</h3><div class="sp" style="flex:1"></div><button class="x" onclick="closeAll()">×</button></div><div class="drawer-b"><p class="muted small" style="margin-top:0">该字段属于产品档案，保存后会同步影响 ${p.id} 的所有说明书合规检查。</p><div class="field"><label>最大用户体重（kg）</label><input class="input" id="manualWeightFix" type="number" value="${p.maxUserWeight||''}" placeholder="150"></div><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeAll()">取消</button><button class="btn primary" onclick="submitManualWeightFix('${id}')">写入并重新检查</button></div></div>`); }

function approveManualLanguage(id){ const m=state.manuals.find(x=>x.id===id); if(!m||role!=='brand'||m.status!=='review') return; const issues=buildReviewIssues(m,reviewLang,manualDocChapters(m,reviewLang)); const st=manualIssueStats(issues); if(st.openBlockers||st.openWarnings){toast('请先处理所有阻断项和警告');return;} const r=manualReviewState(m,reviewLang); r.status='approved'; r.approvedAt=Date.now(); r.approvedBy=ROLE[role].person; r.dirty=false; pushManualAudit(m,'approved','批准语种',`${manualLangName(reviewLang)} 版已完成签署`,'品牌方售后',reviewLang); save(); render(); const ready=m.langs.every(l=>manualReviewState(m,l).status==='approved'); toast(ready?'所有语种已批准，可以交付工厂':`${manualLangName(reviewLang)} 已批准，其他语种仍待审核`); }

function openReturnManual(id){ const m=state.manuals.find(x=>x.id===id); if(!m||role!=='brand'||m.status!=='review') return; openModal(`<div class="drawer-h"><h3>退回 AI 重新生成</h3><div class="sp" style="flex:1"></div><button class="x" onclick="closeAll()">×</button></div><div class="drawer-b"><p class="muted small" style="margin-top:0">当前审核稿和问题处理记录会作为历史版本保留，新版本生成完成后重新进入审核。</p><div class="field"><label>退回原因（必填）</label><textarea class="input" id="manualReturnReason" placeholder="说明需要重新生成的范围或原因"></textarea></div><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeAll()">取消</button><button class="btn primary" onclick="submitReturnManual('${id}')">确认退回</button></div></div>`); }
function submitReturnManual(id){ const reason=$('#manualReturnReason').value.trim(); if(!reason){toast('请填写退回原因');return;} const m=state.manuals.find(x=>x.id===id); if(!m) return; m.versions.push({version:m.version,archivedAt:Date.now(),reason,review:JSON.parse(JSON.stringify(m.reviewByLang||{}))}); pushManualAudit(m,'return','退回重新生成',`版本 v${m.version} 已归档`,'品牌方售后',m.langs.join('/'),reason); m.version++; m.status='generating'; m.progress=18; m.checks=null; for(const l of m.langs){const r=manualReviewState(m,l);r.status='pending';r.edits={};r.issueStates={};r.viewed={};r.dirty=false;r.approvedAt=null;r.approvedBy=null;} closeAll(); save(); manualView='list'; render(); toast(`${m.id} 已退回，正在生成 v${m.version}`); }

:partnersTable()}
</div>
${sel&&orderTab==='orders'?orderDetail(sel):''}`; };
function orderDetail(o){ const ms=orderMembers(o); const tl=state.tickets.filter(t=>t.order===o.id).flatMap(t=>t.timeline.map(e=>({...e,tid:t.id}))).sort((a,b)=>b.t-a.t).slice(0,8); const pending=ms.filter(m=>m.status==='pending'); return `

${(o.excluded||[]).length?`<div class="muted small" style="margin-top:8px">已在此订单移除：${o.excluded.map(e=>`${esc(e)} <a onclick="restoreToOrder('${o.id}','${esc(e)}')">恢复</a>`).join('、')}</div>`:''}
<div class="muted small" style="margin-top:10px">工厂接口人是客诉二级升级的接收人；工厂看到的工单会隐藏客户身份，回复经品牌方放行后由 AI 翻译发给客户。</div></div></div>

<div class="card-b">${tl.length?`<ul class="tl">${tl.map(e=>`<li class="${e.who}"><div class="t">${fmt(e.t)}</div><div><div class="who">${WHO[e.who]} <a class="small num" onclick="openTicket('${e.tid}')">${e.tid}</a></div><div class="msg">${esc(maskText(e).length>160?maskText(e).slice(0,160)+'…':maskText(e))}</div></div></li>`).join('')}</ul>`:'<div class="empty"><b>这张订单还没有客诉</b>终端用户扫码或发邮件后会出现在这里</div>'}</div></div>
</div>`; }
function partnersTable(){ return `<div class="card-b" style="padding-bottom:0"><div class="row" style="justify-content:space-between"><span class="muted small">组织级联系人默认接收该组织全部订单的协作；"默认覆盖"关掉后只对被单独邀请的订单生效。</span><button class="btn sm" onclick="openNewPartner()">新增合作方</button></div></div>
<table class="tb" style="margin-top:12px"><tr><th>合作方</th><th>类型</th><th>联系人</th><th>默认覆盖全部订单</th><th>覆盖订单</th><th>状态</th><th></th></tr>
${state.partners.flatMap(p=>{ const orders=state.orders.filter(o=>o.factory===p.name||o.dealer===p.name); if(!p.contacts.length) return [`<tr><td style="font-weight:600">${esc(p.name)}</td><td>${p.type==='factory'?'工厂':'分销商'}</td><td class="muted" colspan="3">还没有联系人 · 涉及 ${orders.length} 张订单${p.type==='factory'&&orders.length?'，<span style="color:var(--red)">客诉无法升级</span>':''}</td><td></td><td><button class="btn sm primary" onclick="openInvite(null,'${esc(p.name)}')">邀请联系人</button></td></tr>`]; return p.contacts.map((c,i)=>`<tr>${i===0?`<td style="font-weight:600" rowspan="${p.contacts.length}">${esc(p.name)}</td><td rowspan="${p.contacts.length}">${p.type==='factory'?'工厂':'分销商'}</td>`:''}<td>${esc(c.name)}<div class="sub">${esc(c.email)}${c.title?' · '+esc(c.title):''}</div></td><td><button class="switch ${c.defaultAll?'on':''}" onclick="toggleDefault('${esc(p.name)}','${esc(c.email)}')"></button></td><td class="num muted small">${c.defaultAll?orders.filter(o=>!(o.excluded||[]).includes(c.email)).map(o=>o.id).join('、')||'—':state.orders.filter(o=>(o.overrides||[]).some(m=>m.email===c.email)).map(o=>o.id).join('、')||'—'}</td><td>${c.status==='active'?'<span class="tag green">已激活</span>':'<span class="tag amber">待接受</span>'}</td><td><div class="row" style="gap:4px">${c.status==='pending'?`<button class="btn sm ghost" onclick="acceptOne('${esc(c.email)}')">模拟接受</button>`:''}<button class="btn sm ghost danger" onclick="revokeContact('${esc(p.name)}','${esc(c.email)}')">撤销</button></div></td></tr>`); }).join('')}</table>`; }
function toggleDefault(org,email){ const c=partnerOf(org).contacts.find(x=>x.email===email); c.defaultAll=!c.defaultAll; let n=0; if(!c.defaultAll){ const lost=state.orders.filter(o=>(o.factory===org||o.dealer===org)&&!(o.overrides||[]).some(m=>m.email===email)).map(o=>o.id); n=recallFrom(email,lost,`${c.name} 不再默认覆盖 ${org} 的订单`); } save(); render(); if(n) toast(`${c.name} 名下 ${n} 张工单已退回品牌方`); }
function revokeContact(org,email){ const p=partnerOf(org); if(!confirm(`撤销 ${email} 的全部协作权限？`)) return; p.contacts=p.contacts.filter(x=>x.email!==email); for(const o of state.orders){ o.overrides=(o.overrides||[]).filter(m=>m.email!==email); } const n=recallFrom(email,null,`工厂接口人 ${email} 已被撤销`); save(); render(); toast(n?`已撤销，${n} 张工单退回品牌方`:'已撤销'); }
function excludeFromOrder(oid,email){ const o=state.orders.find(x=>x.id===oid); o.excluded=(o.excluded||[]).concat(email); const n=recallFrom(email,[oid],`接口人已从订单 ${oid} 移除`); save(); render(); if(n) toast(`${n} 张工单已退回品牌方`); }
function restoreToOrder(oid,email){ const o=state.orders.find(x=>x.id===oid); o.excluded=(o.excluded||[]).filter(e=>e!==email); save(); render(); }
function revokeOverride(oid,email){ const o=state.orders.find(x=>x.id===oid); o.overrides=(o.overrides||[]).filter(m=>m.email!==email); const stillHas=orderMembers(o).some(m=>m.email===email); const n=stillHas?0:recallFrom(email,[oid],`订单级邀请已撤销`); save(); render(); if(n) toast(`${n} 张工单已退回品牌方`); }
function acceptOne(email){ let n=0; for(const p of state.partners) for(const c of p.contacts) if(c.email===email&&c.status==='pending'){ c.status='active'; n++; } for(const o of state.orders) for(const m of (o.overrides||[])) if(m.email===email&&m.status==='pending'){ m.status='active'; n++; } for(const t of state.tickets){ if(t.assignee&&t.assignee.email===email&&t.assignee.status==='pending'){ t.assignee.status='active'; if(t.status==='factory') t.statusSince=Date.now(); addEntry(t,'sys',`${t.assignee.name} 已接受邀请，现在可以查看并回复此工单；二级时限（${Policy.slaHours('l2')} 小时）从现在起算。`); } for(const c of (t.collab||[])) if(c.email===email&&c.status==='pending'){ c.status='active'; addEntry(t,'sys',`${c.name} 已接受邀请，加入此工单协作。`); } } save(); render(); toast(n?`${email} 已接受邀请`:'已更新'); }
function acceptInvite(oid){ const o=state.orders.find(x=>x.id===oid); for(const m of orderMembers(o)) if(m.status==='pending') acceptOne(m.email); }

  if(p){ document.querySelector(`input[name=iv_type][value=${p.type}]`).checked=true; } invOrgChanged(); }
function invOrgChanged(){ const v=$('#iv_org').value; $('#iv_org_new').style.display=v==='__new'?'block':'none'; const p=v!=='__new'?partnerOf(v):null; if(p) document.querySelector(`input[name=iv_type][value=${p.type}]`).checked=true; const sel=$('#iv_contact'); const hist=p?p.contacts:[]; sel.innerHTML=hist.map(c=>`<option value="${esc(c.email)}">${esc(c.name)} · ${esc(c.email)}${c.status==='pending'?'（待接受）':''}</option>`).join('')+`<option value="__new" ${hist.length?'':'selected'}>新联系人…</option>`; invContactChanged(); }

function sendInvite(ticketId){ let org=$('#iv_org').value; if(org==='__new'){ org=$('#iv_org_new').value.trim(); if(!org){ toast('请输入组织名称'); return; } } const type=document.querySelector('input[name=iv_type]:checked').value; let p=partnerOf(org); if(!p){ p={name:org,type,contacts:[]}; state.partners.push(p); }
  let name,mail,title; if($('#iv_contact').value==='__new'){ name=$('#iv_name').value.trim(); mail=$('#iv_mail').value.trim(); title=$('#iv_title').value.trim(); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){ toast('请输入有效邮箱'); return; } if(!name){ toast('请输入姓名'); return; } } else { const c=p.contacts.find(x=>x.email===$('#iv_contact').value); name=c.name; mail=c.email; title=c.title; }
  const scope=document.querySelector('input[name=iv_scope]:checked').value; const perm={reply:$('#iv_reply').classList.contains('on'),invite:$('#iv_invite').classList.contains('on')}; const role_=p.type==='factory'?'f':'d';
  let existing=p.contacts.find(x=>x.email===mail);
  if(scope==='org'){ if(existing){ existing.defaultAll=true; if(existing.status!=='active') existing.status='pending'; } else { existing={name,email:mail,title,status:'pending',defaultAll:true,since:Date.now(),perm}; p.contacts.push(existing); } }
  else { const o=state.orders.find(x=>x.id===$('#iv_order').value); if(!existing){ existing={name,email:mail,title,status:'pending',defaultAll:false,since:Date.now(),perm}; p.contacts.push(existing); } if(!(o.overrides||[]).some(m=>m.email===mail)) o.overrides=(o.overrides||[]).concat({role:role_,name,email:mail,org:p.name,title,status:existing.status,perm,at:Date.now()}); o.excluded=(o.excluded||[]).filter(e=>e!==mail); orderSel=o.id; }
  save(); closeAll();
  if(ticketId){ const t=tById(ticketId); setStatus(t,'factory'); t.assignee={name,email:mail,org:p.name,status:existing.status}; t.suggest=null; addEntry(t,'sys',`已邀请 ${name}（${p.name}）接手此工单，邀请邮件附带工单链接；对方接受前工单处于"已升级工厂 · 等待接受"状态（二级，${Policy.slaHours('l2')} 小时从接受起算）。`); openTicket(ticketId); }
  render(); toast(existing.status==='active'?`${name} 已是激活联系人，范围已更新`:`邀请已通过邮件发给 ${mail}（${scope==='org'?p.name+' 全部订单':'仅 '+$('#iv_order').value}）`); }

function importOrders(files){ const f=files&&files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ const lines=String(r.result).split(/\r?\n/).map(l=>l.trim()).filter(Boolean); let n=0; const bad=[]; for(const line of lines){ const c=line.split(/[,\t]/).map(x=>x.trim().replace(/^"|"$/g,'')); if(!/^PO-/i.test(c[0])) continue; const [id,prod,qty,batch,fac,dealer,ship,city]=c; const b=buildOrder({id,product:prod,qty,batch,factory:fac,dealer,ship,city,source:'CSV 导入'}); if(!b.ok){ bad.push(`${id}：${b.error}`); continue; } addOrder(b.order); n++; } save(); render(); const miss=ordersWithoutFactory().length; toast(`导入 ${n} 张订单${bad.length?`，跳过 ${bad.length} 条`:''}${miss?`；${miss} 张缺少工厂接口人`:''}`); if(bad.length) openModal(`<div class="drawer-h"><h3>CSV 导入结果</h3><div class="sp" style="flex:1"></div><button class="x" onclick="closeAll()">×</button></div><div class="drawer-b"><p class="small">导入 ${n} 张；以下 ${bad.length} 条未导入：</p><ul class="small" style="padding-left:18px">${bad.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="muted small">列顺序：订单号, 型号, 数量, 批次, 工厂, 分销商, 发货日期(YYYY-MM-DD), 城市。保修期按发货日 + 2 年计算。</p></div>`); }; r.readAsText(f); }

function dailyChart(all){ const days=Math.min(anWin,60); const now=new Date(); now.setHours(0,0,0,0); const buckets=Array.from({length:days},()=>({ai:0,brand:0,factory:0,other:0})); for(const t of all){ const i=days-1-Math.floor((now.getTime()+DAY-t.createdAt)/DAY); if(i<0||i>=days) continue; const k=t.status!=='done'?'other':t.resolvedBy==='ai'?'ai':t.resolvedBy==='brand'?'brand':t.resolvedBy==='factory'?'factory':'other'; buckets[i][k]++; } const W=520,H=180,bw=Math.max(2,W/days-3); const maxv=Math.max(3,...buckets.map(b=>b.ai+b.brand+b.factory+b.other)); const unit=(H-20)/maxv; let s=''; buckets.forEach((b,i)=>{ const x=i*(W/days)+1; let y=H-16; for(const [k,c] of [['ai','#0E7A6C'],['brand','#B7600A'],['factory','#5A4FCF'],['other','#CBD2DA']]){ const h=b[k]*unit; if(!h) continue; y-=h; s+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${c}"><title>${b[k]}</title></rect>`; } }); const d0=new Date(now.getTime()-(days-1)*DAY); return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${s}<text x="0" y="${H-2}" font-size="10" fill="#9AA3AE">${pad(d0.getMonth()+1)}-${pad(d0.getDate())}</text><text x="${W-30}" y="${H-2}" font-size="10" fill="#9AA3AE">${pad(now.getMonth()+1)}-${pad(now.getDate())}</text></svg>`; }

function weeklyReport(){ const since=Date.now()-7*DAY; const all=visibleTickets().filter(t=>t.createdAt>since); const done=all.filter(t=>t.status==='done'); const ai=done.filter(t=>t.resolvedBy==='ai').length; const faults={}; for(const t of all) if(t.kbId) faults[t.kbId]=(faults[t.kbId]||0)+1; const fl=Object.entries(faults).sort((a,b)=>b[1]-a[1]).slice(0,3); const open=all.filter(t=>t.status!=='done'); const txt=`IronPeak 售后周报（${new Date(since).toLocaleDateString()} – ${new Date().toLocaleDateString()}）\n\n本周新客诉 ${all.length} 条，已结案 ${done.length} 条，其中 AI 自行解决 ${ai} 条（${done.length?Math.round(ai/done.length*100):0}%）。进行中 ${open.length} 条，超时 ${open.filter(isLate).length} 条。\n\n高频故障：\n${fl.map(([k,v],i)=>`${i+1}. ${Engine.KB.find(x=>x.id===k).cat.zh} — ${v} 起`).join('\n')||'无'}\n\n待决定：\n${decisions().map(d=>`- ${d.title}：${d.sub}`).join('\n')||'无'}\n\n（由售后智能体生成）`; download(`售后周报_${new Date().toISOString().slice(0,10)}.txt`,txt); state.notes.push({t:Date.now(),text:'周报已生成并发送到 '+(state.settings.mailboxes[0]?.addr||'售后邮箱')}); save(); toast('周报已生成并下载，同时发送到售后邮箱'); }

function hardRuleWordsPanel(){
  const since=Date.now()-30*DAY; const all=state.tickets.filter(t=>t.createdAt>since);
  const ruleMeta={ safety:['安全件','safety'], refund:['退换货 / 赔偿','refund'], negative:['负面情绪 / 公开渠道','negative'], b2b:['企业邮箱判定（免费邮箱白名单）','b2b'] };
  const samples=(key)=>all.filter(t=>t.reasons.includes(key)).slice(-3).map(t=>{
    const r=(t.reasons||[]); const words=[];
    const txt=(t.timeline.find(e=>e.who==='cust')||{}).text||t.issue||'';
    if(typeof Policy!=='undefined'&&Policy.hitWords) words.push(...Policy.hitWords(key==='b2b'?'b2b':key,txt));
    return {id:t.id,issue:t.issue||'',words:[...new Set(words)].slice(0,6)};
  });
  const chip=(rule,kind,w,locked)=>`<span class="wchip${locked?' locked':' editable'}" title="${locked?'锁定词：删改需双签':'点击删除'}" ${locked?'':`onclick="policyRemoveWord('${rule}','${kind}','${escAttr(w)}')"`}>${esc(w)}${locked?'<i class="wl">🔒</i>':'<i class="wx">×</i>'}</span>`;
  const escAttr=(s)=>String(s).replace(/'/g,'\\\'');
  const oneRule=(key,label)=>{
    const hits=all.filter(t=>t.reasons.includes(key)); const ss=samples(key);
    const off = Policy.get('hardRules.'+key)===false;
    const top={}; for(const t of hits){ for(const w of (Policy.hitWords?Policy.hitWords(key==='b2b'?'b2b':key,t.issue||''):[])) top[w]=(top[w]||0)+1; }
    const topWords=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([w,n])=>`<span class="tag grey">${esc(w)} ${n}</span>`).join(' ');
    return `<div class="card" style="border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px">
      <div class="wrow"><b>${label}</b>${off?'<span class="tag grey">规则当前关闭</span>':''}<span class="tag ${hits.length&&!off?'amber':'grey'}">近 30 天触发 ${hits.length} 次</span></div>
      ${topWords?`<div class="wline"><span class="muted small">命中最多</span><span class="wchips">${topWords}</span></div>`:''}
      ${ss.length?`<div class="wsample"><div class="muted small">样例句</div>${ss.map(x=>`<div class="wsample-i"><span class="wsample-t">「${esc((x.issue||'').slice(0,70))}」</span>${x.words.length?`<span class="tag grey">${x.words.slice(0,4).join(' · ')}</span>`:''}</div>`).join('')}</div>`:'<div class="muted small" style="margin-top:6px">近 30 天没有触发。</div>'}
      <div class="wblock">${wordChips(key)}</div>
      <div class="wadd"><input class="input" id="w_${key}" placeholder="新增一个词，回车添加" onkeydown="if(event.key==='Enter')policyAddWord('${key}')"><button class="btn sm" onclick="policyAddWord('${key}')">添加</button></div>
    </div>`;
  };
  const wordChips=(key)=>{
    if(key==='safety'){
      const w=Policy.words('safety');
      return `<div class="wgroup"><div class="wlabel">伤害描述 <span class="tag grey">锁定 · 删改需双签</span></div><div class="wchips">${w.locked.map(x=>chip('safety','injury',x,true)).join('')}</div></div>
              <div class="wgroup"><div class="wlabel">安全部件名 <span class="tag grey">随产品线增删</span></div><div class="wchips">${w.editable.map(x=>chip('safety','parts',x,false)).join('')||'<span class="muted small">（空）</span>'}</div></div>`;
    }
    const w=Policy.words(key).all;
    return `<div class="wchips">${w.map(x=>chip(key,'',x,false)).join('')||'<span class="muted small">（空）</span>'}</div>`;
  };
  return Object.entries(ruleMeta).map(([k,lab])=>oneRule(k,lab[0])).join('');
}

function policyRow(path,extra){
