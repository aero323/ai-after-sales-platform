<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>IronPeak Support · 扫码售后 H5 原型 v2</title>
<style>
:root{
  color-scheme: light;
  --brand:#0E7A6C; --brand-ink:#0B5F54; --brand-soft:#E3F3EF;
  --ink:#171C22; --muted:#6B7682; --faint:#9AA3AE; --line:#E4E8ED; --bg:#F6F7F9; --panel:#fff;
  --amber:#B7600A; --amber-soft:#FBEEDC; --green:#2F7D32;
  font-family:-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue","Segoe UI",Roboto,"Noto Sans SC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#DDE2E8;color:var(--ink);font-size:15px;line-height:1.5;min-height:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* desktop stage with phone frame */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:48px;padding:32px 16px;flex-wrap:wrap}
.phone{width:390px;height:844px;background:#000;border-radius:48px;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.35);position:relative;flex:none}
.screen{width:100%;height:100%;background:var(--bg);border-radius:38px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:32px;background:#000;border-radius:0 0 18px 18px;z-index:5}
.caption{max-width:300px;color:#3A4552;font-size:14px;line-height:1.6}
.caption h2{margin:0 0 8px;font-size:18px;font-weight:600}
.caption p{margin:0 0 10px}
.caption .flow{margin:0;padding-left:18px}
.caption .flow li{margin:3px 0}
.caption .flow li.on{font-weight:600;color:var(--brand-ink)}
.langtoggle{display:inline-flex;border:1px solid #B8C0CA;border-radius:8px;overflow:hidden;margin-bottom:16px}
.langtoggle button{border:0;background:#fff;padding:6px 14px;font-size:13px;color:#3A4552}
.langtoggle button.on{background:var(--brand);color:#fff}
@media (max-width:480px){.stage{padding:0}.phone{width:100%;height:100vh;border-radius:0;padding:0;box-shadow:none}.screen{border-radius:0}.notch,.caption{display:none}}

/* in-screen */
.statusbar{height:44px;flex:none}
.topbar{display:flex;align-items:center;gap:10px;padding:6px 18px 10px;flex:none}
.topbar .logo{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.topbar b{font-weight:600;font-size:15px}
.topbar .sp{flex:1}
.topbar .lang{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:3px 10px;background:#fff;cursor:pointer}
.topbar .reset{width:28px;height:28px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--muted);display:grid;place-items:center;flex:none;padding:0;transition:background .15s,color .15s,transform .15s}
.topbar .reset:hover{background:var(--brand-soft);color:var(--brand-ink)}
.topbar .reset:active{transform:rotate(-24deg)}
.back{border:0;background:none;padding:4px;margin-left:-6px;color:var(--ink);display:none}
.back.show{display:block}
.prog{height:3px;background:var(--line);margin:0 18px 0;border-radius:2px;overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
.stepnote{font-size:12px;color:var(--faint);padding:6px 18px 0;flex:none;min-height:24px}
.view{flex:1;overflow:auto;padding:20px 18px 24px;display:none;flex-direction:column}
.view.show{display:flex}
h1{font-size:24px;font-weight:600;line-height:1.25;margin:10px 0 8px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 18px}
.btn{width:100%;border:0;border-radius:12px;padding:15px 16px;font-size:16px;font-weight:600;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{background:var(--brand-ink)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.link{background:none;color:var(--brand);font-weight:500;padding:10px}
.btn + .btn{margin-top:10px}
.spacer{flex:1}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.card + .card{margin-top:10px}
.prod{display:flex;gap:14px;align-items:center}
.prod .img{width:64px;height:64px;border-radius:10px;background:linear-gradient(135deg,#E8ECF0,#CBD2DA);flex:none;display:grid;place-items:center}
.prod b{display:block;font-size:16px}
.prod span{color:var(--muted);font-size:13px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;width:100%}
.opt:active,.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt .n{font-weight:600}
.opt .s{color:var(--muted);font-size:13px;margin-left:auto}
.opt .flag{width:28px;height:20px;border-radius:3px;flex:none;background:#CBD2DA}
.finder{position:relative;background:#1B2129;border-radius:16px;aspect-ratio:3/4;display:grid;place-items:center;overflow:hidden}
.finder .frame{position:absolute;inset:36px 28px;border:2px solid rgba(255,255,255,.75);border-radius:10px}
.finder .frame::before,.finder .frame::after{content:"";position:absolute;width:26px;height:26px;border:3px solid #fff}
.finder .frame::before{top:-3px;left:-3px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.finder .frame::after{bottom:-3px;right:-3px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.finder .label{width:200px;background:#F3F5F7;border-radius:4px;padding:10px 12px;font-size:10px;color:#333;line-height:1.5;transform:rotate(-3deg);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.finder .label b{display:block;font-size:12px}
.finder .label .bars{height:18px;margin:6px 0 3px;background:repeating-linear-gradient(90deg,#222 0 2px,transparent 2px 4px,#222 4px 5px,transparent 5px 8px)}
.finder .hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#fff;font-size:13px;opacity:.9}
.finder .scanning{position:absolute;left:28px;right:28px;height:2px;background:var(--brand);box-shadow:0 0 12px var(--brand);top:36px;animation:scan 1.4s linear infinite;display:none}
.finder.busy .scanning{display:block}
@keyframes scan{0%{top:36px}100%{top:calc(100% - 36px)}}
@media (prefers-reduced-motion:reduce){.finder .scanning{animation:none}}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
.ok{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:600;font-size:13px}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px;padding-bottom:8px}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;line-height:1.5;font-size:15px;white-space:pre-wrap}
.msg.ai{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start}
.msg.me{background:var(--brand);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.msg .meta{font-size:11px;color:var(--faint);margin-top:4px}
.stepcard{align-self:flex-start;max-width:88%;background:#fff;border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:6px;overflow:hidden}
.stepcard .pic{aspect-ratio:16/9;background:linear-gradient(135deg,#E8ECF0,#CBD2DA);display:grid;place-items:center;color:#3A4552;font-size:13px;position:relative}
.stepcard button.pic{width:100%;border:0;padding:0;font:inherit;cursor:pointer;appearance:none}
.stepcard .video-poster{background:linear-gradient(135deg,#1F2A30,#3A4A50)}
.stepcard .video-badge{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.94);color:var(--brand-ink);padding:3px 8px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.02em}
.stepcard .pic .play{width:44px;height:44px;border-radius:50%;background:rgba(23,28,34,.75);display:grid;place-items:center;color:#fff}
.stepcard .pic small{position:absolute;right:8px;bottom:8px;background:rgba(23,28,34,.75);color:#fff;padding:2px 6px;border-radius:4px;font-size:11px}
.stepcard .body{padding:12px 14px;font-size:14px}
.stepcard .video-copy{font-size:13px;line-height:1.5;color:var(--ink);margin:0 0 10px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.stepcard .body b{display:block;margin-bottom:4px}
.stepcard ol{margin:6px 0 0;padding-left:18px}
.stepcard li{margin:3px 0}
.quick{display:flex;gap:8px;flex-wrap:wrap;align-self:flex-start}
.quick button{border:1px solid var(--brand);color:var(--brand-ink);background:#fff;border-radius:18px;padding:7px 13px;font-size:14px}
.typing{align-self:flex-start;display:inline-flex;gap:4px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:6px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.3}40%{opacity:1}}
.composer{flex:none;display:flex;gap:8px;align-items:flex-end;padding:10px 14px 24px;background:#fff;border-top:1px solid var(--line)}
.composer textarea{flex:1;border:1px solid var(--line);border-radius:20px;padding:10px 14px;resize:none;outline:none;max-height:90px;font-size:15px;background:var(--bg)}
.composer .ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--muted);flex:none}
.composer .send{background:var(--brand);color:#fff;border:0}
.composer .send:disabled{background:#CBD2DA}
.composer .voice-main{flex:1;min-width:0;height:40px;border:1px solid var(--brand);border-radius:20px;background:var(--brand-soft);color:var(--brand-ink);display:flex;align-items:center;gap:8px;padding:0 11px;text-align:left}
.composer .voice-main .voice-symbol{width:25px;height:25px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.composer .voice-main .voice-text{min-width:0;display:flex;flex-direction:column;line-height:1.15}
.composer .voice-main .voice-text b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.composer .voice-main .voice-text small{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.composer .voice-wave{margin-left:auto;display:flex;align-items:center;gap:2px;height:18px;flex:none}
.composer .voice-wave i{display:block;width:2px;height:5px;border-radius:2px;background:var(--brand);opacity:.35}
.composer .voice-main.recording{background:#FDECEC;border-color:#EFB3B3;color:#A32626;animation:voicepulse 1.2s ease-in-out infinite}
.composer .voice-main.recording .voice-symbol{background:#B42323}
.composer .voice-main.recording .voice-wave i{opacity:1;animation:wavebar .7s ease-in-out infinite}
.composer .voice-main.recording .voice-wave i:nth-child(2){animation-delay:.12s}
.composer .voice-main.recording .voice-wave i:nth-child(3){animation-delay:.24s}
.composer.text-mode .voice-main{display:none}
.composer:not(.text-mode) textarea{display:none}
@keyframes voicepulse{0%,100%{box-shadow:0 0 0 0 rgba(180,35,35,.15)}50%{box-shadow:0 0 0 7px rgba(180,35,35,0)}}
@keyframes wavebar{0%,100%{height:5px}50%{height:15px}}
.pm-note-anchor{position:relative;width:40px;height:40px;flex:none}
.pm-note-anchor>.ic{width:40px;height:40px}
.pm-note-badge{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border:2px solid #fff;border-radius:50%;background:#E56A2A;color:#fff;font-size:10px;font-weight:700;line-height:1;padding:0;display:grid;place-items:center;cursor:help;z-index:3;box-shadow:0 2px 7px rgba(32,38,45,.22)}
.pm-note-tip{position:absolute;left:-2px;bottom:calc(100% + 10px);width:max-content;max-width:180px;padding:8px 10px;border-radius:8px;background:#20262D;color:#fff;font-size:12px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity .15s,transform .15s,visibility .15s;pointer-events:none;z-index:9999}
.pm-note-tip::after{content:"";position:absolute;left:15px;top:100%;border:6px solid transparent;border-top-color:#20262D}
.pm-note-anchor:hover .pm-note-tip,.pm-note-anchor:focus-within .pm-note-tip{opacity:1;visibility:visible;transform:translateY(0)}
.sysnote{text-align:center;color:var(--faint);font-size:12px;margin:4px 0}
.human{align-self:center;background:var(--amber-soft);color:#6B3A05;border-radius:12px;padding:8px 14px;font-size:13px;text-align:center}
.done-icon{width:64px;height:64px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:16px 0 8px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fff;outline:none;font-size:16px}
.inp:focus{border-color:var(--brand)}
.stars{display:flex;gap:6px;margin:4px 0 14px}
.stars button{border:0;background:none;font-size:28px;color:#CBD2DA;padding:0}
.stars button.on{color:#E0A100}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#1C232B;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;z-index:9;white-space:nowrap;pointer-events:none;max-width:90%;white-space:normal;text-align:center}
.toast.show{opacity:1}
.home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#171C22;opacity:.25}

/* ---- v2 ---- */
.finder.hasimg{background-size:cover;background-position:center}
.finder.hasimg .label{display:none}
.finder.hasimg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.15)}
.err{color:#B42323;font-size:13px;min-height:18px;margin-top:6px}
.snentry{display:none;margin-top:12px}
.row-sp{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500}
.tag.ai{background:var(--brand-soft);color:var(--brand-ink)} .tag.human,.tag.factory{background:var(--amber-soft);color:var(--amber)} .tag.done{background:#E6F2E6;color:#2F7D32}
.man{border-bottom:1px solid var(--line);padding:10px 0}
.man summary{cursor:pointer;font-weight:600}
.man ol{margin:8px 0 4px;padding-left:18px;font-size:14px;color:#2B333C}
.manual-video{width:100%;display:grid;grid-template-columns:76px 1fr;align-items:center;gap:11px;border:1px solid #DCE3E8;border-radius:12px;padding:8px;margin:10px 0;background:linear-gradient(135deg,#F7FAFB,#EDF2F4);text-align:left;color:var(--ink)}
.manual-video .thumb{height:52px;border-radius:8px;background:linear-gradient(135deg,#202A30,#405158);display:grid;place-items:center;color:#fff;position:relative;overflow:hidden}
.manual-video .thumb svg{width:24px;height:24px;padding-left:2px;border-radius:50%;background:rgba(255,255,255,.16)}
.manual-video .duration{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.55);padding:1px 5px;border-radius:4px;font-size:9px}
.manual-video .copy b{display:block;font-size:13px;margin-bottom:2px}
.manual-video .copy small{font-size:11px;color:var(--muted)}
.doc-view.show{padding:0;overflow:hidden;background:#EEF1F3}
.doc-scroll{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 18px;-webkit-overflow-scrolling:touch}
.doc-paper{background:#fff;border:1px solid #E0E5E9;border-radius:16px;padding:20px 17px;box-shadow:0 8px 24px rgba(27,33,41,.06)}
.doc-cover{padding-bottom:16px;border-bottom:1px solid var(--line)}
.doc-kicker{display:inline-flex;align-items:center;gap:5px;color:var(--brand-ink);background:var(--brand-soft);border-radius:999px;padding:3px 8px;font-size:10px;font-weight:700;letter-spacing:.04em}
.doc-paper h1{font-family:"Songti SC","Noto Serif SC",Georgia,serif;font-size:22px;line-height:1.3;margin:10px 0 6px}
.doc-paper h2{font-family:"Songti SC","Noto Serif SC",Georgia,serif;font-size:18px;margin:0 0 6px}
.doc-paper h3{font-size:12px;color:var(--muted);margin:14px 0 6px;letter-spacing:.03em}
.doc-paper p{font-size:13px;color:var(--muted);margin:0}
.doc-toc{display:flex;flex-direction:column;gap:5px;margin-top:14px}
.doc-toc button{border:0;background:#F5F7F8;border-radius:8px;padding:8px 10px;text-align:left;color:#34404A;font-size:12px}
.doc-section{padding:18px 0;border-bottom:1px solid var(--line)}
.doc-section:last-child{border-bottom:0}
.doc-section .doc-section-count{font-size:10px;color:var(--faint);font-weight:700;letter-spacing:.08em;margin-bottom:5px}
.doc-section ol{margin:8px 0 12px;padding-left:20px;font-size:13px;line-height:1.65;color:#2B333C}
.doc-note{background:#F5F8F7;border-left:3px solid var(--brand);border-radius:0 8px 8px 0;padding:9px 10px;font-size:12px;color:#4D5B62;line-height:1.55}
.doc-footer{padding-top:16px;font-size:11px;color:var(--faint);text-align:center}
.doc-chat-panel{flex:none;border-top:1px solid var(--line);background:#fff;padding:9px 12px 19px;box-shadow:0 -8px 24px rgba(27,33,41,.07)}
.doc-chat-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.doc-chat-head b{display:block;font-size:12px}
.doc-chat-head span{display:block;font-size:10px;color:var(--faint)}
.doc-chat-list{max-height:98px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:7px 0}
.doc-msg{max-width:92%;padding:7px 10px;border-radius:11px;font-size:12px;line-height:1.5}
.doc-msg.ai{background:var(--bg);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.doc-msg.user{background:var(--brand);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.doc-msg.typing{color:var(--muted)}
.doc-composer{display:flex;gap:7px;align-items:center}
.doc-composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:18px;padding:9px 12px;background:var(--bg);outline:none;font-size:13px}
.doc-composer input:focus{border-color:var(--brand)}
.doc-composer button{width:36px;height:36px;border:0;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.manual-support-link{margin:10px auto 0;border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:5px 8px}
.manual-support-link:hover{color:var(--brand-ink)}
.muted{color:var(--muted)} .small{font-size:12px}
</style>
</head>
<body>
<div class="stage">
  <div class="caption">
    <div class="langtoggle"><button id="tg-zh" onclick="setLang('zh')">中文</button><button id="tg-en" onclick="setLang('en')">English</button></div>
    <h2 data-i="cap_title"></h2>
    <p data-i="cap_p"></p>
    <ol class="flow" id="flow"></ol>
    <p style="margin-top:14px;font-size:12px;color:#6B7682" data-i="cap_hint"></p>
  </div>

  <div class="phone"><div class="notch"></div><div class="screen" id="screen">
    <div class="statusbar"></div>
    <div class="topbar">
      <button class="back" id="back" onclick="goBack()" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="logo">IP</div><b data-i="brand"></b><div class="sp"></div><button class="lang" id="langBadge" onclick="setLang(ui==='zh'?'en':'zh')" title="切换语言 / Switch language">ZH</button><button class="reset" id="resetDemo" onclick="resetDemo()" aria-label="重置演示" title="重置演示"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
    </div>
    <div class="prog"><i id="prog"></i></div>
    <div class="stepnote" id="stepnote"></div>

    <!-- 0 language -->
    <section class="view show" data-v="0">
      <h1 data-i="h1"></h1>
      <p class="lead" data-i="l1"></p>
      <div class="opts" id="langs"></div>
    </section>

    <!-- 1 landing -->
    <section class="view" data-v="1">
      <div class="card prod"><div class="img"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#3A4552" stroke-width="1.6"><path d="M4 4v16M20 4v16M4 12h16M7 9h2v6H7zM15 9h2v6h-2z"/></svg></div><div><b data-i="prod"></b><span data-i="prod_sub"></span></div></div>
      <h1 data-i="h0"></h1>
      <p class="lead" data-i="l0"></p>
      <div class="opts">
        <button class="opt" onclick="go(2)"><span class="n" data-i="o1"></span><span class="s">→</span></button>

const Policy = (() => {

  /* ---------- 取值：支持 "routing.l1.hours.value" 这种点路径 ---------- */
  function pathGet(obj, path){ return String(path).split('.').reduce((o,k)=> (o!=null && typeof o==='object') ? o[k] : undefined, obj); }
  function pathSet(obj, path, val){ const ks=String(path).split('.'); const last=ks.pop(); const tgt=ks.reduce((o,k)=>{ if(!o[k]||typeof o[k]!=='object') o[k]={}; return o[k]; }, obj); tgt[last]=val; }

  // 后台读 state.policy；H5 端没有 state，读从 localStorage 拿到的 adminState.policy
  function overrides(){
    if(typeof state!=='undefined' && state && state.policy && state.policy.values) return state.policy.values;
    if(typeof adminState!=='undefined' && adminState && adminState.policy && adminState.policy.values) return adminState.policy.values;
    return {};
  }
  function raw(path){ const ov=pathGet(overrides(), path); return ov!==undefined ? ov : pathGet(POLICY_DEFAULTS, path); }
  function get(path){ const v=raw(path); return (v && typeof v==='object' && 'value' in v) ? v.value : v; }
  function def(path){ return pathGet(POLICY_DEFAULTS, path); }
  function label(path){ const d=def(path); return d && d.label ? d.label : path; }

  /* ---------- 修改：范围校验 + 审计 ---------- */
  function set(path, val){
    const d=def(path);
    if(!d || typeof d!=='object' || !('value' in d)) throw new Error(`政策项 ${path} 不存在`);
    if(d.locked) throw new Error(`政策项「${label(path)}」已锁定，需技术与业务双签后才能修改`);

    if(Array.isArray(d.value)){ if(!Array.isArray(val)) throw new Error(`${label(path)} 必须是词表`); v=val.slice(); }

    const curInjury=get('hardRuleWords.'+rule+'.injury'), curParts=get('hardRuleWords.'+rule+'.parts');

    const node = kind ? pathGet(POLICY_DEFAULTS,'hardRuleWords.'+rule+'.'+kind) : pathGet(POLICY_DEFAULTS,'hardRuleWords.'+rule);
    if(!node || !Array.isArray(node.value)) throw new Error('该规则没有可编辑词表');
    if(node.locked) throw new Error(`「${node.label||rule}」已锁定，需技术与业务双签后才能修改`);
    const cur=get('hardRuleWords.'+rule+(kind?'.'+kind:''));
    if(cur.map(x=>x.toLowerCase()).includes(w.toLowerCase())) throw new Error('这个词已经在表里');

    const cur=get('hardRuleWords.'+rule+(kind?'.'+kind:''));

  function canShip(issue, facts){

    if(value==null) return {ok:false, reasons:['noPrice']};
    const limit=v.autoCommitLimitUsd;

              fr:(c)=>`Merci, ${c.name}. Sur la vidéo, le verrou ne revient pas complètement : cela indique un ressort de torsion usé dans l'ensemble verrou. Ne posez plus la barre de ce côté avant le remplacement et gardez les butées de sécurité.\n\nL'ensemble verrou de sécurité (pièce SC-SM9-004) est couvert par la garantie. ${c.shipText} Le remplacement prend environ 10 minutes ; je vous envoie la vidéo.`,
              zh:(c)=>`${hi(c.name)}从视频看锁扣回弹不足，是锁扣总成里的扭簧失效。更换前请不要在这一侧挂杆，并保持安全挡在位。\n\n安全锁扣总成（零件 SC-SM9-004）在保修范围内。${c.shipText}自己更换约 10 分钟，我把视频发你。` },
      steps:{ zh:['停止使用该侧锁扣，保持安全挡在位。','拆下锁扣盖板（2 颗 M6）。','整体更换锁扣总成，按原扭矩拧紧。','挂杆 3 次确认回弹到位。'], en:['Stop using that side; keep the safety stops set.','Remove the catch cover (2 × M6).','Replace the whole catch assembly and re-tighten.','Rack the bar 3 times to confirm it springs back.'] }, stepTitle:{zh:'更换安全锁扣总成',en:'Replace the safety catch assembly'} },

      kw:{ en:['e07','error','stops','stopped','overheat','motor','shuts'], de:['e07','fehlercode','stoppt','motor','überhitz'], es:['e07','error','se para','motor','calienta'], fr:['e07','erreur','arrête','moteur','chauffe'], sv:['e07','fel','stannar','motor'], zh:['e07','报错','停机','过热','电机','跑了一会'] },
      reply:{ en:(c)=>`Thanks, ${c.name}. E07 means the motor controller detected overheating. Nine times out of ten it's the running belt needing lubrication, which makes the motor work harder. Please: 1) unplug for 30 minutes, 2) apply the included silicone lubricant under the belt, 3) run 10 minutes at 4 km/h. If E07 returns, reply here and we'll replace the control board under warranty.`,
              de:(c)=>`Danke, ${c.name}. E07 bedeutet, dass die Motorsteuerung Überhitzung erkannt hat. Meist fehlt dem Laufband Schmierung. Bitte: 1) 30 Minuten vom Netz trennen, 2) das mitgelieferte Silikonöl unter das Laufband geben, 3) 10 Minuten bei 4 km/h laufen lassen. Kommt E07 wieder, antworten Sie hier – dann tauschen wir die Steuerplatine auf Garantie.`,
              es:(c)=>`Gracias, ${c.name}. E07 significa que el controlador detectó sobrecalentamiento; casi siempre la cinta necesita lubricación. Por favor: 1) desenchufa 30 minutos, 2) aplica el lubricante de silicona incluido bajo la cinta, 3) usa 10 minutos a 4 km/h. Si E07 vuelve, responde aquí y cambiamos la placa en garantía.`,
              fr:(c)=>`Merci, ${c.name}. E07 signifie que le contrôleur moteur a détecté une surchauffe ; le plus souvent la bande manque de lubrification. Merci de : 1) débrancher 30 minutes, 2) appliquer le lubrifiant silicone fourni sous la bande, 3) marcher 10 minutes à 4 km/h. Si E07 revient, répondez ici et nous remplacerons la carte sous garantie.`,
              zh:(c)=>`${hi(c.name)}E07 表示电机控制器检测到过热，十有八九是跑带缺润滑导致电机负载偏高。请：1）断电 30 分钟；2）在跑带下涂抹随机附带的硅油；3）以 4 km/h 跑 10 分钟。如果 E07 再出现，回复我，我们在保修内更换控制板。` },
      steps:{ zh:['断电 30 分钟。','掀起跑带边缘，在跑板上涂硅油（两侧各一条）。','通电后 4 km/h 运行 10 分钟。'], en:['Unplug for 30 minutes.','Lift the belt edge and apply silicone lubricant to the deck (one line each side).','Power on and run 10 minutes at 4 km/h.'] }, stepTitle:{zh:'E07 排查',en:'E07 troubleshooting'} },
    { id:'belt', product:'TR-650', cat:{zh:'跑带偏移 / 润滑',en:'Belt drifting / lubrication'}, part:null, partName:null, partValue:0, safety:false, video:'0:38',
      kw:{ en:['belt','drift','lubricat','lubricate','slips','off-center','centre'], de:['laufband','schmier','verrutscht','mittig'], es:['cinta','lubric','descentr'], fr:['bande','lubrif','décentr','tapis'], sv:['band','smörj'], zh:['跑带','偏','润滑','打滑','硅油'] },
      reply:{ en:(c)=>`Thanks, ${c.name}. Belt drift is adjusted with the two rear bolts: turn the bolt on the side the belt drifts toward a quarter turn clockwise, run at 4 km/h for a minute, repeat if needed. Lubricate every 3 months or 100 km — I'll send the short video.`,
              de:(c)=>`Danke, ${c.name}. Das Laufband wird mit den beiden hinteren Schrauben justiert: die Schraube auf der Seite, zu der das Band wandert, eine Vierteldrehung im Uhrzeigersinn, dann eine Minute bei 4 km/h laufen lassen. Alle 3 Monate oder 100 km schmieren – ich sende das Video.`,
              es:(c)=>`Gracias, ${c.name}. La cinta se centra con los dos tornillos traseros: gira un cuarto de vuelta en sentido horario el del lado hacia el que se desvía, usa un minuto a 4 km/h y repite si hace falta. Lubrica cada 3 meses o 100 km; te envío el vídeo.`,
              fr:(c)=>`Merci, ${c.name}. La bande se recentre avec les deux vis arrière : un quart de tour dans le sens horaire du côté où elle dérive, puis une minute à 4 km/h. Lubrifiez tous les 3 mois ou 100 km ; je vous envoie la vidéo.`,
              zh:(c)=>`${hi(c.name)}跑带偏移用后端两颗调节螺栓校正：偏向哪一侧，就把那一侧顺时针拧四分之一圈，4 km/h 跑一分钟，必要时重复。每 3 个月或 100 公里润滑一次，我把短视频发你。` },

      kw:{ en:['noise','noisy','grinding','rattle','humming','resistance','motor','clunk'], de:['geräusch','laut','brummt','rattert','widerstand'], es:['ruido','zumbido','vibra','resistencia'], fr:['bruit','grince','vibre','résistance'], sv:['ljud','oljud','skrammel','motstånd'], zh:['异响','噪音','响','咔','嗡','阻力'] },
      reply:{ en:(c)=>`Thanks, ${c.name}. A humming or rattling from the resistance unit on the RW-300 is almost always the damper pads under the motor bracket — they compress over time. The damper pad set (part RB-RW3-010) is free under warranty. ${c.shipText} Swapping them takes 10 minutes. If the noise is a grinding sound, please send a short video so we can check the flywheel.`,

              es:(c)=>`Gracias, ${c.name}. Un zumbido o traqueteo de la unidad de resistencia del RW-300 casi siempre son las almohadillas bajo el soporte del motor. El juego de almohadillas (pieza RB-RW3-010) es gratuito en garantía. ${c.shipText} El cambio lleva 10 minutos. Si es un ruido de roce, envía un vídeo corto.`,
              fr:(c)=>`Merci, ${c.name}. Un bourdonnement ou un cliquetis de l'unité de résistance du RW-300 vient presque toujours des patins amortisseurs sous le support moteur. Le jeu de patins (pièce RB-RW3-010) est gratuit sous garantie. ${c.shipText} Le remplacement prend 10 minutes. Si c'est un grincement, envoyez une courte vidéo.`,
              zh:(c)=>`${hi(c.name)}RW-300 阻力单元的嗡鸣或咔哒声，基本都是电机支架下的减震垫老化压扁了。减震垫一套（零件 RB-RW3-010）保修内免费。${c.shipText}更换 10 分钟。如果是金属摩擦声，请拍一段短视频，我们要检查飞轮。` },
      steps:{ zh:['拆下阻力单元护罩（4 颗螺丝）。','松开电机支架两颗螺栓，取出旧减震垫。','装入新垫，按原扭矩拧紧。'], en:['Remove the resistance unit cover (4 screws).','Loosen the two bracket bolts and take out the old pads.','Fit the new pads and re-tighten.'] }, stepTitle:{zh:'更换减震垫',en:'Replace damper pads'} },

      reply:{ en:(c)=>`Thanks, ${c.name}. For ${c.product} the bracket is bonded at the factory, and if it has come loose or is sticking, try this first: 1) warm the joint for 2–3 minutes with a hair dryer (not a heat gun or naked flame), 2) clean the residue with Loctite SF 7063 cleaner and a cloth. If it still won't come apart, reply here — we'll replace the bracket.`,

              sv:(c)=>`Tack, ${c.name}. På ${c.product} är fästet fabrikslimmat. Om det lossnat eller kärvar: 1) värm fogen 2–3 minuter med hårtork (inte värmepistol eller öppen låga), 2) rengör resterna med Loctite SF 7063 och en trasa. Lossnar det fortfarande inte, svara här så byter vi fästet.`,
              zh:(c)=>`${hi(c.name)}${c.product} 的滑轮架是出厂粘接的。如果已经脱胶或卡住，请先这样试：1）用吹风机加热粘接处 2–3 分钟（不要用热风枪或明火）；2）用 Loctite SF 7063 清洁剂配合抹布清理残胶。如果还是拆不开，回复我，我们给你更换滑轮架。` },

  /* ---------- 语言识别 ---------- */
  const LANG_HINTS = { de:[' der ',' die ',' das ',' und ',' nicht ',' ist ',' ich ',' nach ',' bei ',' mit ',' hallo ',' mein ',' kann ',' was '], es:[' el ',' que ',' no ',' es ',' un ',' una ',' los ',' del ',' hola ',' falta ',' mi ',' cómo ',' puedo ',' tengo '], fr:[' le ',' les ',' est ',' pas ',' une ',' des ',' je ',' ne ',' comment ',' bonjour ',' mon ',' ma ',' vous ',' merci ',' votre '], sv:[' och ',' att ',' det ',' är ',' inte ',' jag ',' på ',' med ',' den ',' hej ',' min ',' fel '], it:[' il ',' che ',' non ',' una ',' per ',' con ',' sono ',' ciao ',' mio '], en:[' the ',' is ',' and ',' not ',' it ',' my ',' on ',' after ',' does ',' i ',' hi ',' can '] };
  const ACCENTS = { de:/[äöüß]/g, es:/[ñ¿¡]/g, fr:/[çèêàù]/g, sv:/[å]/g };
  function detectLang(text){
    if(/[一-鿿]/.test(text)) return 'zh';
    const t=' '+text.toLowerCase().replace(/[.,!?;:()\n]/g,' ')+' ';
    const score={}; for(const [l,ws] of Object.entries(LANG_HINTS)) score[l]=ws.reduce((a,w)=>a+(t.split(w).length-1),0);
    for(const [l,re] of Object.entries(ACCENTS)){ const n=(t.match(re)||[]).length; if(n) score[l]=(score[l]||0)+n*2; }
    let best='en', bs=0; for(const [l,s] of Object.entries(score)) if(s>bs){ bs=s; best=l; }
    return best;
  }

  /* ---------- 客户回信意图：否定优先 ---------- */

  const RE_HUMAN=/\b(human|real person|a person|someone|agent|technician|mitarbeiter|mensch|techniker|persona|humano|técnico|quelqu'un|conseiller|technicien|människa|tekniker)\b|人工|真人|客服|技术人员|上门/i;

                 sv:(n,c)=>`Tack, ${n}. Jag har lämnat ärendet till vårt supportteam så att en person kan bekräfta lösningen – svar inom 4 timmar som regel, via e-post.${LOGGED.sv(c)}`,

const LANGS=[['中文','ZH','zh','zh'],['English','EN','en','en'],['Deutsch','DE','en','de'],['Español','ES','en','es'],['Français','FR','en','fr'],['Italiano','IT','en','it'],['Svenska','SV','en','sv']].filter(l=>l[3]==='zh'||l[3]==='en'||settings.h5Langs.includes(l[3]));

/* ---------- 状态 ---------- */
let ui='zh', badge='ZH', custLang='zh', v=0, hist=[], labelDone=false, serial=null, photos=0, videos=0, photoUrl=null, chatStep=0, asks=0, lastAction=null, voiceOn=false, inputMode='voice';   // lastAction: AI 上一步是 reply / ask / hold
let ticket=null; // {id, createdAt, status, transcript[], email, rating, kbId, issue}
const t=k=>I18N[ui][k];
const T0=(k,...a)=>{ const x=I18N[ui][k]; return typeof x==='function'?x(...a):x; };
// 步骤号：0 语言 · 1 落地 · 2 标签 · 3 对话 · 4 收尾（m/t 是侧路，不计步）
const STEPS=4;
const stepOf=n=>(n==='m'||n==='t'||n==='d')?-1:(n<=1?0:n===2?1:n===3?2:3);   // 落地页、说明书等侧路不改变主流程进度

function setLang(l,b,cl){ ui=l; badge=b||(l==='zh'?'ZH':'EN'); custLang=cl||l; document.documentElement.lang=l==='zh'?'zh-CN':'en';
  document.querySelectorAll('[data-i]').forEach(el=>{ const val=t(el.dataset.i); if(typeof val==='string') el.textContent=val; });
  $('#langBadge').textContent=badge; $('#tg-zh').classList.toggle('on',l==='zh'); $('#tg-en').classList.toggle('on',l==='en');
  $('#flow').innerHTML=t('flow').map((s,i)=>`<li class="${i===stepOf(v)?'on':''}">${s}</li>`).join(''); $('#stepnote').textContent=stepOf(v)>=0?`${stepOf(v)+1} / ${STEPS} · ${t('flow')[stepOf(v)]}`:'';
  $('#langs').innerHTML=LANGS.map(x=>`<button class="opt ${x[1]===badge?'on':''}" onclick="pickLang('${x[2]}','${x[1]}','${x[3]}')"><span class="flag"></span><span class="n">${x[0]}</span><span class="s">${x[1]}</span></button>`).join('');
  $('#ta').placeholder=t('ph_msg'); $('#email').placeholder=t('ph_email'); $('#snInput').placeholder=t('sn_ph'); $('#trackInput').placeholder='T-2611-0312';
  updateVoiceUI(); updateInputModeUI();
  $('#resetDemo').setAttribute('aria-label',t('reset_label')); $('#resetDemo').title=t('reset_label');
  $('#manualAsk').placeholder=t('doc_ask_ph'); $('#manualAskBtn').setAttribute('aria-label',t('doc_send'));
  $('#t2').textContent=labelDone?t('h2b'):t('h2'); $('#l2').textContent=labelDone?t('l2b'):t('l2'); $('#hint').textContent=labelDone?t('hint_ok'):t('hint');
  $('#appBtn').style.display=settings.h5App?'flex':'none'; $('#emailBlock').style.display=settings.h5Email?'block':'none';
  if(ticket) $('#h5title').textContent=t('h5').replace('{id}',ticket.id);
  renderLabelResult(); renderManual(); if(v==='d') renderManualDoc(true); if(v===3&&ticket) rerenderChat(); }
function toast(s){ const e=$('#toast'); e.textContent=s; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),2200); }
function go(n,push=true){ if(push) hist.push(v); v=n; document.querySelectorAll('.view').forEach(s=>s.classList.toggle('show',s.dataset.v===String(n))); const s=stepOf(n); $('#prog').style.width=(s>=0?(s+1)/STEPS*100:'')+'%'; $('#back').classList.toggle('show',n!==0&&n!==3&&n!==4); $('#composer').style.display=n===3?'flex':'none'; document.querySelectorAll('#flow li').forEach((li,i)=>li.classList.toggle('on',i===s)); $('#stepnote').textContent=s>=0?`${s+1} / ${STEPS} · ${t('flow')[s]}`:''; if(n===4&&ticket) $('#h5title').textContent=t('h5').replace('{id}',ticket.id); const vw=document.querySelector('.view.show'); if(vw) vw.scrollTop=0; }
function goBack(){ if(hist.length) go(hist.pop(),false); }
function resetDemo(){ if(photoUrl){ URL.revokeObjectURL(photoUrl); photoUrl=null; } ticket=null; v=0; hist=[]; photos=0; videos=0; chatStep=0; asks=0; lastAction=null; voiceOn=false; inputMode='voice'; $('#chat').innerHTML=''; $('#ta').value=''; $('#ta').style.height='auto'; $('#email').value=''; $('#snInput').value=''; $('#trackInput').value=''; $('#trackResult').innerHTML=''; $('#manualDoc').innerHTML=''; $('#manualChat').innerHTML=''; $('#manualAsk').value=''; $('#h5title').textContent=''; document.querySelectorAll('#stars button').forEach(b=>b.classList.remove('on')); resetLabel(); setLang('zh'); go(0,false); toast(t('reset_done')); }
function pickLang(l,b,cl){ setLang(l,b,cl); go(1); }

/* ---------- 标签识别 ---------- */
function onPhoto(input){ const f=input.files&&input.files[0]; if(!f) return; if(photoUrl) URL.revokeObjectURL(photoUrl); photoUrl=URL.createObjectURL(f); const fd=$('#finder'); fd.style.backgroundImage=`url(${photoUrl})`; fd.classList.add('hasimg'); fd.classList.add('busy'); $('#hint').textContent=t('hint_busy');
  // 识别：原型里无法做真正的 OCR，用文件内容的哈希生成一个本批次内的序列号，并走真实的序列号校验与订单匹配
  const reader=new FileReader(); reader.onload=()=>{ const bytes=new Uint8Array(reader.result.slice(0,65536)); let h=7; for(let i=0;i<bytes.length;i+=97) h=(h*31+bytes[i])>>>0; const num=String(100+h%1100).padStart(5,'0'); const po=productOrders.length?productOrders[h%productOrders.length]:null; const batch=po?po.batches[0]:'24A'; const sn=`${product.snPrefix}-${batch}-${num}`; setTimeout(()=>{ fd.classList.remove('busy'); applySerial(sn,true); },1400); }; reader.readAsArrayBuffer(f.slice(0,65536)); input.value=''; }
function applySerial(sn,fromPhoto){ const p=Engine.parseSerial(sn); if(!p||!p.valid){ $('#hint').textContent=t('hint_fail'); $('#snErr').textContent=fromPhoto?'':t('sn_bad'); return false; } if(p.product!==product.id){ $('#snErr').textContent=t('sn_wrong'); $('#hint').textContent=t('hint_fail'); return false; } serial=p; labelDone=true; photos+=fromPhoto?1:0; $('#snErr').textContent=p.order?'':t('sn_noorder'); $('#hint').textContent=t('hint_ok'); $('#t2').textContent=t('h2b'); $('#l2').textContent=t('l2b'); $('#labelActions').style.display='none'; $('#snEntry').style.display='none'; $('#labelConfirm').style.display='block'; renderLabelResult(); return true; }
function renderLabelResult(){ const box=$('#labelResult'); if(!serial){ box.style.display='none'; return; } box.style.display='block'; box.innerHTML=`<div class="ok">${t('ok')}</div><div class="kv" style="margin-top:10px"><span>${t('k_model')}</span><span><b>${t('prod')}</b></span><span>${t('k_sn')}</span><span>${serial.sn}</span><span>${t('k_batch')}</span><span>${serial.batch}</span><span>${t('k_via')}</span><span>${serial.dealer?serial.dealer+' ('+serial.city+')':'—'}</span><span>${t('k_war')}</span><span>${serial.warrantyUntil?t('war_active')+' '+serial.warrantyUntil:t('war_unknown')}</span></div>`; }
function showSnEntry(){ $('#snEntry').style.display='block'; $('#labelActions').style.display='none'; $('#snInput').focus(); }
function checkSn(){ const v=$('#snInput').value.trim().toUpperCase(); if(applySerial(v,false)) toast(t('hint_ok')); }
function resetLabel(){ labelDone=false; serial=null; const fd=$('#finder'); fd.style.backgroundImage=''; fd.classList.remove('hasimg'); $('#labelResult').style.display='none'; $('#labelActions').style.display='block'; $('#labelConfirm').style.display='none'; $('#snEntry').style.display='none'; $('#snErr').textContent=''; $('#hint').textContent=t('hint'); $('#t2').textContent=t('h2'); $('#l2').textContent=t('l2'); }
function skipLabel(){ startChat(); }   // 标签看不清也能进对话，工单照样先建

/* ---------- 工单与收件箱 ---------- */
function newTicketId(){ const d=new Date(); return `T-${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,'0')}-${9000+Math.floor(Math.random()*999)}`; }
function syncInbox(){ if(!ticket) return; try{ const box=JSON.parse(localStorage.getItem(INBOX_KEY)||'[]'); const i=box.findIndex(x=>x.id===ticket.id); const rec={ id:ticket.id, createdAt:ticket.createdAt, lang:custLang, product:product.id, sn:serial?serial.sn:null, issue:ticket.issue, photos, videos, email:ticket.email||null, name:ticket.name||null, status:ticket.status, rating:ticket.rating||null, kbId:ticket.kbId, ship:ticket.ship||null, pendingShip:ticket.pendingShip||null, transcript:ticket.transcript.map(m=>({who:m.who,text:m.text,tr:m.tr||'',t:m.t})) }; if(i>=0) box[i]=rec; else box.push(rec); localStorage.setItem(INBOX_KEY,JSON.stringify(box.slice(-50))); }catch(e){} }

/* ---------- 对话 ---------- */
function add(html){ $('#chat').insertAdjacentHTML('beforeend',html); const s=document.querySelector('.view[data-v="3"]'); s.scrollTop=s.scrollHeight; }
function typing(then,ms=900){ add('<div class="typing" id="ty"><i></i><i></i><i></i></div>'); setTimeout(()=>{ const x=$('#ty'); if(x) x.remove(); then(); },ms); }
function record(who,text,tr){ ticket.transcript.push({who,text,tr,t:Date.now()}); syncInbox(); }
function aiMsg(text,tr){ record('ai',text,tr); add(`<div class="msg ai">${esc(text)}<div class="meta">${t('c_meta')}</div></div>`); }
function playVideo(){ toast(t('video_play')); }
function stepCard(kb){ const sl=ui==='zh'?'zh':'en'; const intro=kb.video?T0('c_video_intro',kb.cat[sl]):''; const media=kb.video?`<button type="button" class="pic video-poster" onclick="playVideo()" aria-label="${t('video_play')}"><span class="video-badge">${t('video_label')}</span><span class="play"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span><small>${kb.video}</small></button>`:`<div class="pic"><span class="muted small">${kb.cat[sl]}</span></div>`; return `<div class="stepcard">${media}<div class="body">${intro?`<div class="video-copy">${esc(intro)}</div>`:''}<b>${kb.stepTitle[sl]}</b><ol>${kb.steps[sl].map(s=>`<li>${s}</li>`).join('')}</ol></div></div>`; }
function quick(list){ return `<div class="quick" id="q1">${list.map(([label,fn])=>`<button onclick="${fn}">${label}</button>`).join('')}</div>`; }
function clearQuick(){ const q=$('#q1'); if(q) q.remove(); }
function mediaQuick(){ return [[t('q_video'),'simVideo()'],[t('q_photo'),'simPhoto()']]; }
function routeName(){ return (typeof Policy!=='undefined'&&Policy.get('routing.l1.name'))||'Zhang Rui'; }
function routeHours(){ return (typeof Policy!=='undefined'&&Policy.get('routing.l1.hours'))||4; }
function ctx(){ return { lang:custLang, name:'', dealer:serial&&serial.dealer||'our warehouse', city:serial&&serial.city||'Europe', hasSerial:!!serial, hasPhotos:photos>0||videos>0, hours:routeHours() }; }
function assessNow(text){
  // 原型固定演示意图：只要提到跑带偏移 / 润滑，就命中带视频的跑带解决方案。
  const beltVideoIntent=/(跑带|跑步带)/.test(text||'')&&/偏|润滑|上油/.test(text||'');
  const a=Engine.assess({ text, product:beltVideoIntent?'TR-650':product.id, serial, photos:photos+videos, email:ticket&&ticket.email||'', settings });
  if(beltVideoIntent){ const entry=Engine.KB.find(k=>k.id==='belt'); a.match={entry,hits:99,runnerUp:null,ambiguous:false}; a.confidence=Math.max(a.confidence,95); a.reasons=[]; a.route='ai'; a.action='reply'; a.canShip=false; }
  return a;
}

// 开场即建单：客户打第一个字之前，工单已经在后台存在，并明确告知会有人接手。
// 没有分类表单、没有描述框——问题归类由 AI 从对话里判断（Engine.matchKB），客户只需要说话。
function startChat(){ if(ticket){ go(3); return; }   // 同一页面只建一张工单；重复点击不会重复建单
  ticket={ id:newTicketId(), createdAt:Date.now(), status:'ai', transcript:[], issue:'', kbId:null }; chatStep=0; asks=0; lastAction=null;
  syncInbox();   // 客户还没说一个字，后台已经有这张工单了
  go(3);
  $('#chat').innerHTML='';
  add(`<div class="sysnote">${T0('c_sys',serial)}</div>`);
  add(ticketCard());
  record('ai',T0('c_open',ticket.id),'开场：工单已建立并抄送人工，等客户描述问题');
  add(`<div class="msg ai">${esc(T0('c_open',ticket.id))}<div class="meta">${t('c_meta')}</div></div>`);
  chatIdle(); }
function ticketCard(){ return `<div class="card" style="align-self:stretch;border-color:var(--brand);background:var(--brand-soft)">
    <div class="row-sp"><b style="color:var(--brand-ink)">${T0('k_ticket_new',ticket.id)}</b><span class="tag ai">${ui==='zh'?'已人工同步':'Support notified'}</span></div>
    <div class="small" style="margin-top:6px;color:#2B333C">${T0('l_ticket',routeName())}</div></div>`; }
// 对话已开始但客户还没描述问题：给几个出口，避免空屏
function chatIdle(){ clearQuick(); add(quick([...mediaQuick(),[t('q_person'),"userSay(t('q_person'))"]])); }
function handover(reason){ ticket.status='human'; lastAction='hold'; syncInbox(); add(`<div class="human">${T0('c_handover',routeName(),routeHours())}</div>`); add(`<div class="msg ai">${T0('c_logged',ticket.id)}</div>`); record('sys',reason||'转人工',''); add(quick([[t('q_save'),'go(4)']])); }
function respond(text){ clearQuick(); const a=assessNow(text); const kb=a.match?a.match.entry:null; ticket.kbId=kb?kb.id:null; const tr=Engine.summarizeZh(a,{});
  if(a.route==='human'){ aiMsg(Engine.compose(a,ctx()),tr); setTimeout(()=>handover(tr),700); return; }
  if(a.action==='ask'){
    if(asks>=2){ aiMsg(Engine.compose({action:'hold'},ctx()),'AI 已追问 2 轮仍无法判断，转人工'); setTimeout(()=>handover('追问 2 轮后仍无法判断'),700); return; }   // 追问上限
    asks++; lastAction='ask'; aiMsg(Engine.compose(a,ctx()),tr); add(quick([...mediaQuick(),[t('q_person'),"userSay(t('q_person'))"]])); return; }
  lastAction='reply'; aiMsg(Engine.compose(a,ctx()),tr); if(kb) add(stepCard(kb));
  // 模板里一旦写了"将从 X 寄出"，承诺就成立 → 同步给后台扣库存（与邮件渠道口径一致）；无权承诺则记 pendingShip，后台生成"等你确认补发"
  if(Engine.offersPart(a)){ if(a.canShip){ ticket.ship=kb.part; record('sys',`AI 承诺寄送 ${kb.partName.zh}（${kb.part}）`,''); } else { ticket.pendingShip=kb.part; record('sys',`${kb.partName.zh}（${kb.part}，约 ${kb.partValue} 美元）超出 AI 可承诺范围，待品牌方确认`,''); } syncInbox(); }
  const q=[]; q.push([t('q_solved'),"userSay(t('q_solved'))"],[t('q_notfixed'),"userSay(t('q_notfixed'))"]); if(kb&&kb.part) q.push([t('q_tech'),"userSay(t('q_tech'))"]); q.push([t('q_person'),"userSay(t('q_person'))"]); add(quick(q)); }
function onChatMedia(input){ const f=input.files&&input.files[0]; if(!f) return; if((f.type||'').startsWith('video/')) simVideo(); else simPhoto(); input.value=''; }
const KEYBOARD_ICON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M6 10h1M10 10h1M14 10h1M18 10h.01M6 14h2M10 14h4M16 14h2"/></svg>';
const MIC_ICON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>';
function updateVoiceUI(){ const b=$('#voiceBtn'), title=$('#voiceTitle'), hint=$('#voiceHint'); b.classList.toggle('recording',voiceOn); b.setAttribute('aria-pressed',String(voiceOn)); b.setAttribute('aria-label',t(voiceOn?'voice_listening':'voice_prompt')); b.title=t(voiceOn?'voice_listening':'voice_prompt'); title.textContent=t(voiceOn?'voice_listening':'voice_prompt'); hint.textContent=t(voiceOn?'voice_hint_listening':'voice_hint'); }
function updateInputModeUI(){ const textMode=inputMode==='text'; $('#composer').classList.toggle('text-mode',textMode); $('#keyboardBtn').innerHTML=textMode?MIC_ICON:KEYBOARD_ICON; $('#keyboardBtn').setAttribute('aria-label',t(textMode?'switch_voice':'switch_text')); $('#keyboardBtn').title=t(textMode?'switch_voice':'switch_text'); }
function setInputMode(mode){ inputMode=mode; if(mode==='voice') voiceOn=false; updateVoiceUI(); updateInputModeUI(); if(mode==='text') setTimeout(()=>$('#ta').focus(),0); }
function toggleInputMode(){ setInputMode(inputMode==='voice'?'text':'voice'); }
function toggleVoice(){ if(inputMode!=='voice') setInputMode('voice'); voiceOn=!voiceOn; updateVoiceUI(); toast(t(voiceOn?'voice_start':'voice_stop')); }
function simPhoto(){ clearQuick(); photos++; const m=ui==='zh'?'[照片]':'[photo]'; record('cust',m,''); add(`<div class="msg me">${m}<div class="meta" style="color:rgba(255,255,255,.7)">${T0('c_photo',1)}</div></div>`); if(ticket.status==='human'){ typing(()=>{ aiMsg(t('c_noted'),'已有人工接手，照片附到工单'); add(quick([[t('q_save'),'go(4)']])); }); return; } typing(()=>respond(ticket.transcript.filter(x=>x.who==='cust'&&!/^\[/.test(x.text)).map(x=>x.text).join(' ')),900); }
function simVideo(){ clearQuick(); videos++; const m=ui==='zh'?'[视频]':'[video]'; record('cust',m,''); add(`<div class="msg me">${m}<div class="meta" style="color:rgba(255,255,255,.7)">${t('c_video')}</div></div>`); if(ticket.status==='human'){ typing(()=>{ aiMsg(t('c_noted'),'已有人工接手，视频附到工单'); add(quick([[t('q_save'),'go(4)']])); }); return; } typing(()=>respond(ticket.transcript.filter(x=>x.who==='cust'&&!/^\[/.test(x.text)).map(x=>x.text).join(' ')),900); }
function userSay(s){ $('#ta').value=s; sendMsg(); }
function sendMsg(){ const ta=$('#ta'); const s=ta.value.trim(); if(!s||!ticket) return; ta.value=''; ta.style.height='auto'; clearQuick();
  if(!ticket.issue) ticket.issue=s.slice(0,120);   // 工单先建、标题后补：客户说的第一句就是问题描述
  record('cust',s,''); add(`<div class="msg me">${esc(s)}</div>`); chatStep++;
  const intent=s===t('q_person')||s===t('q_tech')?'human':s===t('q_solved')?'solved':s===t('q_notfixed')?'notfixed':Engine.detectConfirm(s);   // 否定优先：“谢谢，但还是不行”不会被当成已解决
  if(intent==='solved'){ typing(()=>{ ticket.status='done'; lastAction=null; syncInbox(); aiMsg(t('c_solved'),'客户确认已解决'); add(quick([[t('q_save'),'go(4)']])); }); return; }
  if(ticket.status==='human'){ typing(()=>{ aiMsg(t('c_noted'),'已有人工接手，新消息附到工单'); add(quick([[t('q_save'),'go(4)']])); }); return; }   // 已转人工：AI 不再接话
  if(s===t('q_tech')){ typing(()=>{ ticket.status='human'; lastAction='hold'; syncInbox(); aiMsg(T0('c_tech',routeName(),routeHours()),'客户要求技术人员上门'); add(quick([[t('q_save'),'go(4)']])); }); return; }
  if(intent==='human'){ typing(()=>{ record('sys','客户要求转人工',''); handover('客户要求人工'); }); return; }
  if(intent==='notfixed'&&lastAction==='reply'){ typing(()=>{ ticket.status='human'; lastAction='hold'; syncInbox(); aiMsg(T0('c_notfixed',routeName(),routeHours()),'建议无效，不再重复猜测，转人工'); add(`<div class="human">${t('human_tag')}</div>`); add(quick([[t('q_save'),'go(4)']])); }); return; }   // 只有在给过方案之后，“还是不行”才算方案无效
  if(s===t('q_more')){ typing(()=>{ aiMsg(t('c_more'),''); }); return; }
  // 其他内容（包括追问后的补充说明）：重新评估
  typing(()=>respond(ticket.transcript.filter(x=>x.who==='cust'&&!/^\[/.test(x.text)).slice(-2).map(x=>x.text).join(' ')),900); }
function rerenderChat(){ $('#chat').innerHTML=''; add(`<div class="sysnote">${T0('c_sys',serial)}</div>`); add(ticketCard()); for(const m of ticket.transcript){ if(m.who==='sys') continue; if(m.who==='cust') add(`<div class="msg me">${esc(m.text)}</div>`); else add(`<div class="msg ai">${esc(m.text)}</div>`); } if(ticket.transcript.filter(m=>m.who==='cust').length===0) chatIdle(); }

/* ---------- 收尾 ---------- */
function saveEmail(){ const e=$('#email').value.trim(); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){ toast(t('email_bad')); return; } ticket.email=e; ticket.name=e.split('@')[0].replace(/[._]/g,' ').replace(/\b\w/g,c=>c.toUpperCase()); syncInbox(); toast(t('saved')+e); }
function rate(n){ document.querySelectorAll('#stars button').forEach((b,i)=>b.classList.toggle('on',i<n)); if(ticket){ ticket.rating=n; syncInbox(); } toast(t('thanks')); }

/* ---------- 查询进度 ---------- */
function track(){ const id=$('#trackInput').value.trim().toUpperCase(); let found=null; try{ const box=JSON.parse(localStorage.getItem(INBOX_KEY)||'[]'); found=box.find(x=>x.id===id); if(adminState){ const at=adminState.tickets.find(x=>x.id===id); if(at) found={id:at.id,status:at.status,createdAt:at.createdAt,issue:at.issue,transcript:at.timeline.filter(e=>e.who!=='sys').map(e=>({who:e.who==='cust'?'cust':'ai',text:e.text,t:e.t}))}; } }catch(e){} const box=$('#trackResult'); if(!found){ box.innerHTML=`<div class="card" style="color:var(--muted)">${t('track_none')}</div>`; return; } const st=t('st')[found.status]||found.status; box.innerHTML=`<div class="card"><div class="row-sp"><b>${found.id}</b><span class="tag ${found.status}">${st}</span></div><div class="muted small" style="margin:4px 0 10px">${new Date(found.createdAt).toLocaleString()} · ${esc(found.issue||'')}</div>${(found.transcript||[]).filter(m=>m.who!=='sys').slice(-3).map(m=>`<div class="small" style="padding:6px 0;border-top:1px solid var(--line)"><b>${m.who==='cust'?(ui==='zh'?'你':'You'):(m.who==='human'||m.who==='fact')?'IronPeak':(ui==='zh'?'助手':'Assistant')}</b> · ${esc(m.text.length>140?m.text.slice(0,140)+'…':m.text)}</div>`).join('')}</div>`; }

/* ---------- 说明书 ---------- */
function manualEntries(){ return Engine.KB.filter(k=>k.product===product.id||k.product==='*'); }
function manualVideoCard(kb){ const sl=ui==='zh'?'zh':'en'; return `<button type="button" class="manual-video" onclick="playVideo()" aria-label="${t('manual_video')}: ${kb.stepTitle[sl]}"><span class="thumb"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span class="duration">${kb.video||t('manual_video_short')}</span></span><span class="copy"><b>${t('manual_video')}</b><small>${kb.stepTitle[sl]}</small></span></button>`; }
function renderManual(){ const sl=ui==='zh'?'zh':'en'; const list=manualEntries(); $('#manualList').innerHTML=list.map(k=>`<details class="man"><summary>${k.cat[sl]}${k.video?` <span class="muted small">▶ ${k.video}</span>`:''}</summary>${manualVideoCard(k)}<ol>${k.steps[sl].map(s=>`<li>${s}</li>`).join('')}</ol>${k.part?`<div class="muted small">${ui==='zh'?'相关零件':'Part'}: ${k.partName[sl]} ${k.part}</div>`:''}</details>`).join(''); }
function renderManualDoc(resetChat=true){ const sl=ui==='zh'?'zh':'en'; const list=manualEntries(); const meta=T0('doc_meta',`${product.series[sl]} ${product.id}`,serial&&serial.sn); $('#manualDoc').innerHTML=`<div class="doc-cover"><span class="doc-kicker">IronPeak · ${product.id}</span><h1>${t('doc_heading')}</h1><p>${meta}</p><div class="doc-toc"><div class="small muted" style="font-weight:600;margin-bottom:2px">${t('doc_contents')}</div>${list.map((k,i)=>`<button onclick="scrollManualDoc('${k.id}')">${String(i+1).padStart(2,'0')} · ${k.cat[sl]}</button>`).join('')}</div></div>${list.map((k,i)=>`<section class="doc-section" id="doc-${k.id}"><div class="doc-section-count">${String(i+1).padStart(2,'0')}</div><h2>${k.cat[sl]}</h2><h3>${t('doc_steps')}</h3>${manualVideoCard(k)}<ol>${k.steps[sl].map(s=>`<li>${s}</li>`).join('')}</ol><div class="doc-note">${t('doc_note')}</div></section>`).join('')}<div class="doc-footer">IronPeak Fitness · ${product.id} · ${serial?serial.sn:''}</div>`; $('#manualAsk').placeholder=t('doc_ask_ph'); if(resetChat){ $('#manualChat').innerHTML=''; addManualMsg('ai',t('doc_ai_hello')); } }
function scrollManualDoc(id){ const el=document.getElementById('doc-'+id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }
function addManualMsg(who,text){ const box=$('#manualChat'); box.insertAdjacentHTML('beforeend',`<div class="doc-msg ${who}">${esc(text).replace(/\n/g,'<br>')}</div>`); box.scrollTop=box.scrollHeight; }
function askManual(){ const input=$('#manualAsk'); const q=input.value.trim(); if(!q) return; input.value=''; addManualMsg('user',q); const sl=ui==='zh'?'zh':'en'; const match=Engine.matchKB(q,product.id); const box=$('#manualChat'); box.insertAdjacentHTML('beforeend',`<div class="doc-msg ai typing" id="docTyping">${ui==='zh'?'正在查说明书…':'Checking the manual…'}</div>`); box.scrollTop=box.scrollHeight; setTimeout(()=>{ if(v!=='d') return; const ty=$('#docTyping'); if(ty) ty.remove(); const e=match&&match.entry; addManualMsg('ai',e?T0('doc_ai_found',e.cat[sl],e.steps[sl],!!e.video):t('doc_ai_none')); },650); }
function openManualDoc(){ renderManualDoc(true); go('d'); const sc=$('#docScroll'); if(sc) sc.scrollTop=0; }
function contactSupportFromManual(){ const existing=ticket; startChat(); clearQuick(); if(!existing||existing.status!=='human') handover('用户从说明书页联系客服'); else add(quick([[t('q_save'),'go(4)']])); }

/* ---------- 启动 ---------- */
$('#stars').innerHTML=[1,2,3,4,5].map(i=>`<button onclick="rate(${i})">★</button>`).join('');
setLang('zh');
go(0,false);   // 首帧就把进度条和步骤条摆到第 1 步
// 演示用直链：?go=chat 直接落到对话（可选 &sn=序列号、&demo=video 自动发送一个带视频卡的问题），方便演示/截图，不影响正常路径
if(qs.get('go')==='chat'){ const sn=qs.get('sn')||`${product.snPrefix}-${(productOrders[0]||{batches:['24B']}).batches[0]}-00955`; if(!applySerial(sn,false)) resetLabel(); startChat();
  if(qs.get('demo')==='video'){ const demoQ={belt:'跑带偏了，怎么润滑',e07:'跑步机报 E07 了',motor:'阻力电机有异响',assembly:'安装不会装'}; const demoKb=Engine.KB.find(k=>k.id==='belt'&&k.video&&(k.product===product.id||k.product==='*'))||Engine.KB.find(k=>k.video&&!k.safety&&(k.product===product.id||k.product==='*')); const question=demoKb&&demoQ[demoKb.id]; if(question) setTimeout(()=>{ const ta=$('#ta'); if(v!==3||!ticket||!ta) return; ta.value=question; sendMsg(); },300); }
}
if(qs.get('go')==='manual'){ const sn=qs.get('sn')||`${product.snPrefix}-${(productOrders[0]||{batches:['24B']}).batches[0]}-00955`; if(!applySerial(sn,false)) resetLabel(); go('m'); openManualDoc(); }
if(qs.get('go')==='manual-list'){ const sn=qs.get('sn')||`${product.snPrefix}-${(productOrders[0]||{batches:['24B']}).batches[0]}-00955`; if(!applySerial(sn,false)) resetLabel(); go('m'); }

</script>
</body>
</html>
